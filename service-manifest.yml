# Research Dashboard — service manifest
# Phase 1 produced by: Raclette
# Date: 2026-02-28

service:
  name: research-dashboard
  display_name: "Research Dashboard"
  description: "Local research workspace with charts + per-page chat history"
  class: first-class
  host: unraid

networking:
  port: 3036
  shared_ip: false
  ip: 192.168.20.57

container:
  image: research-dashboard:latest
  interactive_shell: false
  stateful: true
  unraid_icon_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/graph.png"

reverse_proxy:
  domain: research.klsll.com
  npm_upstream_port: 3000
  npm_proxy: true
  homepage_card: true
  homepage_group: "AI"
