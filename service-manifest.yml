# SearXNG MCP — service manifest
# Phase 1 produced by: Claude Sonnet 4.6
# Date: 2026-02-20

service:
  name: searxng-mcp
  display_name: "SearXNG MCP"
  description: "Privacy-respecting metasearch engine with MCP interface for AI agents"
  class: mcp
  host: unraid

networking:
  port: 6978
  transport: http
  shared_ip: true
  mcp_proxy:
    enabled: false
  director:
    enabled: true
    playbook: dev-core

container:
  # Two-container stack: SearXNG search engine + MCP HTTP adapter
  # SearXNG runs internally on port 8080; MCP adapter exposed on host port 6978
  searxng_image: "searxng/searxng:2026.2.20-93ac6ceb3"
  mcp_image: "isokoliuk/mcp-searxng:latest"
  interactive_shell: false
  stateful: true
  unraid_icon_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/searxng.png"
