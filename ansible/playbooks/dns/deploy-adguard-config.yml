---
# Deploy AdGuard Home configuration to agh1/agh2
#
# Usage:
#   ./scripts/run-playbook.sh adguard playbooks/dns/deploy-adguard-config.yml
#
# Secrets resolved from 1Password via ansible/envs/adguard.env (see
# docs/secrets-management.md). Both admin username and password live in the
# "AdGuard Admin" item in the "AI Wedge" vault.

- name: Deploy AdGuard Home configuration
  hosts: agh
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display target hosts
      ansible.builtin.debug:
        msg: "Deploying AdGuard config to {{ inventory_hostname }} ({{ ansible_host }})"

  roles:
    - role: adguard
