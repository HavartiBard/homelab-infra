---
# Deploy Obsidian Stack to Unraid (CouchDB + Obsidian MCP Server)
#
# CouchDB: backend for Obsidian LiveSync (desktop ↔ server vault sync)
# Obsidian MCP: HTTP server exposing vault read/write/search as MCP tools
#
# Transport: http on port 6977 (direct, no mcp-proxy needed).
# Vault path: /mnt/user/appdata/obsidian/vaults/homelab
#
# Prerequisites:
#   - Obsidian MCP Docker image built from docker/obsidian-mcp-server/
#     (the role builds it automatically)
#
# Usage:
#   ./scripts/run-playbook.sh obsidian playbooks/mcp/deploy-obsidian-stack.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/obsidian.env (see
# docs/secrets-management.md).

- name: Deploy Obsidian Stack (CouchDB + MCP Server)
  hosts: unraid
  gather_facts: false

  pre_tasks:
    - name: Assert CouchDB credentials are provided
      ansible.builtin.assert:
        that:
          - couchdb_admin_user | length > 0
          - couchdb_admin_password | length > 0
          - couchdb_sync_user | length > 0
          - couchdb_sync_password | length > 0
        fail_msg: >-
          Set COUCHDB_ADMIN_USERNAME/PASSWORD and COUCHDB_SYNC_USERNAME/PASSWORD
          env vars (from 1Password 'CouchDB Obsidian Admin'/'CouchDB Obsidian
          Sync User'), e.g. via ansible/envs/obsidian.env

  tasks:
    - name: Deploy CouchDB
      ansible.builtin.include_role:
        name: couchdb

    - name: Deploy Obsidian MCP Server
      ansible.builtin.include_role:
        name: obsidian-mcp

    - name: Register Obsidian stack in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: couchdb
            cluster: unraid-docker
            role: Application
            comments: "Obsidian LiveSync backend — http://{{ ansible_host }}:5984"
          - name: obsidian-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "Obsidian vault HTTP MCP — http://{{ ansible_host }}:{{ obsidian_mcp_port }}"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Obsidian stack deployed successfully!
          MCP endpoint:  http://{{ ansible_host }}:{{ obsidian_mcp_port }}/mcp
          Health:        curl http://{{ ansible_host }}:{{ obsidian_mcp_port }}/mcp
          CouchDB:       http://{{ ansible_host }}:5984/_utils
          Vault path:    {{ obsidian_vault_path }}
          Logs:          docker logs {{ obsidian_mcp_container_name }} -f
