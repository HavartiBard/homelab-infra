---
# Deploy 1Password MCP Server to Unraid
#
# Usage:
#   export OP_SERVICE_ACCOUNT_TOKEN='<from 1Password>'
#   ansible-playbook playbooks/mcp/deploy-onepassword-mcp.yml

- name: Deploy 1Password MCP to Unraid
  hosts: unraid
  gather_facts: false

  pre_tasks:
    - name: Verify OP_SERVICE_ACCOUNT_TOKEN is set
      ansible.builtin.fail:
        msg: >-
          OP_SERVICE_ACCOUNT_TOKEN must be set (env override) or resolvable
          via the configured 1Password item.
      when: op_service_account_token | length == 0

  roles:
    - role: onepassword-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: onepassword-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "1Password secrets MCP — via mcp-proxy http://{{ ansible_host }}:6980/servers/onepassword/mcp"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          1Password MCP deployed successfully!
          Endpoint via mcp-proxy: http://{{ ansible_host }}:6980/servers/onepassword/mcp
