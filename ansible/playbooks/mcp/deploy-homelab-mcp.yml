---
# Deploy Homelab MCP Server to Unraid
#
# Provides homelab-specific tools (Orbi router management, etc.)
# Transport: streamable-http on port 6971.
#
# Usage:
#   ./scripts/run-playbook.sh homelab-mcp playbooks/mcp/deploy-homelab-mcp.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/homelab-mcp.env (see
# docs/secrets-management.md).

- name: Deploy Homelab MCP to Unraid
  hosts: unraid
  gather_facts: false

  roles:
    - homelab-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: homelab-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "Orbi/NPM homelab MCP — http://{{ homelab_mcp_ip }}:{{ homelab_mcp_port }}/mcp"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Homelab MCP deployed successfully!
          Endpoint:  http://{{ homelab_mcp_ip }}:{{ homelab_mcp_port }}/mcp
          Health:    curl http://{{ homelab_mcp_ip }}:{{ homelab_mcp_port }}/mcp
          Logs:      docker logs {{ homelab_mcp_container_name }} -f
