---
- name: Deploy Chiffon Executor to Unraid
  hosts: unraid
  gather_facts: no

  roles:
    - chiffon-executor

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Chiffon Executor deployed.
          Image:   {{ chiffon_executor_image }}
          Repo:    {{ chiffon_executor_repo_dir }}
          Mode:    {{ chiffon_executor_execution_mode }} ({{ chiffon_executor_cron_schedule }})
          LLM:     {{ chiffon_executor_lmstudio_url }}
