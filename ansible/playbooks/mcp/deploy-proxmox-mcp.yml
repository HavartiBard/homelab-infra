---
# Deploy Proxmox MCP Server to Unraid
#
# Provides Proxmox VM/LXC management tools via MCP.
# Transport: streamable-http on port 6974.
#
# Usage:
#   ./scripts/run-playbook.sh proxmox-mcp playbooks/mcp/deploy-proxmox-mcp.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/proxmox-mcp.env (see
# docs/secrets-management.md).

- name: Deploy Proxmox MCP to Unraid
  hosts: unraid
  gather_facts: false

  roles:
    - role: proxmox-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: proxmox-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "Proxmox VE MCP — http://{{ ansible_host }}:{{ proxmox_mcp_port }}/mcp"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Proxmox MCP deployed successfully!
          Endpoint:  http://{{ ansible_host }}:{{ proxmox_mcp_port }}/mcp
          Health:    curl http://{{ ansible_host }}:{{ proxmox_mcp_port }}/mcp
          Container: {{ proxmox_mcp_container_name }}
          Logs:      docker logs {{ proxmox_mcp_container_name }} -f
