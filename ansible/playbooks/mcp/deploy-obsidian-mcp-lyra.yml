---
# Deploy a second, isolated Obsidian MCP instance for the raclette "lyra"
# Hermes profile — her own vault, never the homelab vault at
# /mnt/user/obsidian/homelab (core's obsidian-mcp instance).
#
# Mirrors playbooks/mcp/deploy-obsidian-stack.yml's obsidian-mcp role
# inclusion but with a separate container/port/vault directory, same
# pattern as deploy-gsuite-mcp-lyra.yml.
#
# Usage:
#   ansible-playbook playbooks/mcp/deploy-obsidian-mcp-lyra.yml --limit unraid

- name: Deploy Obsidian MCP (lyra instance) to Unraid
  hosts: unraid
  gather_facts: false
  vars:
    obsidian_mcp_container_name: "obsidian-mcp-lyra"
    obsidian_mcp_port: 6984
    obsidian_mcp_appdata_dir: "/mnt/user/appdata/obsidian-mcp-lyra"
    obsidian_vault_path: "/mnt/user/obsidian/lyra"

  roles:
    - obsidian-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: obsidian-mcp-lyra
            cluster: unraid-docker
            role: MCP Server
            comments: "Obsidian MCP (lyra's isolated vault) — http://{{ ansible_host }}:6984/mcp"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Obsidian MCP (lyra) deployed successfully!
          Endpoint: http://{{ ansible_host }}:6984/mcp
          Vault:    /mnt/user/obsidian/lyra (separate from the homelab vault)
