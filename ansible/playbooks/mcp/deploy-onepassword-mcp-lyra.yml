---
# Deploy a second, isolated 1Password MCP instance for the raclette "lyra"
# Hermes profile — scoped via a dedicated Service Account token to the
# "Blume" vault only. Never AI Wedge's default onepassword-mcp instance.
#
# The Blume-scoped Service Account token is stored in 1Password itself
# ("Service Account Auth Token: lyra" in the AI Wedge vault) and resolved
# via the ansible/envs/onepassword-mcp-lyra.env slug — see
# docs/secrets-management.md. This is an ordinary op:// secret, unlike the
# bootstrap OP_SERVICE_ACCOUNT_TOKEN (which can't reference itself).
#
# Usage:
#   ./scripts/run-playbook.sh onepassword-mcp-lyra playbooks/mcp/deploy-onepassword-mcp-lyra.yml --limit unraid

- name: Deploy 1Password MCP (lyra/Blume instance) to Unraid
  hosts: unraid
  gather_facts: false
  vars:
    onepassword_mcp_container_name: "onepassword-mcp-lyra"
    op_vault: "Blume"
    op_service_account_token: "{{ lookup('ansible.builtin.env', 'OP_SERVICE_ACCOUNT_TOKEN_LYRA') | default('', true) }}"

  pre_tasks:
    - name: Verify OP_SERVICE_ACCOUNT_TOKEN_LYRA resolved
      ansible.builtin.fail:
        msg: >-
          OP_SERVICE_ACCOUNT_TOKEN_LYRA did not resolve — confirm this playbook
          was run via ./scripts/run-playbook.sh onepassword-mcp-lyra ...
          (not bare ansible-playbook) and that the AI Wedge item
          "Service Account Auth Token: lyra" still exists.
      when: op_service_account_token | length == 0

  roles:
    - role: onepassword-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: onepassword-mcp-lyra
            cluster: unraid-docker
            role: MCP Server
            comments: "1Password MCP (lyra's Blume vault) — via mcp-proxy http://{{ ansible_host }}:6980/servers/onepassword-lyra/sse"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          1Password MCP (lyra/Blume) deployed successfully!
          Endpoint via mcp-proxy: http://{{ ansible_host }}:6980/servers/onepassword-lyra/sse
