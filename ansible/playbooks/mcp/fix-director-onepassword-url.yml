---
# Fix 1Password MCP URL in Director config
#
# The onepass / onepassword-mcp entries incorrectly pointed to
# http://192.168.20.14:6975/mcp (port never existed).
# The correct URL via mcp-proxy is:
# http://192.168.20.14:6980/servers/onepassword/sse
#
# Usage:
#   ansible-playbook playbooks/mcp/fix-director-onepassword-url.yml --limit unraid

- name: Fix 1Password MCP URL in Director config
  hosts: unraid
  gather_facts: false
  vars:
    director_container: director
    config_paths:
      - /mnt/user/appdata/director/data/director.config.yaml
      - /mnt/user/appdata/director/config/director.config.yaml
    old_url: "http://192.168.20.14:6975/mcp"
    new_url: "http://192.168.20.14:6980/servers/onepassword/sse"

  tasks:
    - name: Verify Director container is running
      ansible.builtin.raw: docker ps --filter "name={{ director_container }}" --filter "status=running" -q
      register: director_running
      failed_when: director_running.stdout | trim == ""
      changed_when: false

    - name: Backup director configs before change
      ansible.builtin.raw: |
        cp {{ item }} {{ item }}.bak-$(date +%Y%m%d-%H%M%S) 2>/dev/null || true
      loop: "{{ config_paths }}"
      changed_when: false

    - name: Fix onepassword MCP URL in director configs
      ansible.builtin.raw: |
        if grep -q '{{ old_url }}' {{ item }} 2>/dev/null; then
          sed -i 's|{{ old_url }}|{{ new_url }}|g' {{ item }}
          echo "fixed"
        else
          echo "no change needed"
        fi
      loop: "{{ config_paths }}"
      register: fix_result
      changed_when: "'fixed' in fix_result.stdout"

    - name: Verify fix applied
      ansible.builtin.raw: |
        grep -c '{{ old_url }}' /mnt/user/appdata/director/data/director.config.yaml 2>/dev/null || echo "0"
      register: remaining_bad_urls
      changed_when: false
      failed_when: remaining_bad_urls.stdout | trim | int > 0

    - name: Reload Director config (SIGHUP)
      ansible.builtin.raw: docker kill --signal=HUP {{ director_container }}
      register: reload_result
      changed_when: reload_result.rc == 0

    - name: Wait for Director to reload
      ansible.builtin.raw: sleep 3
      changed_when: false

    - name: Verify Director still running after reload
      ansible.builtin.raw: docker ps --filter "name={{ director_container }}" --filter "status=running" -q
      register: post_reload
      failed_when: post_reload.stdout | trim == ""
      changed_when: false

    - name: Confirm correct URL is present
      ansible.builtin.raw: |
        grep -c '{{ new_url }}' /mnt/user/appdata/director/data/director.config.yaml
      register: good_url_count
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg: "Fix applied. Correct URL count: {{ good_url_count.stdout | default('n/a') | trim }}"
