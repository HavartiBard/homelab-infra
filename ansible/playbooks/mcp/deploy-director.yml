---
- name: Deploy Director on Unraid
  hosts: unraid
  become: true
  gather_facts: false
  vars:
    director_dir: "/mnt/user/appdata/director"
    director_data_dir: "{{ director_dir }}/data"
    director_config_dir: "{{ director_dir }}/config"
    compose_file: "{{ director_dir }}/docker-compose.yml"
    env_file: "{{ director_dir }}/.env"
    compose_version: v2.27.0
    compose_bin_path: /usr/local/bin/docker-compose
    compose_download_url: >-
      https://github.com/docker/compose/releases/download/{{
      compose_version }}/docker-compose-linux-x86_64
  tasks:
    - name: Create Director directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ director_dir }}"
        - "{{ director_data_dir }}"
        - "{{ director_config_dir }}"

    - name: Copy Director docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/director/docker-compose.yml"
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Check if Director .env exists
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: director_env_stat

    - name: Copy Director .env.example when .env is missing
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/director/.env.example"
        dest: "{{ env_file }}"
        mode: "0600"
      when: not director_env_stat.stat.exists

    - name: Check for docker compose plugin
      ansible.builtin.raw: |
        if docker compose version >/dev/null 2>&1; then
          echo "docker_compose=1"
        else
          exit 1
        fi
      register: docker_compose_plugin
      changed_when: false
      ignore_errors: true

    - name: Check for legacy docker-compose
      ansible.builtin.raw: |
        if {{ compose_bin_path }} version >/dev/null 2>&1; then
          echo "docker_compose_legacy=1"
        else
          exit 1
        fi
      register: docker_compose_legacy
      changed_when: false
      ignore_errors: true

    - name: Install docker-compose binary when missing
      ansible.builtin.raw: |
        set -euo pipefail
        if ! command -v {{ compose_bin_path }} >/dev/null 2>&1; then
          curl -fsSL "{{ compose_download_url }}" -o {{ compose_bin_path }}
          chmod +x {{ compose_bin_path }}
        fi
      when:
        - docker_compose_plugin.rc != 0
        - docker_compose_legacy.rc != 0

    - name: Select compose command
      ansible.builtin.set_fact:
        director_compose_command: >-
          {% if docker_compose_plugin.rc == 0 %}
          docker compose
          {% else %}
          {{ compose_bin_path }}
          {% endif %}

    - name: Deploy Director stack
      ansible.builtin.raw: "cd {{ director_dir }} && {{ director_compose_command }} up -d"

    - name: Wait for Director HTTP endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080"
        method: GET
        timeout: 30
      register: director_http
      until: director_http.status == 200
      retries: 12
      delay: 5

    - name: Show deployment info
      ansible.builtin.debug:
        msg: |
          Director deployed successfully.
          Directory: {{ director_dir }}
          Endpoint: http://{{ ansible_host }}:8080

    - name: Register Director in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: director
            cluster: unraid-docker
            role: Application
            comments: "MCP proxy director — http://{{ ansible_host }}:8080"
