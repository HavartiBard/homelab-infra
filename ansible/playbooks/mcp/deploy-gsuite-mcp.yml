---
# Deploy google_workspace_mcp (Gmail + Calendar + Drive MCP server) on Unraid
#
# Prerequisites:
#   - /mnt/user/appdata/gsuite-mcp/gauth.json  (Desktop app OAuth client secrets
#     downloaded from Google Cloud Console → APIs & Services → Credentials)
#
# The server exposes a native HTTP MCP endpoint (streamable-http transport).
# No mcp-proxy bridging needed — clients connect directly.
#
# After deployment, complete OAuth once by visiting:
#   https://gsuite-auth.klsll.com/auth/
#
# MCP endpoint (for .mcp.json / Claude config):
#   http://192.168.20.14:8092/mcp/

- name: Deploy gsuite-mcp container and update mcp-proxy
  hosts: unraid
  gather_facts: false
  roles:
    - gsuite-mcp
    - role: mcp-proxy
      vars:
        mcp_proxy_servers:
          - name: soullayer
            command: docker
            args:
              - exec
              - -i
              - soullayer
              - soullayer
              - serve
            transport_type: stdio

          - name: obsidian-mcp
            command: docker
            args:
              - exec
              - -i
              - obsidian-mcp
              - node
              - src/index.js
            transport_type: stdio
