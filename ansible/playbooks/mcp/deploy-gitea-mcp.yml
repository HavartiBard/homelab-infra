---
# Deploy Gitea MCP Server to Unraid
#
# Usage:
#   ./scripts/run-playbook.sh gitea-mcp playbooks/mcp/deploy-gitea-mcp.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/gitea-mcp.env (see
# docs/secrets-management.md). GITEA_MCP_TOKEN or GITEA_TOKEN can still be
# overridden directly in the environment for testing.

- name: Deploy Gitea MCP to Unraid
  hosts: unraid
  gather_facts: false

  pre_tasks:
    - name: Verify GITEA_MCP_TOKEN is set
      ansible.builtin.fail:
        msg: >-
          Gitea API token must be set via GITEA_MCP_TOKEN, GITEA_TOKEN env var,
          or resolvable via the configured 1Password item (Gitea MCP Token).
      when: gitea_mcp_token | length == 0

  roles:
    - role: gitea-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: gitea-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "Gitea issues/PRs/repos MCP — http://{{ ansible_host }}:{{ gitea_mcp_port }}"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Gitea MCP deployed successfully!
          Endpoint: http://{{ ansible_host }}:{{ gitea_mcp_port }}/mcp
          Gitea instance: {{ gitea_mcp_host }}
