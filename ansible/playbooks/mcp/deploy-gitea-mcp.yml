---
# Deploy Gitea MCP Server to Unraid
#
# Usage:
#   export GITEA_TOKEN='<Gitea API token>'
#   ansible-playbook playbooks/mcp/deploy-gitea-mcp.yml --limit unraid
#
# Or with 1Password (requires OP_SERVICE_ACCOUNT_TOKEN):
#   ansible-playbook playbooks/mcp/deploy-gitea-mcp.yml --limit unraid

- name: Deploy Gitea MCP to Unraid
  hosts: unraid
  gather_facts: false

  pre_tasks:
    - name: Verify GITEA_MCP_TOKEN is set
      ansible.builtin.fail:
        msg: >-
          Gitea API token must be set via GITEA_MCP_TOKEN, GITEA_TOKEN env var,
          or resolvable via the configured 1Password item (Gitea MCP Token).
      when: gitea_mcp_token | length == 0

  roles:
    - role: gitea-mcp

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Gitea MCP deployed successfully!
          Endpoint: http://{{ ansible_host }}:{{ gitea_mcp_port }}/mcp
          Gitea instance: {{ gitea_mcp_host }}
