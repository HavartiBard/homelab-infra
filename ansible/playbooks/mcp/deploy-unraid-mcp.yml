---
# Deploy Unraid MCP Server to Unraid
#
# Usage:
#   ./scripts/run-playbook.sh unraid-mcp playbooks/mcp/deploy-unraid-mcp.yml
#
# Secrets resolved from 1Password via ansible/envs/unraid-mcp.env (see
# docs/secrets-management.md). UNRAID_API_KEY can still be overridden directly
# in the environment for testing.

- name: Deploy Unraid MCP to Unraid
  hosts: unraid
  gather_facts: false

  pre_tasks:
    - name: Verify UNRAID_API_KEY is set
      ansible.builtin.fail:
        msg: >-
          UNRAID_API_KEY must be set (env override) or resolvable via the
          configured 1Password item.
      when: unraid_api_key | length == 0

  roles:
    - role: unraid-mcp
    - role: netbox-service
      vars:
        netbox_services:
          - name: unraid-mcp
            cluster: unraid-docker
            role: MCP Server
            comments: "Unraid API MCP — http://{{ ansible_host }}:{{ unraid_mcp_port }}/mcp"

  post_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Unraid MCP deployed successfully!
          Endpoint: http://{{ ansible_host }}:{{ unraid_mcp_port }}/mcp
