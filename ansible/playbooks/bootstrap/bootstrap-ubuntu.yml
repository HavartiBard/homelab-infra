---
- name: Bootstrap Ubuntu server with homelab defaults
  hosts: all
  become: true
  gather_facts: true
  vars:
    bootstrap_user: "{{ ansible_user }}"
    bootstrap_user_shell: /bin/zsh
    bootstrap_user_home: "/home/{{ bootstrap_user }}"
    bootstrap_projects_dir: "{{ bootstrap_user_home }}/projects"
    bootstrap_zsh_install_dir: /opt/oh-my-zsh
    bootstrap_zsh_theme: pure
    bootstrap_zsh_plugins:
      - git
      - docker
      - docker-compose
      - sudo
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    bootstrap_packages:
      - git
      - zsh
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - openssh-server
      - python3-pip
    bootstrap_timezone: America/Phoenix
    bootstrap_env_file: "{{ bootstrap_user_home }}/.env_container"
    bootstrap_public_key: "{{ lookup('env','HOME') }}/.ssh/id_ed25519_homelab.pub"
    bootstrap_safe_mode: "{{ lookup('env','BOOTSTRAP_SAFE_MODE') | default('true', true) | bool }}"
    bootstrap_manage_user_shell_files: "{{ lookup('env','BOOTSTRAP_MANAGE_USER_SHELL_FILES') | default((not bootstrap_safe_mode) | ternary('true', 'false'), true) | bool }}"
    bootstrap_manage_projects_ownership: "{{ lookup('env','BOOTSTRAP_MANAGE_PROJECTS_OWNERSHIP') | default((not bootstrap_safe_mode) | ternary('true', 'false'), true) | bool }}"
    bootstrap_target_hosts: >-
      {% set raw = target_hosts | default([]) %}
      {% if raw is string %}
        {% set normalized = raw | regex_replace('\\s+', '') %}
        {{ normalized | split(',') | reject('equalto', '') | list }}
      {% else %}
        {{ raw | list }}
      {% endif %}
  pre_tasks:
    - name: Require target_hosts so we only touch the intended host
      assert:
        that:
          - bootstrap_target_hosts | length > 0
        fail_msg: |
          target_hosts is not set. Run the playbook like:
            ansible-playbook playbooks/misc/bootstrap-ubuntu.yml -e target_hosts=my-ubuntu-host
    - name: Stop hosts that are not in the bootstrap target list
      meta: end_host
      when: inventory_hostname not in bootstrap_target_hosts
    - name: Verify Ubuntu distribution (bootstrap is Ubuntu-only)
      assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: "Host {{ inventory_hostname }} is {{ ansible_distribution }}; this playbook assumes Ubuntu."
  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ bootstrap_packages }}"
        state: present

    - name: Determine dpkg architecture for apt repositories
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Ensure 1Password keyring directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /usr/share/keyrings
        - /etc/debsig/policies/AC2D62742012EA22
        - /usr/share/debsig/keyrings/AC2D62742012EA22

    - name: Download 1Password public key
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/keys/1password.asc
        dest: /tmp/1password.asc
        mode: '0644'

    - name: Create 1Password apt keyring
      ansible.builtin.command: >
        gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg /tmp/1password.asc
      args:
        creates: /usr/share/keyrings/1password-archive-keyring.gpg

    - name: Install 1Password debsig policy
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/debian/debsig/1password.pol
        dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
        mode: '0644'

    - name: Create 1Password debsig keyring
      ansible.builtin.command: >
        gpg --dearmor -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg /tmp/1password.asc
      args:
        creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

    - name: Add 1Password apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ dpkg_arch.stdout }} stable main"
        filename: 1password
        state: present

    - name: Install 1Password CLI
      ansible.builtin.apt:
        name: 1password-cli
        state: latest
        update_cache: true

    - name: Remove temporary 1Password key material
      ansible.builtin.file:
        path: /tmp/1password.asc
        state: absent

    - name: Ensure bootstrap user exists
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        shell: "{{ bootstrap_user_shell }}"
        home: "{{ bootstrap_user_home }}"
        create_home: true
        groups: sudo
        append: true

    - name: Ensure bootstrap directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        mode: '0755'
      loop:
        - "{{ bootstrap_user_home }}"
        - "{{ bootstrap_projects_dir }}"
        - "{{ bootstrap_user_home }}/.cache"
        - "{{ bootstrap_user_home }}/.cache/oh-my-zsh"

    - name: Ensure SSH directory has strict permissions
      ansible.builtin.file:
        path: "{{ bootstrap_user_home }}/.ssh"
        state: directory
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        mode: '0700'

    - name: Deploy authorized SSH key for bootstrap user
      ansible.posix.authorized_key:
        user: "{{ bootstrap_user }}"
        key: "{{ lookup('file', bootstrap_public_key) }}"
        manage_dir: true
        state: present

    - name: Ensure SSH service is running
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Set timezone to {{ bootstrap_timezone }}
      ansible.builtin.command: timedatectl set-timezone {{ bootstrap_timezone }}
      when: ansible_facts.get('ansible_timezone', '') != bootstrap_timezone
      changed_when: true

    - name: Ensure Oh My Zsh base repository is present
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ bootstrap_zsh_install_dir }}"
        depth: 1
        update: true
        force: false

    - name: Ensure custom directories under Oh My Zsh exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ bootstrap_zsh_install_dir }}/custom"
        - "{{ bootstrap_zsh_install_dir }}/custom/themes"
        - "{{ bootstrap_zsh_install_dir }}/custom/plugins"

    - name: Deploy Pure theme
      ansible.builtin.git:
        repo: https://github.com/sindresorhus/pure.git
        dest: "{{ bootstrap_zsh_install_dir }}/custom/themes/pure"
        depth: 1
        update: true

    - name: Link Pure theme helpers
      ansible.builtin.file:
        src: "{{ bootstrap_zsh_install_dir }}/custom/themes/pure/pure.zsh"
        dest: "{{ bootstrap_zsh_install_dir }}/custom/themes/pure.zsh-theme"
        state: link
    - name: Link Pure async helper
      ansible.builtin.file:
        src: "{{ bootstrap_zsh_install_dir }}/custom/themes/pure/async.zsh"
        dest: "{{ bootstrap_zsh_install_dir }}/custom/async.zsh"
        state: link

    - name: Clone zsh-autosuggestions
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: "{{ bootstrap_zsh_install_dir }}/custom/plugins/zsh-autosuggestions"
        depth: 1
        update: true

    - name: Clone zsh-syntax-highlighting
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting
        dest: "{{ bootstrap_zsh_install_dir }}/custom/plugins/zsh-syntax-highlighting"
        depth: 1
        update: true

    - name: Deploy zshrc to /etc/skel
      ansible.builtin.template:
        src: ../../templates/bootstrap-ubuntu/zshrc.j2
        dest: /etc/skel/.zshrc
        owner: root
        group: root
        mode: '0644'

    - name: Copy /etc/skel/.zshrc to user home
      ansible.builtin.copy:
        src: /etc/skel/.zshrc
        dest: "{{ bootstrap_user_home }}/.zshrc"
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        mode: '0644'
        force: true
      when: bootstrap_manage_user_shell_files | bool

    - name: Deploy env_container from vault variables
      ansible.builtin.template:
        src: ../../templates/bootstrap-ubuntu/env_container.j2
        dest: "{{ bootstrap_env_file }}"
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        mode: '0600'
      when: bootstrap_manage_user_shell_files | bool

    - name: Ensure bashrc sources env_container and Go path
      ansible.builtin.blockinfile:
        path: "{{ bootstrap_user_home }}/.bashrc"
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        block: |
          # Container environment
          [ -f ~/.env_container ] && source ~/.env_container

          # Go configuration
          export GOPATH="$HOME/go"
          export PATH="$GOPATH/bin:/usr/local/go/bin:$PATH"
      when: bootstrap_manage_user_shell_files | bool

    - name: Ensure oh-my-zsh cache folder exists for user
      ansible.builtin.file:
        path: "{{ bootstrap_user_home }}/.cache/oh-my-zsh"
        state: directory
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        mode: '0755'

    - name: Ensure projects directory is owned by bootstrap user
      ansible.builtin.file:
        path: "{{ bootstrap_projects_dir }}"
        owner: "{{ bootstrap_user }}"
        group: "{{ bootstrap_user }}"
        recurse: true
      when: bootstrap_manage_projects_ownership | bool
