---
# Adds mcporter to the openclaw container on the Jetson.
# Re-run after: docker compose pull (upstream openclaw image update)
#
# Usage:
#   ansible-playbook playbooks/services/add-mcporter-to-openclaw.yml --limit jetson.lab -v
- name: Add mcporter to openclaw (Jetson)
  hosts: jetson.lab
  gather_facts: no

  vars:
    mcporter_base_image: "ghcr.io/openclaw/openclaw:latest"
    mcporter_container_name: "openclaw"
    mcporter_compose_dir: "/home/james/docker/openclaw"
    mcporter_container_user: "node"
    mcporter_install_ansible: true
    mcporter_install_docker: true
    mcporter_install_network_tools: true
    mcporter_install_openclaw_cli: true

  roles:
    - add-mcporter
