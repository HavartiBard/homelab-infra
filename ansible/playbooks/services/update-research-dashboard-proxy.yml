---
- name: Sync Research Dashboard proxy and DNS into Nginx Proxy Manager
  hosts: unraid
  gather_facts: false
  vars:
    npm_proxy_config_paths:
      - "{{ playbook_dir }}/../../files/npm/services/research-dashboard.yml"
    npm_manage_proxies: true
    npm_manage_dns: true
    # Use vault vars directly for delegated localhost tasks
    npm_admin_email: "{{ vault_npm_admin_username }}"
    npm_admin_password: "{{ vault_npm_admin_password }}"
    technitium_api_token: "{{ vault_technitium_api_token }}"
    technitium_admin_password: "{{ vault_dns_automation_credential }}"
  roles:
    - npm
