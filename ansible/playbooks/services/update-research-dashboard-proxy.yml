---
- name: Sync Research Dashboard proxy and DNS into Nginx Proxy Manager
  hosts: unraid
  gather_facts: false
  vars:
    npm_proxy_config_paths:
      - "{{ playbook_dir }}/../../files/npm/services/research-dashboard.yml"
    npm_manage_proxies: true
    npm_manage_dns: true
    # Ensure delegated localhost tasks can access vault-provided creds
    npm_admin_email: "{{ hostvars[inventory_hostname].npm_admin_email | default(npm_admin_email, true) }}"
    npm_admin_password: "{{ hostvars[inventory_hostname].npm_admin_password | default(npm_admin_password, true) }}"
    technitium_api_token: "{{ hostvars[inventory_hostname].technitium_api_token | default(technitium_api_token, true) }}"
    technitium_admin_password: "{{ hostvars[inventory_hostname].technitium_admin_password | default(technitium_admin_password, true) }}"
  roles:
    - npm
