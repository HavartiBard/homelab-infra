---
# Deploy paperless-ai to Unraid (alongside paperless-ngx)
# Requires: vault_paperless_ai_api_token, vault_ironclaw_lmstudio_api_key

- name: Deploy paperless-ai
  hosts: unraid
  gather_facts: false
  roles:
    - paperless-ai
    - role: netbox-service
      vars:
        netbox_services:
          - name: paperless-ai
            cluster: unraid-docker
            role: Application
            comments: "AI document enrichment for Paperless — http://{{ ansible_host }}:{{ paperless_ai_port }}"
