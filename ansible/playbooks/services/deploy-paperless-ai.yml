---
# Deploy paperless-ai to Unraid (alongside paperless-ngx)
#
# Usage:
#   ./scripts/run-playbook.sh paperless-ai playbooks/services/deploy-paperless-ai.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/paperless-ai.env (see
# docs/secrets-management.md).

- name: Deploy paperless-ai
  hosts: unraid
  gather_facts: false
  roles:
    - paperless-ai
    - role: netbox-service
      vars:
        netbox_services:
          - name: paperless-ai
            cluster: unraid-docker
            role: Application
            comments: "AI document enrichment for Paperless — http://{{ ansible_host }}:{{ paperless_ai_port }}"
