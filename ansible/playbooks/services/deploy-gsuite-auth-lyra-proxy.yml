---
- name: Deploy gsuite-auth-lyra proxy and DNS (temporary OAuth callback)
  hosts: unraid
  gather_facts: false
  vars:
    npm_proxy_config_paths:
      - "{{ playbook_dir }}/../../files/npm/services/certificates.yml"
      - "{{ playbook_dir }}/../../files/npm/services/gsuite-auth-lyra.yml"
    npm_manage_proxies: true
    npm_manage_dns: true
  roles:
    - npm
