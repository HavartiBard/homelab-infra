---
# Deploy Paperless-NGX document management on Unraid
#
# Usage:
#   ./scripts/run-playbook.sh paperless playbooks/services/deploy-paperless.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/paperless.env (see
# docs/secrets-management.md).
#
# Prerequisites:
#   - /mnt/user/paperless share exists on Unraid
#
# After deployment:
#   Web UI:    http://192.168.20.14:8000    (direct)
#              https://paperless.klsll.com  (via NPM)
#   Login:     admin / <PAPERLESS_ADMIN_PASSWORD>
#   Consume:   Drop files into /mnt/user/paperless/consume/
#   Email:     Configure IMAP in Admin → Mail Accounts

- name: Deploy Paperless-NGX
  hosts: unraid
  gather_facts: false

  roles:
    - role: paperless
    - role: netbox-service
      vars:
        netbox_services:
          - name: paperless
            cluster: unraid-docker
            role: Application
            comments: "Document management — http://{{ ansible_host }}:{{ paperless_port }}"

  post_tasks:
    - name: Deployment summary
      ansible.builtin.debug:
        msg: |
          Paperless-NGX deployed successfully!
          Web UI:     http://{{ ansible_host }}:{{ paperless_port }}
          NPM proxy:  https://paperless.klsll.com (configure NPM separately)
          Login:      {{ paperless_admin_user }} / <PAPERLESS_ADMIN_PASSWORD>
          Consume:    {{ paperless_appdata_dir }}/consume/
          Logs:       docker logs paperless-web -f
          Restart:    cd {{ paperless_compose_dir }} && docker compose restart
