---
# =============================================================================
# Deploy Qdrant on goudai
#
# Vector database — used as the RAG backend for Open WebUI and other agents.
#
# Run:
#   ansible-playbook playbooks/platform/deploy-qdrant.yml \
#     --vault-password-file ~/.vault-pass --limit goudai
# =============================================================================

- name: Deploy Qdrant
  hosts: goudai
  become: true
  gather_facts: false

  vars:
    host_user: james
    service_dir: /opt/qdrant

  tasks:

    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ service_dir }}"
        state: directory
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0755'

    - name: Deploy docker-compose file
      ansible.builtin.copy:
        src: ../../files/goudai/qdrant/docker-compose.yml
        dest: "{{ service_dir }}/docker-compose.yml"
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0644'
      register: compose_file

    - name: Pull latest image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Start Qdrant
      ansible.builtin.command:
        cmd: docker compose up -d {{ '--force-recreate' if compose_file.changed else '' }}
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Wait for Qdrant to be healthy
      ansible.builtin.uri:
        url: http://localhost:6333/healthz
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 12
      delay: 5

    - name: Register Qdrant in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: qdrant
            cluster: goudai-docker
            role: Application
            comments: "Vector database — http://{{ ansible_host }}:6333"
