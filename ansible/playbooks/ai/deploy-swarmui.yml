---
# =============================================================================
# Deploy SwarmUI on goudai
#
# Web portal + model manager (CivitAI browser/downloader, generate UI, grid
# runner) over both homelab ComfyUI backends. SwarmUI runs CPU-only here;
# generation happens on the remote backends.
#
# Run:
#   cd ansible
#   ansible-playbook playbooks/ai/deploy-swarmui.yml --limit goudai
#
# First-run steps (one time, in the web UI at http://goudai.lab.klsll.com:7801):
#   1. Create the admin account.
#   2. Server -> Backends -> Add: "ComfyUI API By URL"
#        http://spraycheese.lab.klsll.com:8188   (SDXL/Pony images, NVIDIA)
#        http://goudai.lab.klsll.com:8188        (LTX-2.3 video, ROCm)
#   3. Server -> Server Configuration -> Paths: remap model subfolders to the
#      ComfyUI names (checkpoints, loras, vae, ...) since /SwarmUI/Models is
#      the shared ComfyUI library.
#   4. User settings -> add CivitAI API key for authenticated downloads.
# =============================================================================

- name: Deploy SwarmUI on goudai
  hosts: goudai
  gather_facts: false
  vars:
    swarmui_service_dir: /opt/swarmui
    swarmui_src_dir: /opt/swarmui/src
    swarmui_repo: https://github.com/mcmonkeyprojects/SwarmUI.git
    swarmui_git_version: master
    swarmui_image: swarmui:local
    swarmui_port: 7801
    swarmui_output_dir: /mnt/ai-models/comfyui/output/swarmui
    swarmui_force_rebuild: false
  tasks:

    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ swarmui_service_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure SwarmUI output directory exists on the share
      ansible.builtin.file:
        path: "{{ swarmui_output_dir }}"
        state: directory
        mode: "0777"

    - name: Clone / update SwarmUI source
      ansible.builtin.git:
        repo: "{{ swarmui_repo }}"
        dest: "{{ swarmui_src_dir }}"
        version: "{{ swarmui_git_version }}"
        force: true
      register: swarmui_src

    - name: Check whether the image already exists
      ansible.builtin.command: "docker image inspect {{ swarmui_image }}"
      register: image_present
      changed_when: false
      failed_when: false

    - name: Build the SwarmUI image
      ansible.builtin.command: >-
        docker build --build-arg UID=1000
        -f launchtools/StandardDockerfile.docker
        -t {{ swarmui_image }} .
      args:
        chdir: "{{ swarmui_src_dir }}"
      when: >-
        swarmui_force_rebuild or swarmui_src.changed
        or image_present.rc != 0
      changed_when: true

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        src: ../../files/goudai/swarmui/docker-compose.yml
        dest: "{{ swarmui_service_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Start / update SwarmUI
      ansible.builtin.command: "docker compose up -d"
      args:
        chdir: "{{ swarmui_service_dir }}"
      changed_when: true

    - name: Wait for SwarmUI to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ swarmui_port }}/"
        method: GET
        status_code: 200
      register: health
      retries: 60
      delay: 5
      until: health.status is defined and health.status == 200

    - name: Register SwarmUI in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: swarmui
            cluster: goudai-docker
            role: LLM Service
            comments: "SwarmUI portal/model manager over ComfyUI backends — http://goudai.lab.klsll.com:{{ swarmui_port }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          SwarmUI is up at http://goudai.lab.klsll.com:{{ swarmui_port }} —
          see the playbook header for one-time backend/paths setup steps.
