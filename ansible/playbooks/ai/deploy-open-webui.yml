---
# =============================================================================
# Deploy Open WebUI on goudai
#
# Chat UI backed by native Ollama (port 11434 on the host).
# Ollama must already be running — see setup-goudai-host.yml.
#
# Run:
#   ansible-playbook playbooks/platform/deploy-open-webui.yml \
#     --vault-password-file ~/.vault-pass --limit goudai
# =============================================================================

- name: Deploy Open WebUI
  hosts: goudai
  become: true
  gather_facts: false

  vars:
    host_user: james
    service_dir: /opt/open-webui
    open_webui_external_files_dir: /mnt/ai-models/open-webui/files
    open_webui_openai_api_base_url: http://192.168.20.14:4000/v1
    open_webui_openai_api_key: "{{ vault_litellm_master_key | default('', true) }}"
    open_webui_searxng_query_url: "http://192.168.20.14:6979/search?q=<query>&format=json&engines=bing,startpage,wikipedia"
    open_webui_default_user_email: james@klsll.com

  tasks:

    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ service_dir }}"
        state: directory
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0755'

    - name: Ensure Open WebUI external files directory exists
      ansible.builtin.file:
        path: "{{ open_webui_external_files_dir }}"
        state: directory

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: ../../files/goudai/open-webui/docker-compose.yml
        dest: "{{ service_dir }}/docker-compose.yml"
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0644'
      register: compose_file
      no_log: true

    - name: Pull latest image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Start Open WebUI
      ansible.builtin.command:
        cmd: docker compose up -d {{ '--force-recreate' if compose_file.changed else '' }}
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Wait for Open WebUI to be healthy
      ansible.builtin.uri:
        url: http://localhost:8080/health
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 12
      delay: 10

    - name: Set default user's web search mode to always
      ansible.builtin.command:
        cmd: >
          docker exec open-webui python -c
          "import json, sqlite3;
          conn = sqlite3.connect('/app/backend/data/webui.db');
          row = conn.execute('select settings from user where lower(email) = lower(?)', ('{{ open_webui_default_user_email }}',)).fetchone();
          settings = json.loads(row[0] or '{}') if row else {};
          settings['webSearch'] = 'always';
          conn.execute('update user set settings = ? where lower(email) = lower(?)', (json.dumps(settings), '{{ open_webui_default_user_email }}'));
          conn.commit()"
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Register Open WebUI in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: open-webui
            cluster: goudai-docker
            role: LLM Service
            comments: "Web UI for LLMs — http://{{ ansible_host }}:8080"
