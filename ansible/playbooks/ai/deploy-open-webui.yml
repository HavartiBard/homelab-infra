---
# =============================================================================
# Deploy Open WebUI on goudai
#
# Chat UI backed by native Ollama (port 11434 on the host).
# Ollama must already be running — see setup-goudai-host.yml.
#
# LiteLLM API key is sourced from a 1Password Environment (pilot — see
# docs/superpowers/specs/2026-07-15-goudai-reimage-safety-design.md), not
# ansible-vault. Run via:
#   op run --env-file=../envs/goudai.env -- \
#     ansible-playbook playbooks/ai/deploy-open-webui.yml --limit goudai
# =============================================================================

- name: Deploy Open WebUI
  hosts: goudai
  become: true
  gather_facts: false

  vars:
    host_user: james
    service_dir: /opt/open-webui
    open_webui_external_files_dir: /mnt/ai-models/open-webui/files
    open_webui_openai_api_base_url: http://192.168.20.14:4000/v1
    open_webui_openai_api_key: "{{ lookup('env', 'LITELLM_MASTER_KEY') | default('', true) }}"
    open_webui_searxng_query_url: "http://192.168.20.14:6979/search?q=<query>&format=json&engines=bing,startpage,wikipedia"
    open_webui_default_user_email: james@klsll.com
    # ComfyUI runs on spraycheese (NVIDIA) and is reachable via its LAN hostname
    open_webui_comfyui_base_url: http://spraycheese.lab.klsll.com:8188/
    open_webui_image_generation_engine: comfyui
    open_webui_image_generation_model: flux1-schnell.safetensors
    open_webui_image_size: 1024x1024
    open_webui_image_steps: 4
    open_webui_enable_image_prompt_generation: true
    open_webui_comfyui_workflow: "{{ lookup('file', playbook_dir + '/../../files/spraycheese/comfyui/workflows/open-webui-flux-schnell-api.json') | trim }}"
    open_webui_comfyui_workflow_nodes:
      - { type: prompt, key: text, node_ids: ["19"] }
      - { type: model, key: unet_name, node_ids: ["10"] }
      - { type: width, key: width, node_ids: ["18"] }
      - { type: height, key: height, node_ids: ["18"] }
      - { type: steps, key: steps, node_ids: ["20"] }
      - { type: seed, key: seed, node_ids: ["20"] }

  tasks:

    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ service_dir }}"
        state: directory
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0755'

    - name: Ensure Open WebUI external files directory exists
      ansible.builtin.file:
        path: "{{ open_webui_external_files_dir }}"
        state: directory

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: ../../files/goudai/open-webui/docker-compose.yml
        dest: "{{ service_dir }}/docker-compose.yml"
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        mode: '0644'
      register: compose_file
      no_log: true

    - name: Pull latest image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Start Open WebUI
      ansible.builtin.command:
        cmd: docker compose up -d {{ '--force-recreate' if compose_file.changed else '' }}
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Wait for Open WebUI to be healthy
      ansible.builtin.uri:
        url: http://localhost:8080/health
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 12
      delay: 10

    # Open WebUI's config table moved from a single JSON blob row
    # (id, data) to per-key rows (key, value, updated_at) — the old
    # UPDATE-single-row approach silently no-ops on that schema.
    - name: Configure Open WebUI image generation defaults in database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - open-webui
          - python
          - -c
          - |
            import json, sqlite3, time
            conn = sqlite3.connect('/app/backend/data/webui.db')
            now = int(time.time())
            desired = json.loads({{ {
              'image_generation.enable': true,
              'image_generation.engine': open_webui_image_generation_engine,
              'image_generation.comfyui.base_url': open_webui_comfyui_base_url,
              'image_generation.model': open_webui_image_generation_model,
              'image_generation.size': open_webui_image_size,
              'image_generation.steps': open_webui_image_steps,
              'image_generation.prompt.enable': open_webui_enable_image_prompt_generation,
              'image_generation.comfyui.workflow': open_webui_comfyui_workflow,
              'image_generation.comfyui.nodes': open_webui_comfyui_workflow_nodes,
            } | to_json | to_json }})
            for key, value in desired.items():
                conn.execute(
                    'insert into config(key, value, updated_at) values (?, ?, ?) '
                    'on conflict(key) do update set value = excluded.value, updated_at = excluded.updated_at',
                    (key, json.dumps(value), now),
                )
            conn.commit()
      args:
        chdir: "{{ service_dir }}"
      changed_when: true
      no_log: true

    - name: Verify Open WebUI image generation defaults in database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - open-webui
          - python
          - -c
          - |
            import json, sqlite3, sys
            conn = sqlite3.connect('/app/backend/data/webui.db')
            cur = conn.cursor()
            def get(key):
                row = cur.execute('select value from config where key = ?', (key,)).fetchone()
                if row is None:
                    return None
                value = row[0]
                # SQLite's NUMERIC column affinity silently coerces
                # numeric-looking JSON text (e.g. steps="4") into a native
                # int/float, so it's not always a string to re-decode.
                return json.loads(value) if isinstance(value, str) else value
            expected = json.loads({{ {
              'image_generation.enable': true,
              'image_generation.engine': open_webui_image_generation_engine,
              'image_generation.comfyui.base_url': open_webui_comfyui_base_url,
              'image_generation.model': open_webui_image_generation_model,
              'image_generation.size': open_webui_image_size,
              'image_generation.steps': open_webui_image_steps,
              'image_generation.prompt.enable': open_webui_enable_image_prompt_generation,
            } | to_json | to_json }})
            mismatches = {k: {'expected': v, 'actual': get(k)} for k, v in expected.items() if get(k) != v}
            if not get('image_generation.comfyui.workflow'):
                mismatches['image_generation.comfyui.workflow'] = {'expected': 'non-empty', 'actual': 'empty'}
            if not get('image_generation.comfyui.nodes'):
                mismatches['image_generation.comfyui.nodes'] = {'expected': 'non-empty', 'actual': 'empty'}
            if mismatches:
                print(json.dumps(mismatches, indent=2))
                sys.exit(1)
      args:
        chdir: "{{ service_dir }}"
      changed_when: false
      no_log: true

    - name: Set default user's web search mode to always
      ansible.builtin.command:
        cmd: >
          docker exec open-webui python -c
          "import json, sqlite3;
          conn = sqlite3.connect('/app/backend/data/webui.db');
          row = conn.execute('select settings from user where lower(email) = lower(?)', ('{{ open_webui_default_user_email }}',)).fetchone();
          settings = json.loads(row[0] or '{}') if row else {};
          settings['webSearch'] = 'always';
          conn.execute('update user set settings = ? where lower(email) = lower(?)', (json.dumps(settings), '{{ open_webui_default_user_email }}'));
          conn.commit()"
        chdir: "{{ service_dir }}"
      changed_when: true

    - name: Register Open WebUI in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: open-webui
            cluster: goudai-docker
            role: LLM Service
            comments: "Web UI for LLMs — http://{{ ansible_host }}:8080"
