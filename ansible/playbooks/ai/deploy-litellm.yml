---
# Deploy LiteLLM proxy on Unraid (port 4000)
#
# LiteLLM provides an OpenAI-compatible endpoint that unifies Claude, OpenAI, and Ollama.
#
# Usage:
#   ./scripts/run-playbook.sh litellm playbooks/ai/deploy-litellm.yml --diff --limit unraid -v
#
# Secrets resolved from 1Password via ansible/envs/litellm.env (see
# docs/secrets-management.md) — NOTE: litellm_db_password has no 1Password
# item yet, see the TODO in that file.
#
# After deployment:
#   LiteLLM:  http://192.168.20.14:4000/health
#   Models:   http://192.168.20.14:4000/models

- name: Deploy LiteLLM on Unraid
  hosts: unraid
  gather_facts: false

  vars:
    litellm_dir: /mnt/user/appdata/litellm
    litellm_anthropic_api_key: "{{ lookup('ansible.builtin.env', 'LITELLM_ANTHROPIC_API_KEY') | default('', true) }}"
    litellm_openai_api_key: "{{ lookup('ansible.builtin.env', 'LITELLM_OPENAI_API_KEY') | default('', true) }}"
    litellm_master_key: "{{ lookup('ansible.builtin.env', 'LITELLM_MASTER_KEY') | default('', true) }}"
    litellm_db_password: "{{ lookup('ansible.builtin.env', 'LITELLM_DB_PASSWORD') | default('', true) }}"

  tasks:
    - name: Assert LiteLLM credentials are provided
      ansible.builtin.assert:
        that:
          - litellm_anthropic_api_key | length > 0
          - litellm_openai_api_key | length > 0
          - litellm_master_key | length > 0
          - litellm_db_password | length > 0
        fail_msg: >-
          Missing one or more LiteLLM env vars, e.g. via ansible/envs/litellm.env.
          LITELLM_DB_PASSWORD has no 1Password item yet — see the TODO in that file.

    - name: Create LiteLLM appdata directory
      raw: mkdir -p {{ litellm_dir }}

    - name: Template LiteLLM compose file
      template:
        src: "{{ playbook_dir }}/../../files/litellm/docker-compose.yml.j2"
        dest: "{{ litellm_dir }}/docker-compose.yml"
        mode: '0600'

    - name: Template LiteLLM config
      template:
        src: "{{ playbook_dir }}/../../files/litellm/config.yaml.j2"
        dest: "{{ litellm_dir }}/config.yaml"
        mode: '0600'

    - name: Pull and start LiteLLM
      raw: cd {{ litellm_dir }} && docker compose pull && docker compose up -d

    - name: Wait for LiteLLM health
      raw: sleep 10 && curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health
      register: health_check
      failed_when: false

    - name: Show health check result
      debug:
        msg: "LiteLLM health check: {{ health_check.stdout }}"

    - name: Register LiteLLM in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: litellm
            cluster: unraid-docker
            role: LLM Service
            comments: "Multi-provider LLM proxy — http://{{ ansible_host }}:4000"
