---
# Deploy agent-control-plane (backend + web + postgres) on Unraid
#
# The web container is assigned a dedicated macvlan IP (192.168.21.2) on the br0 network.
# NPM proxies agent-cp.klsll.com → http://192.168.21.2:80.
# The backend is internal-only; web nginx handles the API proxy to backend.
#
# Prerequisites:
#   - Images pushed to code.klsll.com/havartibard/
#   - br0 macvlan network exists on Unraid (docker network ls | grep br0)
#
# After deployment:
#   Backend (internal): http://192.168.21.2/api/ (via web nginx proxy)
#   Web UI (direct):    http://192.168.21.2:80
#   Web UI (proxied):   https://agent-cp.klsll.com
#
# Usage:
#   ./scripts/run-playbook.sh agent-cp playbooks/ai/deploy-agent-cp.yml --diff --limit unraid -v
#
# Secrets resolved from 1Password via ansible/envs/agent-cp.env (see
# docs/secrets-management.md) — NOTE: postgres_password, raclette_session_token,
# slack_bot_token, slack_app_token, and secret_encryption_key have no
# 1Password item yet, see the TODOs in that file.

- name: Deploy agent-control-plane
  hosts: unraid
  gather_facts: false

  vars:
    agent_cp_dir: /mnt/user/appdata/agent-cp
    agent_cp_ip: "192.168.21.2"
    npm_url: "https://npm.klsll.com"
    npm_email: "{{ lookup('ansible.builtin.env', 'NPM_ADMIN_EMAIL') | default('', true) }}"
    npm_password: "{{ lookup('ansible.builtin.env', 'NPM_ADMIN_PASSWORD') | default('', true) }}"
    technitium_url: "http://192.168.20.2:5380"
    technitium_token: "{{ lookup('ansible.builtin.env', 'TECHNITIUM_API_TOKEN') | default('', true) }}"
    dns_zone: "klsll.com"
    dns_domain: "agent-cp.klsll.com"
    # DNS A record points to NPM so HTTPS termination works
    dns_target: "192.168.20.50"
    agent_cp_postgres_password: "{{ lookup('ansible.builtin.env', 'AGENT_CP_POSTGRES_PASSWORD') | default('', true) }}"
    agent_cp_raclette_session_token: "{{ lookup('ansible.builtin.env', 'AGENT_CP_RACLETTE_SESSION_TOKEN') | default('', true) }}"
    agent_cp_slack_bot_token: "{{ lookup('ansible.builtin.env', 'AGENT_CP_SLACK_BOT_TOKEN') | default('', true) }}"
    agent_cp_slack_app_token: "{{ lookup('ansible.builtin.env', 'AGENT_CP_SLACK_APP_TOKEN') | default('', true) }}"
    agent_cp_secret_encryption_key: "{{ lookup('ansible.builtin.env', 'AGENT_CP_SECRET_ENCRYPTION_KEY') | default('', true) }}"
    litellm_anthropic_api_key: "{{ lookup('ansible.builtin.env', 'LITELLM_ANTHROPIC_API_KEY') | default('', true) }}"
    litellm_openai_api_key: "{{ lookup('ansible.builtin.env', 'LITELLM_OPENAI_API_KEY') | default('', true) }}"
    gitea_mcp_token: >-
      {{ lookup('ansible.builtin.env', 'GITEA_MCP_TOKEN')
         | default(lookup('ansible.builtin.env', 'GITEA_TOKEN'), true) }}

  tasks:
    - name: Assert agent-cp credentials are provided
      ansible.builtin.assert:
        that:
          - agent_cp_postgres_password | length > 0
          - agent_cp_raclette_session_token | length > 0
          - agent_cp_slack_bot_token | length > 0
          - agent_cp_slack_app_token | length > 0
          - agent_cp_secret_encryption_key | length > 0
          - litellm_anthropic_api_key | length > 0
          - litellm_openai_api_key | length > 0
          - gitea_mcp_token | length > 0
        fail_msg: >-
          Missing one or more agent-cp env vars. AGENT_CP_POSTGRES_PASSWORD,
          AGENT_CP_RACLETTE_SESSION_TOKEN, AGENT_CP_SLACK_BOT_TOKEN,
          AGENT_CP_SLACK_APP_TOKEN, and AGENT_CP_SECRET_ENCRYPTION_KEY have no
          1Password item yet — see the TODOs in ansible/envs/agent-cp.env.

    - name: Create appdata directory
      raw: mkdir -p {{ agent_cp_dir }}/workspace

    - name: Copy docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../../files/agent-cp/docker-compose.yml"
        dest: "{{ agent_cp_dir }}/docker-compose.yml"

    - name: Write .env file
      copy:
        content: |
          POSTGRES_PASSWORD={{ agent_cp_postgres_password }}
          LANGGRAPH_API_URL=http://192.168.20.14:8000
          RACLETTE_API_URL=http://192.168.20.169:9119
          RACLETTE_SESSION_TOKEN={{ agent_cp_raclette_session_token }}
          SLACK_BOT_TOKEN={{ agent_cp_slack_bot_token }}
          SLACK_APP_TOKEN={{ agent_cp_slack_app_token }}
          SLACK_CHANNEL_ID=C0AU0620ATX
          SECRET_ENCRYPTION_KEY={{ agent_cp_secret_encryption_key }}
          ANTHROPIC_API_KEY={{ litellm_anthropic_api_key }}
          OPENAI_API_KEY={{ litellm_openai_api_key }}
          AGENT_REPO_ROOT=/workspace/repo
          AGENT_WORKTREE_ROOT=/workspace/agents
          GITEA_TOKEN={{ gitea_mcp_token }}
          AGENT_CP_IP={{ agent_cp_ip }}
        dest: "{{ agent_cp_dir }}/.env"
        mode: '0600'

    - name: Create SSH key directory for agent-cp
      raw: mkdir -p {{ agent_cp_dir }}/ssh && chmod 700 {{ agent_cp_dir }}/ssh

    - name: Copy homelab SSH key to agent-cp
      copy:
        src: "~/.ssh/id_ed25519_homelab"
        dest: "{{ agent_cp_dir }}/ssh/id_ed25519_homelab"
        mode: '0600'

    - name: Pull latest images
      raw: cd {{ agent_cp_dir }} && docker compose pull

    - name: Start stack
      raw: cd {{ agent_cp_dir }} && docker compose up -d

    - name: Wait for web to be reachable
      raw: >
        for i in $(seq 1 12); do
          curl -sf http://{{ agent_cp_ip }}/ && exit 0;
          sleep 5;
        done; exit 1

    - name: Deployment summary
      debug:
        msg: |
          agent-control-plane deployed successfully!
          Web UI (direct):  http://{{ agent_cp_ip }}/
          Web UI (proxied): https://{{ dns_domain }}
          Logs:             docker compose -f {{ agent_cp_dir }}/docker-compose.yml logs -f

    # ── Technitium DNS A record ─────────────────────────────────────────────────

    - name: Check for existing DNS A record
      ansible.builtin.uri:
        url: "{{ technitium_url }}/api/zones/records/get"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          domain: "{{ dns_domain }}"
          zone: "{{ dns_zone }}"
          type: A
        status_code: [200, 404]
      register: dns_check
      no_log: true
      delegate_to: localhost
      become: false

    - name: Parse existing A record IP
      ansible.builtin.set_fact:
        dns_record_ip: >-
          {{ (dns_check.json.response.records
              | selectattr('type', 'equalto', 'A')
              | map(attribute='rData.ipAddress')
              | list | first) if
             (dns_check.status == 200 and
              dns_check.json.status == 'ok' and
              dns_check.json.response.records | length > 0)
             else None }}
      delegate_to: localhost
      become: false

    - name: Create DNS A record (does not exist yet)
      ansible.builtin.uri:
        url: "{{ technitium_url }}/api/zones/records/add"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          domain: "{{ dns_domain }}"
          zone: "{{ dns_zone }}"
          type: A
          ipAddress: "{{ dns_target }}"
          ttl: 3600
        status_code: 200
      when: dns_record_ip is none
      no_log: true
      delegate_to: localhost
      become: false

    - name: Update DNS A record (IP mismatch)
      ansible.builtin.uri:
        url: "{{ technitium_url }}/api/zones/records/update"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          domain: "{{ dns_domain }}"
          zone: "{{ dns_zone }}"
          type: A
          ipAddress: "{{ dns_record_ip }}"
          newIpAddress: "{{ dns_target }}"
          ttl: 3600
        status_code: 200
      when: dns_record_ip is not none and dns_record_ip != dns_target
      no_log: true
      delegate_to: localhost
      become: false

    # ── NPM proxy host ──────────────────────────────────────────────────────────

    - name: Authenticate with NPM API
      ansible.builtin.uri:
        url: "{{ npm_url }}/api/tokens"
        method: POST
        body_format: json
        body:
          identity: "{{ npm_email }}"
          secret: "{{ npm_password }}"
        status_code: 200
      register: npm_auth
      no_log: true
      delegate_to: localhost
      become: false

    - name: List all NPM proxy hosts
      ansible.builtin.uri:
        url: "{{ npm_url }}/api/nginx/proxy-hosts"
        method: GET
        headers:
          Authorization: "Bearer {{ npm_auth.json.token }}"
        status_code: 200
      register: npm_hosts
      delegate_to: localhost
      become: false

    - name: Find existing proxy host for {{ dns_domain }}
      ansible.builtin.set_fact:
        npm_host: >-
          {{ npm_hosts.json |
             selectattr('domain_names', 'contains', dns_domain) |
             list | first | default(None) }}
      delegate_to: localhost
      become: false

    - name: Create NPM proxy host (does not exist yet)
      ansible.builtin.uri:
        url: "{{ npm_url }}/api/nginx/proxy-hosts"
        method: POST
        headers:
          Authorization: "Bearer {{ npm_auth.json.token }}"
        body_format: json
        body:
          domain_names: ["{{ dns_domain }}"]
          forward_scheme: http
          forward_host: "{{ agent_cp_ip }}"
          forward_port: 80
          caching_enabled: false
          block_exploits: true
          allow_websocket_upgrade: true
          http2_support: true
          ssl_forced: true
          hsts_enabled: true
          hsts_subdomains: false
          certificate_id: 3
          locations: []
          advanced_config: ""
          meta: {}
        status_code: 201
      when: npm_host is none
      delegate_to: localhost
      become: false

    - name: Update NPM proxy forward target (already exists)
      ansible.builtin.uri:
        url: "{{ npm_url }}/api/nginx/proxy-hosts/{{ npm_host.id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ npm_auth.json.token }}"
        body_format: json
        body:
          domain_names: "{{ npm_host.domain_names }}"
          forward_scheme: "{{ npm_host.forward_scheme }}"
          forward_host: "{{ agent_cp_ip }}"
          forward_port: 80
          caching_enabled: "{{ npm_host.caching_enabled }}"
          block_exploits: "{{ npm_host.block_exploits }}"
          allow_websocket_upgrade: "{{ npm_host.allow_websocket_upgrade }}"
          http2_support: "{{ npm_host.http2_support }}"
          ssl_forced: "{{ npm_host.ssl_forced }}"
          certificate_id: "{{ npm_host.certificate_id }}"
          meta: "{{ npm_host.meta }}"
          locations: "{{ npm_host.locations | default([]) or [] }}"
          advanced_config: "{{ npm_host.advanced_config }}"
        status_code: 200
      when: npm_host is not none and (npm_host.forward_host != agent_cp_ip or npm_host.forward_port != 80)
      delegate_to: localhost
      become: false

    # ── NetBox registration ─────────────────────────────────────────────────────

    - name: Register agent-control-plane in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: agent-cp
            cluster: unraid-docker
            role: Application
            platform: Docker
            primary_ip4: "{{ agent_cp_ip }}/23"
            dns_name: "{{ dns_domain }}"
            comments: "LLM agent dashboard + approvals — https://{{ dns_domain }} / http://{{ agent_cp_ip }}"
