---
# Convert DeepSeek-R1-Distill-Qwen-1.5B to TensorRT engine for Jetson Orin Nano
#
# Proven alternative to Qwen3-1.7B-Thinking
# - Model size: 1.5B parameters
# - Expected VRAM: 2.5GB (FP16) / 1.2GB (INT8 quantized)
# - TensorRT speedup: ~16x vs. standard inference
# - Reasoning: 800k CoT samples, distilled from full R1
# - Chain-of-Thought: Explicit CoT outputs
# - Memory headroom: Most conservative (5.5GB free for OpenClaw)
#
# Prerequisites:
#   - Base deployment completed: deploy-reasoning-llm-base.yml
#   - Sufficient disk space: ~25GB for model + engine compilation
#   - HUGGINGFACE_RO token exported
#   - ~1.5 hours for conversion (on Jetson hardware)
#
# Usage:
#   ansible-playbook playbooks/jetson/convert-deepseek-r1-distill-1.5b.yml \
#     --limit jetson.lab --check --diff
#
#   # Apply conversion (WARNING: long-running)
#   ansible-playbook playbooks/jetson/convert-deepseek-r1-distill-1.5b.yml \
#     --limit jetson.lab -v

- name: Convert DeepSeek-R1-Distill-Qwen-1.5B to TensorRT engine
  hosts: jetson.lab
  gather_facts: no
  become: true
  vars:
    # DeepSeek-R1 model specifications
    trtllm_conversion_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    trtllm_conversion_alias: "deepseek-r1-distill-1.5b"

    # Qwen2 conversion script (DeepSeek-R1-Distill uses qwen2 architecture)
    trtllm_conversion_convert_script: "/opt/TensorRT-LLM/examples/qwen/convert_checkpoint.py"

    # Optimization parameters for 8GB Jetson
    # float16: Balances memory (2.5GB) and speed
    # max_batch_size: 1 for single-user inference
    # max_input_len: 1024 (smaller for tighter memory constraints)
    # max_seq_len: 4096 (reduced from 8192 for tighter memory)
    trtllm_conversion_dtype: float16
    trtllm_conversion_gemm: float16
    trtllm_conversion_max_batch_size: 1
    trtllm_conversion_max_input_len: 1024
    trtllm_conversion_max_seq_len: 4096

  roles:
    - jetson-trtllm-convert

  post_tasks:
    - name: Display conversion completion info
      ansible.builtin.debug:
        msg: |
          ✓ DeepSeek-R1-Distill-Qwen-1.5B conversion complete!

          Model details:
            - Alias: {{ trtllm_conversion_alias }}
            - Location: /home/james/models/tensorrt_llm/{{ trtllm_conversion_alias }}/engine
            - Expected VRAM: 2.5GB (FP16) or 1.2GB (INT8 quantized)
            - Speedup: ~16x via TensorRT
            - Reasoning: 800k CoT samples from full R1
            - Memory headroom: Most conservative

          Model advantages:
            - Smaller VRAM footprint (2.5GB vs 3-4GB for Qwen3)
            - Official NVIDIA support via NIM
            - Explicit CoT outputs for reasoning transparency
            - Best memory safety margin

          Next steps:
          1. Validate model:
             ansible-playbook playbooks/jetson/validate-reasoning-llm.yml \
               -e "trtllm_model_to_validate={{ trtllm_conversion_alias }}"

          2. Test inference with OpenClaw integration
          3. Monitor with health check:
             ansible-playbook playbooks/jetson/health-check-reasoning-llm.yml
