---
# Deploy or upgrade OpenClaw gateway on Jetson.
#
# Required env vars on the Ansible controller (sourced from ~/.env_container or 1Password):
#   OPENCLAW_GATEWAY_TOKEN, SLACK_BOT_TOKEN, SLACK_APP_TOKEN, LMSTUDIO_API_KEY
#
# Usage:
#   Full upgrade (pull image + restart):
#     ansible-playbook playbooks/jetson/deploy-openclaw.yml --limit jetson.lab -v
#
#   Config update only (no image pull):
#     ansible-playbook playbooks/jetson/deploy-openclaw.yml --limit jetson.lab --skip-tags image -v
#
#   Force seed config overwrite (e.g. after config corruption or fresh install):
#     ansible-playbook playbooks/jetson/deploy-openclaw.yml --limit jetson.lab -e force_config=true -v

- name: Deploy OpenClaw gateway on Jetson
  hosts: edge_devices
  gather_facts: false
  vars:
    force_config: false

  tasks:
    - name: Ensure OpenClaw deploy directory exists
      ansible.builtin.file:
        path: "{{ jetson_openclaw_deploy_dir }}"
        state: directory
        owner: james
        group: james
        mode: '0755'

    - name: Ensure OpenClaw state directory exists
      ansible.builtin.file:
        path: "{{ jetson_openclaw_state_dir }}"
        state: directory
        owner: james
        group: james
        mode: '0755'

    - name: Ensure OpenClaw workspace directory exists
      ansible.builtin.file:
        path: "{{ jetson_openclaw_workspace_dir }}"
        state: directory
        owner: james
        group: james
        mode: '0755'

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/jetson/openclaw/docker-compose.yml"
        dest: "{{ jetson_openclaw_deploy_dir }}/docker-compose.yml"
        owner: james
        group: james
        mode: '0644'

    - name: Deploy .env file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/jetson/openclaw/.env.j2"
        dest: "{{ jetson_openclaw_deploy_dir }}/.env"
        owner: james
        group: james
        mode: '0600'

    - name: Check if live openclaw.json exists
      ansible.builtin.stat:
        path: "{{ jetson_openclaw_state_dir }}/openclaw.json"
      register: openclaw_config_stat

    - name: Get timestamp for config backup
      ansible.builtin.command: date +%s
      register: backup_timestamp
      changed_when: false
      when: openclaw_config_stat.stat.exists

    - block:
        - name: Backup live openclaw.json before deploy
          become: true
          ansible.builtin.copy:
            src: "{{ jetson_openclaw_state_dir }}/openclaw.json"
            dest: "{{ jetson_openclaw_state_dir }}/openclaw.json.bak.{{ backup_timestamp.stdout }}"
            remote_src: true
            owner: james
            group: james
            mode: '0600'
      rescue:
        - name: Abort — backup failed before config deploy
          ansible.builtin.fail:
            msg: "Could not back up {{ jetson_openclaw_state_dir }}/openclaw.json. Aborting to protect live config. Check disk space on the Jetson."
      when: openclaw_config_stat.stat.exists

    - name: Deploy seed openclaw.json (only if absent or force_config=true)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../files/jetson/openclaw/config/openclaw.json.j2"
        dest: "{{ jetson_openclaw_state_dir }}/openclaw.json"
        owner: james
        group: james
        mode: '0600'
      when: not openclaw_config_stat.stat.exists or (force_config | bool)

    - name: Pull OpenClaw image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ jetson_openclaw_deploy_dir }}"
      changed_when: false
      tags: [image]

    - name: Start or restart OpenClaw stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ jetson_openclaw_deploy_dir }}"
      register: result_up
      changed_when: >
        'Started' in result_up.stdout or
        'Recreated' in result_up.stdout or
        'Created' in result_up.stdout
      tags: [image]

    # ── Device auth token remediation ─────────────────────────────────────────
    # When the container is recreated (e.g. image pull + restart), OpenClaw
    # initialises identity/device-auth.json with empty tokens.  The gateway's
    # device registry (devices/paired.json) retains the valid operator token,
    # so we can reconstruct device-auth.json automatically to avoid a manual
    # token-rotation step after every deploy.

    - name: Check if device-auth.json exists
      ansible.builtin.stat:
        path: "{{ jetson_openclaw_state_dir }}/identity/device-auth.json"
      register: _device_auth_stat
      tags: [image]

    - name: Read device-auth.json
      ansible.builtin.slurp:
        src: "{{ jetson_openclaw_state_dir }}/identity/device-auth.json"
      register: _device_auth_raw
      when: _device_auth_stat.stat.exists
      tags: [image]

    - name: Recover operator token when device-auth.json tokens are empty
      when:
        - _device_auth_stat.stat.exists
        - (_device_auth_raw.content | b64decode | from_json).tokens | default({}) | length == 0
      tags: [image]
      block:
        - name: Read paired.json to recover operator token
          ansible.builtin.slurp:
            src: "{{ jetson_openclaw_state_dir }}/devices/paired.json"
          register: _paired_raw

        - name: Parse device auth and paired device facts
          ansible.builtin.set_fact:
            _device_auth: "{{ _device_auth_raw.content | b64decode | from_json }}"
            _paired: "{{ _paired_raw.content | b64decode | from_json }}"

        - name: Reconstruct device-auth.json with operator token from paired.json
          ansible.builtin.copy:
            content: "{{ _device_auth | combine({'tokens': {'operator': _paired[_device_auth.deviceId].tokens.operator.token}}) | to_nice_json }}\n"
            dest: "{{ jetson_openclaw_state_dir }}/identity/device-auth.json"
            owner: james
            group: james
            mode: '0600'
          when: _device_auth.deviceId in _paired
          register: _device_auth_reconstructed

        - name: Restart OpenClaw to apply recovered device auth
          ansible.builtin.command:
            cmd: docker compose restart openclaw
            chdir: "{{ jetson_openclaw_deploy_dir }}"
          when: _device_auth_reconstructed is changed
          changed_when: true

    # ── Enforce tools.exec.host=gateway ───────────────────────────────────────
    # Director may push tools.exec.host=sandbox via config patch when an agent
    # session starts.  Sandbox mode prevents mcporter from running because the
    # sandbox containers don't have the mcporter binary.  We always enforce
    # gateway mode so exec commands run inside the openclaw container where
    # mcporter is available at /usr/local/bin/mcporter.

    - name: Read current tools.exec.host from openclaw.json
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import json; d=json.load(open('{{ jetson_openclaw_state_dir }}/openclaw.json'));
          print(d.get('tools', {}).get('exec', {}).get('host', 'unset'))"
      register: _exec_host_current
      changed_when: false

    - name: Enforce tools.exec.host=gateway in openclaw.json
      ansible.builtin.command:
        cmd: >
          python3 -c "
          import json
          path = '{{ jetson_openclaw_state_dir }}/openclaw.json'
          with open(path) as f:
              cfg = json.load(f)
          cfg.setdefault('tools', {}).setdefault('exec', {})['host'] = 'gateway'
          cfg['tools']['exec'].setdefault('security', 'full')
          cfg['tools']['exec'].setdefault('ask', 'off')
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "
      when: _exec_host_current.stdout != 'gateway'
      changed_when: true

    - name: Wait for OpenClaw gateway to become available
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jetson_openclaw_port }}"
        status_code: [200, 401, 403, 404]
      register: openclaw_health
      retries: 20
      delay: 5
      until: openclaw_health.status in [200, 401, 403, 404]
      tags: [image]

    # ── Container convenience tools ────────────────────────────────────────────

    - name: Check if zsh is installed in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec openclaw which zsh
      register: _container_zsh
      changed_when: false
      failed_when: false

    - name: Symlink openclaw onto PATH in container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw ln -sf /app/openclaw.mjs /usr/local/bin/openclaw
      changed_when: false

    - name: Install zsh in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "apt-get update -qq && apt-get install -y zsh"
      when: _container_zsh.rc != 0
      changed_when: true

    - name: Render .env_container for container to temp file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/bootstrap-ubuntu/env_container.j2"
        dest: /tmp/.openclaw-env_container
        mode: '0600'
      vars:
        ubuntu_env_container_vars: "{{ jetson_env_container_vars | default({}) }}"

    - name: Copy container-zshrc to temp file on Jetson
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/jetson/openclaw/container-zshrc"
        dest: /tmp/.openclaw-zshrc
        mode: '0644'

    - name: Copy .zshrc into container
      ansible.builtin.command:
        cmd: docker cp /tmp/.openclaw-zshrc openclaw:/home/node/.zshrc
      changed_when: false

    - name: Copy .env_container into container
      ansible.builtin.command:
        cmd: docker cp /tmp/.openclaw-env_container openclaw:/home/node/.env_container
      changed_when: false

    - name: Fix ownership of shell config files in container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw chown node:node /home/node/.zshrc /home/node/.env_container
      changed_when: false

    - name: Remove temp shell config files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/.openclaw-zshrc
        - /tmp/.openclaw-env_container

    # ── node user: sudo for apt-get / pip ─────────────────────────────────────

    - name: Check if sudo is installed in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec openclaw which sudo
      register: _container_sudo
      changed_when: false
      failed_when: false

    - name: Install sudo in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "apt-get update -qq && apt-get install -y sudo"
      when: _container_sudo.rc != 0
      changed_when: true

    - name: Grant node user passwordless sudo for apt-get and pip3
      ansible.builtin.command:
        cmd: >
          docker exec -u root openclaw bash -c
          "echo 'node ALL=(ALL) NOPASSWD: /usr/bin/apt-get, /usr/bin/pip3, /usr/local/bin/pip3' > /etc/sudoers.d/node-tools && chmod 440 /etc/sudoers.d/node-tools"
      changed_when: false

    # ── Docker CLI in container (required for sandbox exec) ───────────────────

    - name: Check if docker CLI is installed in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec openclaw which docker
      register: _container_docker
      changed_when: false
      failed_when: false

    - name: Install docker CLI in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "apt-get update -qq && apt-get install -y docker.io"
      when: _container_docker.rc != 0
      changed_when: true

    # ── pip + Ansible in container ─────────────────────────────────────────────

    - name: Check if ansible is installed in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec openclaw which ansible
      register: _container_ansible
      changed_when: false
      failed_when: false

    - name: Install python3-pip and ansible in OpenClaw container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "apt-get update -qq && apt-get install -y python3-pip && pip3 install --quiet --break-system-packages ansible"
      when: _container_ansible.rc != 0
      changed_when: true

    # ── Homelab SSH key for node user ──────────────────────────────────────────

    - name: Ensure /home/node/.ssh exists in container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "mkdir -p /home/node/.ssh && chmod 700 /home/node/.ssh && chown node:node /home/node/.ssh"
      changed_when: false

    - name: Check if homelab SSH key exists in container
      ansible.builtin.command:
        cmd: docker exec openclaw test -f /home/node/.ssh/id_ed25519_homelab
      register: _homelab_key_stat
      changed_when: false
      failed_when: false

    - name: Copy homelab private key to temp file on Jetson
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_homelab"
        dest: /tmp/.openclaw-homelab-key
        mode: '0600'
      when: _homelab_key_stat.rc != 0

    - name: Copy homelab private key into container
      ansible.builtin.command:
        cmd: docker cp /tmp/.openclaw-homelab-key openclaw:/home/node/.ssh/id_ed25519_homelab
      changed_when: true
      when: _homelab_key_stat.rc != 0

    - name: Fix key permissions and ownership in container
      ansible.builtin.command:
        cmd: docker exec -u root openclaw bash -c "chmod 600 /home/node/.ssh/id_ed25519_homelab && chown node:node /home/node/.ssh/id_ed25519_homelab"
      changed_when: false
      when: _homelab_key_stat.rc != 0

    - name: Remove temp homelab key from Jetson
      ansible.builtin.file:
        path: /tmp/.openclaw-homelab-key
        state: absent
      when: _homelab_key_stat.rc != 0

    - name: Deploy oc wrapper script
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/oc
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Wrapper for OpenClaw CLI inside the openclaw container.
          # Usage: oc <command> [args...]   e.g. oc tui, oc devices list
          #        oc shell                 drop into a zsh shell as node user
          if [ "${1}" = "shell" ]; then
            exec docker exec -u node -it openclaw zsh
          elif [ -t 0 ] && [ -t 1 ]; then
            exec docker exec -u node -it openclaw node dist/index.js "$@"
          else
            exec docker exec -u node openclaw node dist/index.js "$@"
          fi

    - name: Report OpenClaw container status
      ansible.builtin.command:
        cmd: "docker ps --filter name=openclaw --format {% raw %}'table {{.Names}}\t{{.Status}}\t{{.Image}}'{% endraw %}"
      register: container_status
      changed_when: false

    - name: Show container status
      ansible.builtin.debug:
        msg: "{{ container_status.stdout_lines }}"
