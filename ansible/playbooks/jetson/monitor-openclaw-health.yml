---
# OpenClaw + Jetson Continuous Health Monitoring
#
# Validates Jetson Ollama endpoint health for OpenClaw integration
# Run periodically via cron or monitoring system
#
# Usage:
#   ansible-playbook playbooks/jetson/monitor-openclaw-health.yml
#
# Exit codes:
#   0 - All health checks passed
#   1 - One or more health checks failed
#
# Optional: Configure alerting via environment variables:
#   SLACK_WEBHOOK_URL - Send alerts to Slack
#   ALERT_EMAIL - Send alerts via email

- name: Monitor OpenClaw + Jetson Health
  hosts: localhost
  gather_facts: yes
  vars:
    jetson_endpoint: "http://192.168.20.169:11434"
    llama_model: "llama3.1:8b-instruct-q4_K_M"
    qwen_model: "qwen2.5-coder:7b-instruct-q4_K_M"
    min_tokens_per_sec: 7.0  # Conservative threshold accounting for cold start
    max_response_time: 60
    health_status: {}

  tasks:
    - name: Initialize health status
      ansible.builtin.set_fact:
        health_status:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          endpoint: "{{ jetson_endpoint }}"
          checks: []
          overall_status: "PASS"

    # ========================================
    # Check 1: Endpoint Connectivity
    # ========================================
    - name: Check endpoint connectivity
      ansible.builtin.uri:
        url: "{{ jetson_endpoint }}/api/version"
        method: GET
        return_content: yes
        timeout: 5
      register: connectivity_check
      ignore_errors: yes

    - name: Record connectivity result
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'checks': health_status.checks + [connectivity_result]}) }}"
      vars:
        connectivity_result:
          name: "Endpoint Connectivity"
          status: "{{ 'PASS' if connectivity_check.status == 200 else 'FAIL' }}"
          details: "{{ connectivity_check.json.version if connectivity_check.status == 200 else 'Connection failed' }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Update overall status if connectivity failed
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'overall_status': 'FAIL'}) }}"
      when: connectivity_check.status != 200

    # ========================================
    # Check 2: Model Availability
    # ========================================
    - name: List available models
      ansible.builtin.uri:
        url: "{{ jetson_endpoint }}/api/tags"
        method: GET
        return_content: yes
        timeout: 10
      register: models_check
      ignore_errors: yes
      when: connectivity_check.status == 200

    - name: Verify Llama model
      ansible.builtin.set_fact:
        llama_available: "{{ models_check.json.models | selectattr('name', 'search', llama_model) | list | length > 0 }}"
      when: connectivity_check.status == 200 and models_check.status == 200

    - name: Verify Qwen model
      ansible.builtin.set_fact:
        qwen_available: "{{ models_check.json.models | selectattr('name', 'search', qwen_model) | list | length > 0 }}"
      when: connectivity_check.status == 200 and models_check.status == 200

    - name: Record model availability
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'checks': health_status.checks + [model_result]}) }}"
      vars:
        model_status: "{{ 'PASS' if (llama_available | default(false) and qwen_available | default(false)) else 'FAIL' }}"
        model_result:
          name: "Model Availability"
          status: "{{ model_status }}"
          details: "Llama: {{ 'OK' if llama_available | default(false) else 'MISSING' }}, Qwen: {{ 'OK' if qwen_available | default(false) else 'MISSING' }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
      when: connectivity_check.status == 200

    - name: Update overall status if models missing
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'overall_status': 'FAIL'}) }}"
      when: connectivity_check.status == 200 and (not (llama_available | default(false)) or not (qwen_available | default(false)))

    # ========================================
    # Check 3: Reasoning Performance
    # ========================================
    - name: Test reasoning performance
      ansible.builtin.uri:
        url: "{{ jetson_endpoint }}/api/generate"
        method: POST
        body_format: json
        body:
          model: "{{ llama_model }}"
          prompt: "What is 7 * 8? Answer with just the number."
          stream: false
        return_content: yes
        timeout: "{{ max_response_time }}"
      register: reasoning_perf
      ignore_errors: yes
      when: connectivity_check.status == 200 and llama_available | default(false)

    - name: Calculate reasoning metrics
      ansible.builtin.set_fact:
        reasoning_tokens_per_sec: "{{ (reasoning_perf.json.eval_count | float / (reasoning_perf.json.eval_duration | float / 1000000000)) | round(2) }}"
        reasoning_response_time: "{{ (reasoning_perf.json.total_duration | float / 1000000000) | round(2) }}"
      when: connectivity_check.status == 200 and reasoning_perf.status == 200

    - name: Evaluate reasoning performance
      ansible.builtin.set_fact:
        reasoning_status: "{{ 'PASS' if (reasoning_tokens_per_sec | float >= min_tokens_per_sec and reasoning_response_time | float <= max_response_time) else 'WARN' }}"
      when: connectivity_check.status == 200 and reasoning_perf.status == 200

    - name: Record reasoning performance
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'checks': health_status.checks + [reasoning_result]}) }}"
      vars:
        reasoning_result:
          name: "Reasoning Performance"
          status: "{{ reasoning_status | default('FAIL') }}"
          details: "{{ reasoning_tokens_per_sec | default('N/A') }} tokens/sec, {{ reasoning_response_time | default('N/A') }}s response time"
          timestamp: "{{ ansible_date_time.iso8601 }}"
      when: connectivity_check.status == 200 and llama_available | default(false)

    - name: Update overall status if reasoning slow
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'overall_status': 'WARN'}) }}"
      when:
        - connectivity_check.status == 200
        - reasoning_perf.status == 200
        - reasoning_tokens_per_sec | float < min_tokens_per_sec
        - health_status.overall_status == 'PASS'

    # ========================================
    # Check 4: Code Generation Performance
    # ========================================
    - name: Test code generation performance
      ansible.builtin.uri:
        url: "{{ jetson_endpoint }}/api/generate"
        method: POST
        body_format: json
        body:
          model: "{{ qwen_model }}"
          prompt: "Write a one-line Python function that returns the square of a number."
          stream: false
        return_content: yes
        timeout: "{{ max_response_time }}"
      register: code_perf
      ignore_errors: yes
      when: connectivity_check.status == 200 and qwen_available | default(false)

    - name: Calculate code generation metrics
      ansible.builtin.set_fact:
        code_tokens_per_sec: "{{ (code_perf.json.eval_count | float / (code_perf.json.eval_duration | float / 1000000000)) | round(2) }}"
        code_response_time: "{{ (code_perf.json.total_duration | float / 1000000000) | round(2) }}"
      when: connectivity_check.status == 200 and code_perf.status == 200

    - name: Evaluate code performance
      ansible.builtin.set_fact:
        code_status: "{{ 'PASS' if (code_tokens_per_sec | float >= min_tokens_per_sec and code_response_time | float <= max_response_time) else 'WARN' }}"
      when: connectivity_check.status == 200 and code_perf.status == 200

    - name: Record code generation performance
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'checks': health_status.checks + [code_result]}) }}"
      vars:
        code_result:
          name: "Code Generation Performance"
          status: "{{ code_status | default('FAIL') }}"
          details: "{{ code_tokens_per_sec | default('N/A') }} tokens/sec, {{ code_response_time | default('N/A') }}s response time"
          timestamp: "{{ ansible_date_time.iso8601 }}"
      when: connectivity_check.status == 200 and qwen_available | default(false)

    - name: Update overall status if code generation slow
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'overall_status': 'WARN'}) }}"
      when:
        - connectivity_check.status == 200
        - code_perf.status == 200
        - code_tokens_per_sec | float < min_tokens_per_sec
        - health_status.overall_status == 'PASS'

    # ========================================
    # Check 5: Jetson System Health
    # ========================================
    - name: Check Jetson system health
      ansible.builtin.command:
        cmd: ssh -o ConnectTimeout=5 james@jetson.lab "systemctl is-active ollama.service"
      register: jetson_service_check
      ignore_errors: yes
      changed_when: false

    - name: Record Jetson service status
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'checks': health_status.checks + [service_result]}) }}"
      vars:
        service_result:
          name: "Jetson Service Status"
          status: "{{ 'PASS' if jetson_service_check.rc == 0 else 'FAIL' }}"
          details: "{{ 'Service active' if jetson_service_check.rc == 0 else 'Service not active' }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: Update overall status if service down
      ansible.builtin.set_fact:
        health_status: "{{ health_status | combine({'overall_status': 'FAIL'}) }}"
      when: jetson_service_check.rc != 0

    # ========================================
    # Generate Report
    # ========================================
    - name: Display health report
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "   OpenClaw + Jetson Health Check                       "
          - "════════════════════════════════════════════════════════"
          - ""
          - "Timestamp: {{ health_status.timestamp }}"
          - "Endpoint: {{ health_status.endpoint }}"
          - "Overall Status: {{ health_status.overall_status }}"
          - ""
          - "Check Results:"
          - "{% for check in health_status.checks %}"
          - "  [{{ check.status }}] {{ check.name }}: {{ check.details }}"
          - "{% endfor %}"
          - ""
          - "════════════════════════════════════════════════════════"

    - name: Save health report
      ansible.builtin.copy:
        content: |
          # OpenClaw + Jetson Health Report

          **Timestamp:** {{ health_status.timestamp }}
          **Endpoint:** {{ health_status.endpoint }}
          **Overall Status:** {{ health_status.overall_status }}

          ## Check Results

          {% for check in health_status.checks %}
          ### {{ check.name }}
          - **Status:** {{ check.status }}
          - **Details:** {{ check.details }}
          - **Timestamp:** {{ check.timestamp }}

          {% endfor %}

          ## Thresholds
          - Minimum tokens/sec: {{ min_tokens_per_sec }}
          - Maximum response time: {{ max_response_time }}s

          ## Status Levels
          - **PASS:** All checks passed, system healthy
          - **WARN:** System functional but performance degraded
          - **FAIL:** Critical checks failed, immediate attention required
        dest: "/tmp/openclaw-health-{{ ansible_date_time.epoch }}.md"

    # ========================================
    # Fail playbook if health check failed
    # ========================================
    - name: Fail if health check failed
      ansible.builtin.fail:
        msg: "Health check FAILED - {{ health_status.overall_status }}"
      when: health_status.overall_status == 'FAIL'

    - name: Warn if health check degraded
      ansible.builtin.debug:
        msg: "WARNING: Health check shows degraded performance"
      when: health_status.overall_status == 'WARN'

    - name: Success message
      ansible.builtin.debug:
        msg: "✓ All health checks passed - system healthy"
      when: health_status.overall_status == 'PASS'
