---
# Template playbook for converting reasoning LLM models to TensorRT format
# This is a parameterized template to be adapted per-model
#
# Parameters (set as vars):
#   trtllm_conversion_model: HuggingFace model ID (e.g., "Qwen/Qwen-QwQ-1B")
#   trtllm_conversion_alias: Friendly name (e.g., "qwen-qwq-1b")
#   trtllm_conversion_convert_script: Model-specific converter (e.g., "/opt/TensorRT-LLM/examples/qwen/convert_checkpoint.py")
#   trtllm_conversion_dtype: float16 or bfloat16
#   trtllm_conversion_gemm: float16 or int8
#   trtllm_conversion_max_batch_size: 1-4 for 8GB Jetson
#   trtllm_conversion_max_input_len: Context window (1024, 2048, 4096)
#   trtllm_conversion_max_seq_len: Max output sequence (8192+)
#
# Prerequisites:
#   - Base deployment completed (deploy-reasoning-llm-base.yml)
#   - jetson.lab host configured in inventory
#   - HUGGINGFACE_RO env var set
#   - Sufficient disk space (~20-30GB for model + engine)
#
# Usage example:
#   ansible-playbook playbooks/jetson/convert-reasoning-llm-template.yml \
#     -e "trtllm_conversion_model='Qwen/Qwen-QwQ-1B'" \
#     -e "trtllm_conversion_alias='qwen-qwq-1b'" \
#     -e "trtllm_conversion_convert_script='/opt/TensorRT-LLM/examples/qwen/convert_checkpoint.py'" \
#     --limit jetson.lab --check --diff

- name: Convert reasoning LLM to TensorRT engine
  hosts: jetson.lab
  gather_facts: no
  become: true
  vars:
    # Override these per-model
    trtllm_conversion_model: "meta-llama/Llama-3.2-3B-Instruct"  # CHANGEME
    trtllm_conversion_alias: "reasoning-model"                   # CHANGEME
    trtllm_conversion_convert_script: "/opt/TensorRT-LLM/examples/llama/convert_checkpoint.py"  # CHANGEME
    trtllm_conversion_dtype: float16
    trtllm_conversion_gemm: float16
    trtllm_conversion_max_batch_size: 1
    trtllm_conversion_max_input_len: 2048
    trtllm_conversion_max_seq_len: 8192
  roles:
    - jetson-trtllm-convert
