---
# Convert DeepSeek-R1-Distill-Qwen3-8B to TensorRT engine for Jetson Orin Nano
#
# ADVANCED DEPLOYMENT: Premium reasoning quality at the memory limit
# - Model size: 8B parameters (highly aggressive quantization)
# - Expected VRAM: 6-7GB (4-bit quantized) - TIGHT MARGIN
# - TensorRT speedup: ~16x vs. standard inference
# - Reasoning: +10pp over Qwen3-8B base, ties 235B thinking on AIME 2024
# - Chain-of-Thought: Best-in-class reasoning quality
# - Stability margin: Only ~1GB free (risky if other services present)
#
# ⚠️  ADVANCED DEPLOYMENT - USE ONLY IF:
#   - Jetson is dedicated to inference (no competing services)
#   - Memory can be monitored and optimized
#   - Acceptable to risk OOM if system memory spikes
#   - Reasoning quality is worth the memory risk
#
# Prerequisites:
#   - Base deployment completed: deploy-reasoning-llm-base.yml
#   - High disk space: ~50GB for model + engine compilation
#   - HUGGINGFACE_RO token exported
#   - ~3+ hours for conversion (CPU-bound on Jetson)
#   - NO competing services (MCP servers, Ollama, etc.)
#   - Prepare for OOM mitigation strategies
#
# Usage:
#   ansible-playbook playbooks/jetson/convert-deepseek-r1-distill-8b.yml \
#     --limit jetson.lab --check --diff
#
#   # Apply conversion (WARNING: very long-running, 3+ hours)
#   ansible-playbook playbooks/jetson/convert-deepseek-r1-distill-8b.yml \
#     --limit jetson.lab -v
#
# Troubleshooting OOM during conversion:
#   - Reduce max_batch_size to 1 (if not already)
#   - Lower max_seq_len to 2048
#   - Use smaller model variant (1.5B or 1.7B)
#   - Increase swap: dd if=/dev/zero of=/swapfile bs=1G count=4 && mkswap /swapfile

- name: Convert DeepSeek-R1-Distill-Qwen3-8B to TensorRT engine
  hosts: jetson.lab
  gather_facts: no
  become: true
  vars:
    # DeepSeek-R1-Distill-8B specifications
    trtllm_conversion_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen3-8B"
    trtllm_conversion_alias: "deepseek-r1-distill-8b"

    # Qwen3-family conversion script
    trtllm_conversion_convert_script: "/opt/TensorRT-LLM/examples/qwen/convert_checkpoint.py"

    # AGGRESSIVE OPTIMIZATION for 8GB constraint
    # int8: Quantized to fit in 6-7GB (trades precision for memory)
    # max_batch_size: 1 (mandatory for 8B)
    # max_input_len: 1024 (tight for reasoning context)
    # max_seq_len: 4096 (sacrifice output length for memory headroom)
    trtllm_conversion_dtype: int8
    trtllm_conversion_gemm: int8
    trtllm_conversion_max_batch_size: 1
    trtllm_conversion_max_input_len: 1024
    trtllm_conversion_max_seq_len: 4096

  pre_tasks:
    - name: Display deployment warning
      ansible.builtin.debug:
        msg: |
          ⚠️  WARNING: ADVANCED MEMORY-CONSTRAINED DEPLOYMENT

          This deployment uses aggressive 4-bit quantization to fit an 8B model
          on an 8GB Jetson. It leaves only ~1GB system memory free.

          RISKS:
          - OOM errors if system memory spikes
          - Reduced numeric precision (INT8 quantization)
          - Slower inference than FP16 due to dequantization
          - No headroom for competing services

          BENEFITS:
          - Best-in-class reasoning quality (ties 235B on AIME 2024)
          - +10pp improvement over 8B base models
          - Full 8B parameter capacity

          ONLY PROCEED IF:
          ✓ Jetson is fully dedicated to inference
          ✓ No competing services (MCP, Ollama, etc.)
          ✓ Monitoring and swap space configured
          ✓ Willing to manage potential OOM conditions

          To cancel: Ctrl+C now (within 10 seconds)

  roles:
    - jetson-trtllm-convert

  post_tasks:
    - name: Display conversion completion info
      ansible.builtin.debug:
        msg: |
          ✓ DeepSeek-R1-Distill-Qwen3-8B conversion complete!

          Model details:
            - Alias: {{ trtllm_conversion_alias }}
            - Location: /home/james/models/tensorrt_llm/{{ trtllm_conversion_alias }}/engine
            - Parameters: 8B (quantized with INT8)
            - Expected VRAM: 6-7GB (TIGHT)
            - Free system memory: ~1GB (HIGH RISK)
            - Speedup: ~16x via TensorRT

          Performance expectations:
            - Inference speed: 30-40 tokens/sec
            - Reasoning quality: Best-in-class (~235B equivalent)
            - Per-token latency: 25-33ms
            - Full chain latency: 25-33s for 1000-token reasoning

          CRITICAL NEXT STEPS:
          1. Monitor memory immediately:
             watch -n 1 'free -h'
             docker exec trtllm-dev nvidia-smi dmon

          2. Validate model with memory watch:
             (while true; do free -h; sleep 2; done) &
             ansible-playbook playbooks/jetson/validate-reasoning-llm.yml \
               -e "trtllm_model_to_validate={{ trtllm_conversion_alias }}"

          3. Configure swap backup (for OOM mitigation):
             dd if=/dev/zero of=/swapfile bs=1G count=4
             chmod 600 /swapfile
             mkswap /swapfile
             swapon /swapfile

          4. Test inference stress:
             docker exec trtllm-dev python3 -c "
             from tensorrt_llm.runtime import ModelRunner
             runner = ModelRunner.from_dir('/data/models/tensorrt_llm/{{ trtllm_conversion_alias }}/engine')
             # Generate 1000 tokens to test sustained memory usage
             runner.generate([[1,2,3]], max_new_tokens=1000)
             "

          ⚠️  If OOM occurs:
          - Kill heavy processes
          - Restart container: docker restart trtllm-dev
          - Consider smaller model variant (1.5B or 1.7B)
          - Disable other services
