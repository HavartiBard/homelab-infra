---
# Deploy observability agents to homelab hosts
# node_exporter + promtail: all Docker-capable hosts
# node_exporter on pve: native apt package (no Docker on Proxmox hosts)
# cadvisor: Docker hosts only (unraid, edge_devices, workstations)
# Excludes: windows_gpu (no SSH on port 22)
# Note: all tt/agh nodes have passwordless sudo for the ansible user (james)

- name: Deploy node_exporter to all hosts
  hosts: unraid:tt:agh:edge_devices:workstations
  gather_facts: false
  become: true
  roles:
    - node_exporter
  post_tasks:
    - name: Register Unraid node_exporter in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: node_exporter
            cluster: unraid-docker
            role: Application
            comments: "Unraid host metrics exporter — http://{{ ansible_host }}:9100/metrics"
      when: "'unraid' in group_names"

- name: Deploy node_exporter to Proxmox hosts (native package, no Docker)
  hosts: pve
  gather_facts: false
  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start prometheus-node-exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Verify node_exporter port is reachable
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 9100
        timeout: 30
      delegate_to: localhost

- name: Deploy Promtail to all hosts
  hosts: unraid:tt:agh:edge_devices:workstations
  gather_facts: false
  become: true
  roles:
    - promtail
  post_tasks:
    - name: Register Unraid promtail in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: promtail
            cluster: unraid-docker
            role: Application
            comments: "Unraid log shipper to Loki"
      when: "'unraid' in group_names"

- name: Deploy cAdvisor to Docker hosts
  hosts: unraid:edge_devices:workstations
  gather_facts: false
  become: true
  roles:
    - cadvisor
  post_tasks:
    - name: Register Unraid cAdvisor in NetBox
      ansible.builtin.include_role:
        name: netbox-service
      vars:
        netbox_services:
          - name: cadvisor
            cluster: unraid-docker
            role: Application
            comments: "Container metrics on Unraid — http://{{ ansible_host }}:8081"
      when: "'unraid' in group_names"
