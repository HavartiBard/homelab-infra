---
# Cross-compile DeepSeek-R1-Distill-Qwen-1.5B to TensorRT engine on host machine
#
# Since Jetson Nano cannot build TensorRT engines directly (insufficient RAM),
# this playbook runs on a host with GPU (pve-01 or Unraid) to build the engine,
# then transfers it to jetson.lab via SCP.
#
# Required environment variables:
#   - HUGGINGFACE_RO: HuggingFace token for model access
#
# Usage:
#   HUGGINGFACE_RO=$TOKEN ansible-playbook playbooks/misc/convert-jetson-reasoning-llm.yml --limit localhost
#
# Expected output directory:
#   /home/james/models/reasoning-llm/deepseek-r1-distill-qwen-1.5b/{checkpoint,engine}

- name: Cross-compile DeepSeek-R1-Distill-Qwen to TensorRT engine
  hosts: localhost
  gather_facts: no
  vars:
    reasoning_llm_conversion_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    reasoning_llm_conversion_alias: deepseek-r1-distill-qwen-1.5b
    reasoning_llm_conversion_dtype: float16
    reasoning_llm_conversion_gemm: float16
    reasoning_llm_conversion_max_batch_size: 1
    reasoning_llm_conversion_max_input_len: 2048
    reasoning_llm_conversion_max_seq_len: 8192
    reasoning_llm_conversion_convert_script: "/opt/TensorRT-LLM/examples/llama/convert_checkpoint.py"
  roles:
    - jetson-reasoning-llm-convert
