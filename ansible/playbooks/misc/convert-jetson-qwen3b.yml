---
- name: Convert Qwen2.5-Coder-3B inside Jetson TensorRT-LLM container
  hosts: jetson.lab
  gather_facts: no
  become: true
  vars:
    trtllm_conversion_model: EasierAI/Qwen-2.5-Coder-3B-Instruct
    trtllm_conversion_alias: qwen-2.5-coder-3b-instruct
    trtllm_conversion_dtype: float16
    trtllm_conversion_gemm: float16
    trtllm_conversion_max_batch_size: 1
    trtllm_conversion_max_input_len: 2048
    trtllm_conversion_max_seq_len: 8192
  roles:
    - jetson-trtllm-convert
