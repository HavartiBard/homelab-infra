---
# Deploy observability agents to homelab hosts
# node_exporter + promtail: all Docker-capable hosts
# cadvisor: Docker hosts only (unraid, edge_devices)
# Excludes: pve (no Docker), windows_gpu (no SSH on port 22)
# Note: tt/agh require sudo password — run with --ask-become-pass or set ansible_become_password in vault

- name: Deploy node_exporter to all hosts
  hosts: unraid:tt:agh:edge_devices
  gather_facts: false
  become: true
  roles:
    - node_exporter

- name: Deploy Promtail to all hosts
  hosts: unraid:tt:agh:edge_devices
  gather_facts: false
  become: true
  roles:
    - promtail

- name: Deploy cAdvisor to Docker hosts
  hosts: unraid:edge_devices
  gather_facts: false
  become: true
  roles:
    - cadvisor
