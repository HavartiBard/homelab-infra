---
# Deploy Immich photo management platform
# Unraid: server + postgres + redis
# Goudai: machine learning container (NFS model cache at /mnt/ai-models/immich)
#
# Usage:
#   ./scripts/run-playbook.sh immich playbooks/platform/deploy-immich.yml --limit unraid-server,goudai
#
# Secrets resolved from 1Password via ansible/envs/immich.env (see
# docs/secrets-management.md).

- name: Deploy Immich server stack (Unraid)
  hosts: unraid
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/vault.yml"
  roles:
    - immich

- name: Deploy Immich ML container (Goudai)
  hosts: goudai
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/vault.yml"
  roles:
    - immich-ml
