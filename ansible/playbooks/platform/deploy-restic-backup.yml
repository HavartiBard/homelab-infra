---
# Deploy restic → B2 nightly backups to Unraid (issue #31)
#
# Run (secrets resolved from 1Password via ansible/envs/restic-backup.env,
# see docs/secrets-management.md):
#   ./scripts/run-playbook.sh restic-backup playbooks/platform/deploy-restic-backup.yml \
#     --limit unraid

- name: Deploy restic backups to Unraid
  hosts: unraid
  gather_facts: false
  roles:
    - restic-backup
