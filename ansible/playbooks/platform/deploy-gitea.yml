---
# Deploy Gitea on Unraid
#
# Usage:
#   ./scripts/run-playbook.sh gitea playbooks/platform/deploy-gitea.yml --limit unraid
#
# Secrets resolved from 1Password via ansible/envs/gitea.env (see
# docs/secrets-management.md).

- name: Deploy Gitea on Unraid
  hosts: unraid
  gather_facts: false
  roles:
    - gitea
    - role: netbox-service
      vars:
        netbox_services:
          - name: gitea
            cluster: unraid-docker
            role: Application
            comments: "Git, Actions, and container registry — https://code.klsll.com"
