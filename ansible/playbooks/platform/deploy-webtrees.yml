---
# Deploy Webtrees self-hosted family tree (fisharebest/webtrees)
# Unraid: webtrees + mariadb stack
#
# Usage:
#   ./scripts/run-playbook.sh webtrees playbooks/platform/deploy-webtrees.yml --limit unraid-server
#
# Secrets resolved from 1Password via ansible/envs/webtrees.env (see
# docs/secrets-management.md).

- name: Deploy Webtrees stack (Unraid)
  hosts: unraid
  gather_facts: false
  roles:
    - webtrees
