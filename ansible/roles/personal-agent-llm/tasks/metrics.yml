---
- name: Ensure model cache directory exists
  ansible.builtin.file:
    path: "{{ personal_agent_llm_cache_dir }}"
    state: directory
    owner: "{{ personal_agent_llm_user if personal_agent_llm_cache_manage_owner | default(true) | bool else omit }}"
    group: "{{ personal_agent_llm_user if personal_agent_llm_cache_manage_owner | default(true) | bool else omit }}"
    mode: '0755'
  tags: [metrics]

- name: Ensure node_exporter textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}"
    state: directory
    mode: '0755'
  tags: [metrics]

- name: Deploy goudai LLM metrics collector
  ansible.builtin.template:
    src: goudai-llm-metrics.py.j2
    dest: /usr/local/bin/goudai-llm-metrics
    mode: '0755'
  tags: [metrics]

- name: Deploy goudai LLM metrics systemd service
  ansible.builtin.template:
    src: goudai-llm-metrics.service.j2
    dest: /etc/systemd/system/goudai-llm-metrics.service
    mode: '0644'
  tags: [metrics]

- name: Deploy goudai LLM metrics systemd timer
  ansible.builtin.template:
    src: goudai-llm-metrics.timer.j2
    dest: /etc/systemd/system/goudai-llm-metrics.timer
    mode: '0644'
  tags: [metrics]

- name: Enable and start goudai LLM metrics timer
  ansible.builtin.systemd:
    name: goudai-llm-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [metrics]
