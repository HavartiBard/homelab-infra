---
# Using raw commands throughout — Unraid has no Python

- name: Ensure appdata/searxng directory exists
  ansible.builtin.raw: mkdir -p {{ searxng_mcp_appdata }}/searxng
  changed_when: false

- name: Preserve or generate SearXNG secret key
  ansible.builtin.raw: |
    secret=$(grep -m1 secret_key: {{ searxng_mcp_appdata }}/searxng/settings.yml 2>/dev/null | cut -d# -f1 | cut -d: -f2 | tr -dc A-Za-z0-9)
    if [ -n "$secret" ]; then
      printf '%s' "$secret"
    else
      openssl rand -hex 32
    fi
  register: searxng_secret_key_lookup
  changed_when: false

- name: Set SearXNG secret key fact
  ansible.builtin.set_fact:
    searxng_secret_key_effective: "{{ searxng_secret_key | default(searxng_secret_key_lookup.stdout | trim, true) }}"
  no_log: true

- name: Generate SearXNG settings content
  ansible.builtin.set_fact:
    searxng_settings_content: "{{ lookup('template', role_path + '/templates/settings.yml.j2') }}"
  no_log: true

- name: Write SearXNG settings.yml
  ansible.builtin.raw: |
    cat > {{ searxng_mcp_appdata }}/searxng/settings.yml << 'EOFSEARXNG'
    {{ searxng_settings_content }}
    EOFSEARXNG
    chown 977:977 {{ searxng_mcp_appdata }}/searxng/settings.yml
  changed_when: true
  no_log: true

- name: Ensure compose directory exists
  ansible.builtin.raw: mkdir -p {{ searxng_mcp_compose_dir }}
  changed_when: false

- name: Generate docker-compose.yml content
  ansible.builtin.set_fact:
    compose_content: "{{ lookup('template', role_path + '/templates/docker-compose.yml.j2') }}"

- name: Write docker-compose.yml
  ansible.builtin.raw: |
    cat > {{ searxng_mcp_compose_dir }}/docker-compose.yml << 'EOFCOMPOSE'
    {{ compose_content }}
    EOFCOMPOSE
  changed_when: true

- name: Pull searxng image
  ansible.builtin.raw: docker pull {{ searxng_image }}
  register: pull_searxng
  changed_when: "'Downloaded newer image' in pull_searxng.stdout or 'Pull complete' in pull_searxng.stdout"
  tags: [image]

- name: Pull mcp-searxng image
  ansible.builtin.raw: docker pull {{ searxng_mcp_image }}
  register: pull_mcp
  changed_when: "'Downloaded newer image' in pull_mcp.stdout or 'Pull complete' in pull_mcp.stdout"
  tags: [image]

- name: Deploy compose stack
  ansible.builtin.raw: |
    cd {{ searxng_mcp_compose_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for mcp-searxng to be healthy
  ansible.builtin.raw: |
    for i in $(seq 1 12); do
      if curl -sf http://localhost:{{ searxng_mcp_port }}/health > /dev/null 2>&1; then
        echo "healthy"; exit 0
      fi
      sleep 5
    done
    echo "timeout waiting for searxng-mcp" >&2; exit 1
  changed_when: false
