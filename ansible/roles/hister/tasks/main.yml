---
# Using raw commands throughout — Unraid has no Python

- name: Ensure appdata directory exists
  ansible.builtin.raw: mkdir -p {{ hister_appdata }}/data
  changed_when: false

- name: Ensure compose directory exists
  ansible.builtin.raw: mkdir -p {{ hister_compose_dir }}
  changed_when: false

- name: Generate docker-compose.yml content
  ansible.builtin.set_fact:
    _hister_compose_content: "{{ lookup('template', role_path + '/templates/docker-compose.yml.j2') }}"

- name: Write docker-compose.yml
  ansible.builtin.raw: |
    cat > {{ hister_compose_dir }}/docker-compose.yml << 'EOFCOMPOSE'
    {{ _hister_compose_content }}
    EOFCOMPOSE
  changed_when: true

- name: Pull hister image
  ansible.builtin.raw: docker pull {{ hister_image }}
  register: pull_hister
  changed_when: "'Downloaded newer image' in pull_hister.stdout or 'Pull complete' in pull_hister.stdout"
  tags: [image]

- name: Deploy compose stack
  ansible.builtin.raw: |
    cd {{ hister_compose_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for hister to be healthy
  ansible.builtin.raw: |
    for i in $(seq 1 12); do
      if curl -sf http://localhost:{{ hister_port }}/ > /dev/null 2>&1; then
        echo "healthy"; exit 0
      fi
      sleep 5
    done
    echo "timeout waiting for hister" >&2; exit 1
  changed_when: false
