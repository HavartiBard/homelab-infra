---
# Using raw commands throughout — Unraid has no Python.

- name: Ensure Promptfoo appdata directory exists
  ansible.builtin.raw: mkdir -p {{ promptfoo_appdata }}
  changed_when: false

- name: Ensure Promptfoo compose directory exists
  ansible.builtin.raw: mkdir -p {{ promptfoo_compose_dir }}
  changed_when: false

- name: Generate Promptfoo docker-compose.yml content
  ansible.builtin.set_fact:
    _promptfoo_compose_content: "{{ lookup('template', playbook_dir + '/../../files/promptfoo/docker-compose.yml') }}"

- name: Write Promptfoo docker-compose.yml
  ansible.builtin.raw: |
    cat > {{ promptfoo_compose_dir }}/docker-compose.yml << 'EOFCOMPOSE'
    {{ _promptfoo_compose_content }}
    EOFCOMPOSE
  changed_when: true

- name: Pull Promptfoo image
  ansible.builtin.raw: docker pull {{ promptfoo_image }}
  register: pull_promptfoo
  changed_when: "'Downloaded newer image' in pull_promptfoo.stdout or 'Pull complete' in pull_promptfoo.stdout"
  tags: [image]

- name: Deploy Promptfoo compose stack
  ansible.builtin.raw: |
    cd {{ promptfoo_compose_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for Promptfoo UI to be healthy
  ansible.builtin.raw: |
    for i in $(seq 1 24); do
      if curl -sf http://localhost:{{ promptfoo_port }}/ > /dev/null 2>&1; then
        echo "healthy"; exit 0
      fi
      sleep 5
    done
    echo "timeout waiting for Promptfoo" >&2; exit 1
  changed_when: false
