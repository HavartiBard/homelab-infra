---
adguard_op_item: "AdGuard Admin"
adguard_admin_user: >-
  {{ lookup('env', 'ADGUARD_ADMIN_USER')
  | default(vars.get('adguard_admin_user_vault', ''), true)
  | default('admin') }}
adguard_admin_password: >-
  {{ lookup('env', 'ADGUARD_ADMIN_PASSWORD')
  | default(vars.get('adguard_admin_password_vault', ''), true)
  | default('', true) }}

adguard_http_port: 3000
adguard_dns_port: 53

# Local domain and Technitium servers
adguard_local_domain: klsll.com
adguard_technitium_servers:
  - 192.168.20.2
  - 192.168.20.3

# Reverse zones to forward to Technitium
adguard_local_reverse_zones:
  - 1.168.192.in-addr.arpa
  - 20.168.192.in-addr.arpa
  - 30.168.192.in-addr.arpa
  - 40.168.192.in-addr.arpa

# External upstream DNS (for non-local queries)
adguard_upstream_dns:
  - https://1.1.1.1/dns-query
  - https://1.0.0.1/dns-query
  - https://dns.quad9.net/dns-query
  - https://dns.google/dns-query

adguard_bootstrap_dns:
  - 1.1.1.1
  - 1.0.0.1
  - 9.9.9.9
  - 8.8.8.8

adguard_fallback_dns:
  - https://1.1.1.1/dns-query
  - https://dns.quad9.net/dns-query

adguard_filters:
  - name: AdGuard DNS filter
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    id: 1
  - name: OISD Big
    url: https://big.oisd.nl/
    id: 2
  - name: Steven Black Unified
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    id: 3
  - name: Malware URL Blocklist
    url: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh.txt
    id: 4
  - name: Phishing Army Extended
    url: https://phishing.army/download/phishing_army_blocklist_extended.txt
    id: 5

adguard_dnssec_enabled: true
adguard_safebrowsing_enabled: true
adguard_cache_size: 4194304
adguard_cache_optimistic: true

adguard_querylog_interval: 168h
adguard_statistics_interval: 168h

adguard_config_dir: /opt/adguard/data/adguard/conf
adguard_container_name: adguard

# Sync configuration (adguardhome-sync)
adguard_sync_enabled: true
adguard_sync_origin: 192.168.20.4
adguard_sync_replicas:
  - 192.168.20.5
adguard_sync_image: ghcr.io/bakito/adguardhome-sync:latest
