---
# Defaults for the Raclette (Hermes Agent) deployment role.

# Deployment paths
raclette_deploy_dir: /home/james/docker/raclette
raclette_state_dir: /home/james/.raclette

# Container settings
raclette_image: nousresearch/hermes-agent:latest
raclette_container_name: raclette
raclette_dashboard_port: 9119
raclette_gateway_port: 8642

# File paths (derived)
raclette_compose_file: "{{ raclette_deploy_dir }}/docker-compose.yml"
raclette_env_file: "{{ raclette_deploy_dir }}/.env"

# Docker compose command
raclette_docker_compose_command: "docker compose"

# UID/GID mapping — must match host james user so container can write to mounted volumes
raclette_uid: 1000
raclette_gid: 1000

# MCP servers for the config.yaml `mcp_servers:` section. All hosted on
# Unraid (192.168.20.14). Note: earlier revisions of this role declared a
# `director` entry (https://director.klsll.com/raclette/mcp) but it was
# never actually applied to the live agent — dropped during the 2026-07-18
# template/live-config reconciliation. SearXNG and 1Password below replace
# that aggregated access with direct endpoints (2026-07-22) — Director is
# not involved: SearXNG has its own HTTP MCP server, and 1Password's MCP is
# a stdio server bridged to HTTP by mcp-proxy (also used for SoulLayer; see
# ansible/roles/mcp-proxy). This does not affect Director's other clients.
raclette_mcp_servers:
  Gitea:
    url: "http://192.168.20.14:6976/mcp"
  Obsidian:
    url: "http://192.168.20.14:6977/mcp"
  iCloud:
    url: "http://192.168.20.14:6983/mcp"
  SearXNG:
    url: "http://192.168.20.14:6978/mcp"
  OnePassword:
    url: "http://192.168.20.14:6980/servers/onepassword/sse"
    transport: sse
  # artokun/comfyui-mcp sidecar on goudai (ansible/files/goudai/comfyui-ltx/
  # docker-compose.yml.j2) — full 174-tool surface (generation, workflow
  # authoring, model management, process control) for end-to-end image/video
  # content creation. goudai only for now; spraycheese gets its own sidecar
  # later. LAN-only, no bearer token — network isolation is the access
  # control, matching the other entries above.
  ComfyUI:
    url: "http://192.168.20.150:9101/mcp"
  # Hand-added directly on jetson.lab (never tracked in git) — brought under
  # IaC on 2026-07-24. Main GSuite MCP instance (port 8092, see AGENTS.md
  # service table), distinct from gsuite-mcp-lyra (the lyra profile's
  # separate isolated instance managed by its own role).
  gsuite-jma8chz:
    url: "http://192.168.20.14:8092/mcp"

# LLM configuration — primary model is OpenAI Codex (OAuth, auth stored in
# ~/.raclette/auth.json on jetson.lab), hand-tuned directly on the live host
# on 2026-07-2x and codified here on 2026-07-25. No context_length or
# base_url override needed for this provider.
raclette_model_provider: openai-codex
raclette_model_default: "gpt-5.6-luna"
raclette_model_base_url: ""

# Auxiliary task model (vision, web_extract, compression, skills_hub,
# approval, mcp, title_generation, triage_specifier, kanban_decomposer,
# profile_describer, curator) — goudai's llama-swap (OpenAI-compatible, no
# auth, LAN-only), kept resident indefinitely on goudai (ttl: 0 in
# ansible/roles/llama-swap defaults). Independent of raclette_model_provider
# above, which drives the primary chat model only.
raclette_auxiliary_provider: goudai-llama-swap
raclette_auxiliary_model: "qwen/qwen3.6-35b-uncensored"
raclette_auxiliary_base_url: "http://192.168.20.150:8010/v1"

# Extra entries for the config.yaml `providers:` section — custom
# OpenAI-compatible endpoints keyed by provider name (referenced by
# raclette_auxiliary_provider above).
#
# api_key is a harmless dummy value, not a real secret — llama-swap has no
# auth and ignores it. Hermes hardcodes every named custom/local provider's
# runtime identity to "custom" and falls back to a "no-key-required"
# placeholder api_key when none is configured; that placeholder trips a
# dashboard/log warning ("No API key configured for provider 'custom'.
# First message will fail.") on every session even though the request
# actually succeeds. Any non-empty value >=4 chars that isn't one of
# Hermes's known placeholder strings (see hermes_cli/auth.py
# has_usable_secret / _PLACEHOLDER_SECRET_VALUES) clears that check.
raclette_providers:
  goudai-llama-swap:
    base_url: "{{ raclette_auxiliary_base_url }}"
    transport: openai_chat
    api_key: "local-no-auth-required"

# Shared mem0-server on Unraid (ansible/roles/mem0-server).
mem0_api_host: "192.168.20.14"
mem0_api_port: 8888
