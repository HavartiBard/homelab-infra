---
# Defaults for the Raclette (Hermes Agent) deployment role.

# Deployment paths
raclette_deploy_dir: /home/james/docker/raclette
raclette_state_dir: /home/james/.raclette

# Obsidian vault mount (NFS-mounted from Unraid on Jetson)
raclette_obsidian_host_dir: /mnt/user/appdata/obsidian/vaults
raclette_obsidian_container_dir: /vault

# Container settings
raclette_image: nousresearch/hermes-agent:latest
raclette_container_name: raclette
raclette_dashboard_port: 9119
raclette_gateway_port: 8642

# File paths (derived)
raclette_compose_file: "{{ raclette_deploy_dir }}/docker-compose.yml"
raclette_env_file: "{{ raclette_deploy_dir }}/.env"

# Docker compose command
raclette_docker_compose_command: "docker compose"

# UID/GID mapping — must match host james user so container can write to mounted volumes
raclette_uid: 1000
raclette_gid: 1000

# Director playbook URL for this agent
raclette_director_url: "https://director.klsll.com/raclette/mcp"

# LLM configuration — goudai's llama-swap (OpenAI-compatible, no auth, LAN-only).
# Was: openai-codex (OAuth, auth stored in ~/.raclette/auth.json), base_url
# https://chatgpt.com/backend-api/codex, default gpt-5.4-mini, context 65536.
raclette_model_provider: goudai-llama-swap
raclette_model_default: "qwen/qwen3.6-35b-a3b-mtp"
raclette_model_context_length: 131072
raclette_model_base_url: "http://192.168.20.150:8010/v1"

# Extra entries for the config.yaml `providers:` section — custom
# OpenAI-compatible endpoints keyed by provider name (referenced by
# raclette_model_provider above).
raclette_providers:
  goudai-llama-swap:
    base_url: "{{ raclette_model_base_url }}"
    transport: openai_chat
