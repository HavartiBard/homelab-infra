---
- name: Fail when Slack tokens are not configured
  ansible.builtin.fail:
    msg: |
      Slack tokens not set for Raclette.
      Export RACLETTE_SLACK_BOT_TOKEN, RACLETTE_SLACK_APP_TOKEN, and RACLETTE_SLACK_ALLOWED_USERS before running.
  when: >
    raclette_env.SLACK_BOT_TOKEN == 'CHANGEME_RACLETTE_SLACK_BOT_TOKEN' or
    raclette_env.SLACK_APP_TOKEN == 'CHANGEME_RACLETTE_SLACK_APP_TOKEN' or
    raclette_env.SLACK_ALLOWED_USERS == 'CHANGEME_SLACK_MEMBER_IDS'

- name: Fail when dashboard auth is not configured
  ansible.builtin.fail:
    msg: |
      Dashboard auth not set for Raclette (required — the s6-overlay image refuses to
      start the dashboard on a non-loopback bind without an auth provider).
      Export RACLETTE_DASHBOARD_USER and RACLETTE_DASHBOARD_PASSWORD before running.
  when: >
    raclette_env.HERMES_DASHBOARD_BASIC_AUTH_USERNAME == 'CHANGEME_RACLETTE_DASHBOARD_USER' or
    raclette_env.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD == 'CHANGEME_RACLETTE_DASHBOARD_PASSWORD'

- name: Fail when API server key is not configured
  ansible.builtin.fail:
    msg: |
      API server key not set for Raclette (required — the API server gives full
      toolset access, including terminal commands, and refuses to run without a
      bearer key even on a loopback bind; this deployment binds it LAN-wide).
      Export RACLETTE_API_SERVER_KEY before running.
  when: raclette_env.API_SERVER_KEY == 'CHANGEME_RACLETTE_API_SERVER_KEY'

- name: Fail when Raclette Mem0 API key is not configured
  ansible.builtin.fail:
    msg: |
      Mem0 API key not set for Raclette. Bootstrap it first (see
      docs/superpowers/plans/2026-07-25-mem0-hermes-memory.md Task 4), then
      export RACLETTE_MEM0_API_KEY before running.
  when: raclette_env.MEM0_API_KEY == 'CHANGEME_RACLETTE_MEM0_API_KEY'

- name: Ensure Raclette deploy directory exists
  ansible.builtin.file:
    path: "{{ raclette_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Ensure Raclette state directory exists
  ansible.builtin.file:
    path: "{{ raclette_state_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Render .env for Raclette container
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/.env.j2"
    dest: "{{ raclette_env_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Deploy SOUL.md persona
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/SOUL.md"
    dest: "{{ raclette_state_dir }}/SOUL.md"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    force: true

- name: Render raclette config.yaml
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/config/hermes.yaml.j2"
    dest: "{{ raclette_state_dir }}/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0666'

# user_id/agent_id here are the only thing keeping Raclette's memories
# separate from Lyra's on the shared mem0-server — isolation is by
# convention, not server-enforced tenancy (mem0's self-hosted API scopes
# by these request-body fields, not by which API key authenticated the
# request). This holds today only because Hermes' mem0 tool schemas never
# expose user_id/agent_id as LLM-controllable parameters (confirmed
# against nousresearch/hermes-agent's plugins/memory/mem0). Don't treat
# per-agent API keys as a security boundary if a third, less-trusted
# agent joins this server or it's ever exposed beyond the LAN.
- name: Render raclette mem0.json
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/config/mem0.json.j2"
    dest: "{{ raclette_state_dir }}/mem0.json"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Ensure Raclette SSH key directory exists
  ansible.builtin.file:
    path: "{{ raclette_state_dir }}/ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Deploy homelab SSH private key for Raclette
  ansible.builtin.copy:
    src: "~/.ssh/id_ed25519_homelab"
    dest: "{{ raclette_state_dir }}/ssh/id_ed25519_homelab"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Deploy homelab SSH public key for Raclette
  ansible.builtin.copy:
    src: "~/.ssh/id_ed25519_homelab.pub"
    dest: "{{ raclette_state_dir }}/ssh/id_ed25519_homelab.pub"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy SSH config for Raclette
  ansible.builtin.copy:
    dest: "{{ raclette_state_dir }}/ssh/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
    content: |
      Host unraid.lab unraid-server 192.168.20.14
          IdentityFile ~/.ssh/id_ed25519_homelab
          User root
      Host *.lab *.klsll.com 192.168.*.*
          IdentityFile ~/.ssh/id_ed25519_homelab
          StrictHostKeyChecking accept-new
          User james

- name: Deploy SSH-agent cont-init script for Raclette
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/ssh-agent-init.sh"
    dest: "{{ raclette_deploy_dir }}/ssh-agent-init.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Render Docker Compose definition
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../files/jetson/raclette/docker-compose.yml.j2"
    dest: "{{ raclette_compose_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy Raclette stack with Docker Compose
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ raclette_deploy_dir }}"
    {{ raclette_docker_compose_command }} pull
    {{ raclette_docker_compose_command }} up -d
  register: raclette_deploy
  changed_when: false
  args:
    executable: /bin/bash

- name: Validate Raclette container is running
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect -f {{ '{{.State.Running}}' }} {{ raclette_container_name }}
  register: raclette_running
  failed_when: raclette_running.stdout | trim != 'true'
  changed_when: false
  args:
    executable: /bin/bash
