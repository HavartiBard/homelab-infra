---
# cAdvisor — runs on Docker hosts only (Unraid, Jetson, spraycheese)
# Uses raw throughout for Unraid compatibility

- name: Create cAdvisor compose dir
  ansible.builtin.raw: |
    mkdir -p {{ cadvisor_compose_dir }}
  changed_when: false

- name: Write cAdvisor compose file
  ansible.builtin.raw: |
    cat > {{ cadvisor_compose_dir }}/compose.yml << 'EOFCOMPOSE'
    services:
      cadvisor:
        image: {{ cadvisor_image }}:{{ cadvisor_version }}
        container_name: cadvisor
        restart: unless-stopped
        privileged: true
        ports:
          - "{{ cadvisor_port }}:8080"
        command:
          - "--disable_metrics=disk"
          - "--docker_only=true"
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:ro
          - /sys:/sys:ro
          - /var/lib/docker/:/var/lib/docker:ro
          - /dev/disk/:/dev/disk:ro
        devices:
          - /dev/kmsg
        security_opt:
          - apparmor=unconfined
        labels:
          net.unraid.docker.icon: "{{ cadvisor_icon }}"
    EOFCOMPOSE
  changed_when: true

- name: Pull cAdvisor image
  ansible.builtin.raw: |
    cd {{ cadvisor_compose_dir }} && docker compose pull
  changed_when: true

- name: Deploy cAdvisor
  ansible.builtin.raw: |
    cd {{ cadvisor_compose_dir }} && docker compose up -d
  changed_when: true

- name: Verify cAdvisor port is reachable
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ cadvisor_port }}"
    timeout: 30
  delegate_to: localhost
  ignore_errors: true
