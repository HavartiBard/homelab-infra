---
proxmox_mcp_image: "ghcr.io/havartibard/mcp-proxmox:latest"
proxmox_mcp_container_name: "mcp-proxmox"
proxmox_mcp_icon: >-
  https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/proxmox.svg
proxmox_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ proxmox_mcp_port }}/mcp

proxmox_mcp_appdata_dir: "/mnt/user/appdata/mcp-proxmox"
proxmox_mcp_env_file: "{{ proxmox_mcp_appdata_dir }}/.env"
# Host port for the MCP service (container listens on proxmox_mcp_container_port)
proxmox_mcp_port: "6974"
proxmox_mcp_container_port: "6971"

proxmox_op_item: "Proxmox MCP Token"
proxmox_host: >-
  {{ lookup('env', 'PROXMOX_MCP_HOST')
  | default(vars.get('proxmox_mcp_host_vault', ''), true)
  | default('', true) | default('') }}
proxmox_port: >-
  {{ lookup('env', 'PROXMOX_MCP_PORT')
  | default(vars.get('proxmox_mcp_port_vault', ''), true)
  | default('', true) | default('8006') }}
proxmox_user: >-
  {{ lookup('env', 'PROXMOX_MCP_USER')
  | default(vars.get('proxmox_mcp_user_vault', ''), true)
  | default('', true) | default('') }}
proxmox_token_name: >-
  {{ lookup('env', 'PROXMOX_MCP_TOKEN_NAME')
  | default(vars.get('proxmox_mcp_token_name_vault', ''), true)
  | default('', true) | default('') }}
proxmox_token_value: >-
  {{ lookup('env', 'PROXMOX_MCP_TOKEN_VALUE')
  | default(vars.get('proxmox_mcp_token_value_vault', ''), true)
  | default('', true) | default('') }}
proxmox_allow_elevated: >-
  {{ lookup('env', 'PROXMOX_MCP_ALLOW_ELEVATED')
  | default(vars.get('proxmox_mcp_allow_elevated_vault', ''), true)
  | default('', true) | default('false') }}

# Timezone
timezone: "America/Phoenix"
