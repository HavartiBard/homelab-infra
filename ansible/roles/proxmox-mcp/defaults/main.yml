---
proxmox_mcp_image: "ghcr.io/havartibard/proxmox-mcp:latest"
proxmox_mcp_container_name: "proxmox-mcp"
proxmox_mcp_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/proxmox.png
proxmox_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ proxmox_mcp_port }}/mcp

proxmox_mcp_appdata_dir: "/mnt/user/appdata/proxmox-mcp"
proxmox_mcp_env_file: "{{ proxmox_mcp_appdata_dir }}/.env"
# Host port for the MCP service (container listens on proxmox_mcp_container_port)
proxmox_mcp_port: "6974"
proxmox_mcp_container_port: "6971"

proxmox_host: "{{ vault_proxmox_mcp_host }}"
proxmox_port: "{{ vault_proxmox_mcp_port }}"
proxmox_user: "{{ vault_proxmox_mcp_user }}"
proxmox_token_name: "{{ vault_proxmox_mcp_token_name }}"
proxmox_token_value: "{{ vault_proxmox_mcp_token_value }}"
proxmox_allow_elevated: "{{ vault_proxmox_mcp_allow_elevated }}"

# Timezone
timezone: "America/Phoenix"
