---
# Deploy IronClaw — all tasks use raw since Unraid lacks Python

- name: Create appdata directories
  ansible.builtin.raw: |
    mkdir -p {{ ironclaw_appdata_dir }}/postgres
    mkdir -p {{ ironclaw_compose_dir }}
  changed_when: false

- name: Generate docker-compose.yml content
  ansible.builtin.set_fact:
    _ironclaw_compose_content: "{{ lookup('template', role_path + '/templates/docker-compose.yml.j2') }}"

- name: Write docker-compose.yml
  ansible.builtin.raw: |
    cat > {{ ironclaw_compose_dir }}/docker-compose.yml << 'EOFCOMPOSE'
    {{ _ironclaw_compose_content }}
    EOFCOMPOSE
  changed_when: true

- name: Generate ironclaw.env content
  ansible.builtin.set_fact:
    _ironclaw_env_content: "{{ lookup('template', role_path + '/templates/ironclaw.env.j2') }}"

- name: Write ironclaw.env (no_log to protect secrets)
  ansible.builtin.raw: |
    cat > {{ ironclaw_compose_dir }}/ironclaw.env << 'EOFENV'
    {{ _ironclaw_env_content }}
    EOFENV
    chmod 600 {{ ironclaw_compose_dir }}/ironclaw.env
  changed_when: true
  no_log: true

- name: Check if ironclaw image already exists
  ansible.builtin.raw: |
    docker image inspect {{ ironclaw_image }} > /dev/null 2>&1 && echo "exists" || echo "missing"
  register: ironclaw_image_check
  changed_when: false

- name: Clone ironclaw source
  ansible.builtin.raw: |
    rm -rf {{ ironclaw_source_tmp }}
    git clone --depth 1 {{ ironclaw_source_repo }} {{ ironclaw_source_tmp }}
  when: "'missing' in (ironclaw_image_check.stdout | default('')) or (ironclaw_force_rebuild | default(false))"
  changed_when: true

- name: Patch Dockerfile to copy build.rs and tests/ (upstream omits both)
  ansible.builtin.raw: |
    sed -i 's/^RUN cargo build --release --bin ironclaw/COPY build.rs .\/\nCOPY tests\/ tests\/\nRUN cargo build --release --bin ironclaw/' {{ ironclaw_source_tmp }}/Dockerfile
  when: "'missing' in (ironclaw_image_check.stdout | default('')) or (ironclaw_force_rebuild | default(false))"
  changed_when: true

- name: Build ironclaw Docker image (multi-stage Rust build — takes 5-15 min first run)
  ansible.builtin.raw: |
    docker build -t {{ ironclaw_image }} {{ ironclaw_source_tmp }}
  when: "'missing' in (ironclaw_image_check.stdout | default('')) or (ironclaw_force_rebuild | default(false))"
  register: build_result
  changed_when: build_result.rc == 0

- name: Clean up source clone
  ansible.builtin.raw: |
    rm -rf {{ ironclaw_source_tmp }}
  when: "'missing' in (ironclaw_image_check.stdout | default('')) or (ironclaw_force_rebuild | default(false))"
  changed_when: false

- name: Deploy compose stack
  ansible.builtin.raw: |
    cd {{ ironclaw_compose_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for IronClaw to be healthy (up to 60s)
  ansible.builtin.raw: |
    for i in $(seq 1 12); do
      if curl -sf http://localhost:{{ ironclaw_port }}/ > /dev/null 2>&1; then
        echo "healthy"; exit 0
      fi
      sleep 5
    done
    echo "timeout waiting for ironclaw" >&2; exit 1
  changed_when: false

- name: Display container logs (last 20 lines)
  ansible.builtin.raw: |
    docker logs --tail 20 {{ ironclaw_container_name }} 2>&1
  register: ironclaw_logs
  changed_when: false

- name: Show IronClaw logs
  ansible.builtin.debug:
    msg: "{{ ironclaw_logs.stdout_lines | default([]) }}"
