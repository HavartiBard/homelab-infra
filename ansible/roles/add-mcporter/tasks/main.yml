---
# Adds mcporter to any Docker container image.
# Uses only raw tasks — works on Unraid (no Python) and Jetson (Python present).
#
# Strategy: extend the base image with a thin layer that:
#   1. Installs node/npm if not present (handles both openclaw which has node
#      and ironclaw which does not)
#   2. npm install -g mcporter
# Rebuilds mcporter_target_image (defaults to mcporter_base_image, in-place).
# Re-run this playbook after any upstream image update.

- name: Write Dockerfile for mcporter layer
  ansible.builtin.raw: |
    mkdir -p {{ mcporter_build_dir }}
    cat > {{ mcporter_build_dir }}/Dockerfile.mcporter << 'EODOCKERFILE'
    FROM {{ mcporter_base_image }}
    USER root
    RUN command -v node >/dev/null 2>&1 \
        || (apt-get update \
            && apt-get install -y --no-install-recommends nodejs npm \
            && rm -rf /var/lib/apt/lists/*) \
        && npm install -g mcporter \
        && mv /usr/local/bin/mcporter /usr/local/bin/mcporter-real \
        && printf '#!/bin/sh\nexec /usr/local/bin/mcporter-real --config {{ mcporter_config_path }} "$@"\n' > /usr/local/bin/mcporter \
        && chmod +x /usr/local/bin/mcporter{% if mcporter_install_ansible | default(false) | bool %}

    RUN apt-get update -qq \
        && apt-get install -y --no-install-recommends python3-pip \
        && pip3 install --quiet ansible \
        && rm -rf /var/lib/apt/lists/*{% endif %}{% if mcporter_container_user %}

    USER {{ mcporter_container_user }}{% endif %}

    EODOCKERFILE
  changed_when: true

- name: Build {{ mcporter_target_image }} with mcporter layer
  ansible.builtin.raw: >
    docker build
    -t {{ mcporter_target_image }}
    -f {{ mcporter_build_dir }}/Dockerfile.mcporter
    {{ mcporter_build_dir }}
  changed_when: true

- name: Remove Dockerfile.mcporter scratch file
  ansible.builtin.raw: rm -f {{ mcporter_build_dir }}/Dockerfile.mcporter
  changed_when: false

- name: Recreate {{ mcporter_container_name }} with updated image
  ansible.builtin.raw: >
    docker compose -f {{ mcporter_compose_dir }}/docker-compose.yml
    up -d --force-recreate {{ mcporter_container_name }}
  changed_when: true

- name: Verify mcporter is available in {{ mcporter_container_name }}
  ansible.builtin.raw: docker exec {{ mcporter_container_name }} mcporter --version
  register: _mcporter_version
  changed_when: false

- name: Show installed mcporter version
  ansible.builtin.debug:
    msg: "mcporter {{ _mcporter_version.stdout | trim }} installed in {{ mcporter_container_name }}"
