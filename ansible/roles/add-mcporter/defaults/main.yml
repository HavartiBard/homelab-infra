---
# Required vars (no defaults — must be set by playbook):
#   mcporter_base_image      - image to extend (e.g. ghcr.io/openclaw/openclaw:latest)
#   mcporter_container_name  - container to recreate after build (e.g. openclaw)
#   mcporter_compose_dir     - directory containing docker-compose.yml

# Optional:
#   mcporter_container_user  - USER to restore at end of Dockerfile (e.g. node, ironclaw)
#                              leave empty to omit USER instruction
#   mcporter_target_image    - image tag to write to; defaults to mcporter_base_image (in-place)
#   mcporter_build_dir       - scratch dir for Dockerfile; defaults to mcporter_compose_dir

mcporter_target_image: "{{ mcporter_base_image }}"
mcporter_build_dir: "{{ mcporter_compose_dir }}"
mcporter_container_user: ""
# Path inside the container where mcporter.json will live (must be in a mounted volume to persist)
mcporter_config_path: "/home/node/.openclaw/mcporter.json"
# Install ansible (python3-pip + pip3 install ansible) into the image layer.
# Enable for containers that need to run ansible-playbook (e.g. openclaw/raclette).
mcporter_install_ansible: false
# Install docker CLI (docker.io) into the image layer.
# Enable for containers that need to spawn Docker sandbox containers (e.g. openclaw with tools.exec.host=sandbox).
mcporter_install_docker: false
# Install network inspection tools (iproute2/ss, ufw, nftables) and grant the node user
# passwordless sudo for read-only invocations of those tools.
# Enable for openclaw/agent containers that need host network/firewall visibility.
mcporter_install_network_tools: false
# Install zsh into the image layer.
# Enable for containers where `oc shell` / interactive debugging is needed.
# Without this, zsh must be installed at runtime (lost on container recreate).
mcporter_install_zsh: false
# Create a /usr/local/bin/openclaw wrapper script that calls `node /app/dist/index.js`.
# Enable when the base image is ghcr.io/openclaw/openclaw so the agent can invoke the
# openclaw CLI (security audit, update status, etc.) via exec.
mcporter_install_openclaw_cli: false
