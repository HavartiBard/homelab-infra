---
# Using raw commands throughout — Unraid has no Python.

- name: Ensure Phoenix appdata directory exists
  ansible.builtin.raw: mkdir -p {{ phoenix_appdata }}
  changed_when: false

- name: Ensure Phoenix compose directory exists
  ansible.builtin.raw: mkdir -p {{ phoenix_compose_dir }}
  changed_when: false

- name: Generate Phoenix docker-compose.yml content
  ansible.builtin.set_fact:
    _phoenix_compose_content: "{{ lookup('template', playbook_dir + '/../../files/phoenix/docker-compose.yml') }}"

- name: Write Phoenix docker-compose.yml
  ansible.builtin.raw: |
    cat > {{ phoenix_compose_dir }}/docker-compose.yml << 'EOFCOMPOSE'
    {{ _phoenix_compose_content }}
    EOFCOMPOSE
  changed_when: true

- name: Pull Phoenix image
  ansible.builtin.raw: docker pull {{ phoenix_image }}
  register: pull_phoenix
  changed_when: "'Downloaded newer image' in pull_phoenix.stdout or 'Pull complete' in pull_phoenix.stdout"
  tags: [image]

- name: Deploy Phoenix compose stack
  ansible.builtin.raw: |
    cd {{ phoenix_compose_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for Phoenix UI to be healthy
  ansible.builtin.raw: |
    for i in $(seq 1 24); do
      if curl -sf http://localhost:{{ phoenix_port }}/ > /dev/null 2>&1; then
        echo "healthy"; exit 0
      fi
      sleep 5
    done
    echo "timeout waiting for Phoenix" >&2; exit 1
  changed_when: false
