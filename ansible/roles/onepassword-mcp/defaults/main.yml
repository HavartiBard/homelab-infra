---
# 1Password MCP Server defaults

# Container settings
onepassword_mcp_image: "ghcr.io/havartibard/onepassword-mcp-server:latest"
onepassword_mcp_container_name: "onepassword-mcp"
onepassword_mcp_port: 6975
onepassword_mcp_icon: >-
  https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/1password.svg
onepassword_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ onepassword_mcp_port }}{{ onepassword_mcp_path }}

# MCP settings
onepassword_mcp_host: "0.0.0.0"
onepassword_mcp_transport: "streamable-http"
onepassword_mcp_path: "/mcp"

# 1Password settings (override via environment variable or vault)
op_vault: "AI Wedge"
op_service_account_item: "OP_SERVICE_ACCOUNT_TOKEN"
op_service_account_token: >-
  {{ lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN')
  | default(vars.get('op_service_account_token_vault', ''), true)
  | default('', true) }}

# Timezone
timezone: "America/Phoenix"
