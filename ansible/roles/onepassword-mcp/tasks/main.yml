---
# Deploy 1Password MCP Server container (stdio, proxied via mcp-proxy)
# Uses raw commands since Unraid lacks Python

- name: Create build directory on Unraid
  ansible.builtin.raw: mkdir -p /tmp/onepassword-mcp-build
  changed_when: false

- name: Copy Dockerfile to Unraid
  ansible.builtin.copy:
    src: "{{ onepassword_mcp_dockerfile_dir }}/Dockerfile"
    dest: /tmp/onepassword-mcp-build/Dockerfile
    mode: '0644'

- name: Copy wrapper script to Unraid
  ansible.builtin.copy:
    src: "{{ onepassword_mcp_dockerfile_dir }}/onepassword-mcp-wrapper.js"
    dest: /tmp/onepassword-mcp-build/onepassword-mcp-wrapper.js
    mode: '0755'

- name: Build onepassword-mcp image locally on Unraid
  ansible.builtin.raw: |
    docker build \
      --build-arg ONEPASSWORD_MCP_VERSION={{ onepassword_mcp_version }} \
      -t {{ onepassword_mcp_image }} \
      /tmp/onepassword-mcp-build/
  register: build_result
  changed_when: "'Successfully built' in build_result.stdout or 'writing image' in build_result.stdout"

- name: Stop existing container (if running)
  ansible.builtin.raw: |
    docker stop {{ onepassword_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Remove existing container (if exists)
  ansible.builtin.raw: |
    docker rm {{ onepassword_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Deploy onepassword-mcp container
  ansible.builtin.raw: |
    docker run -d \
      --name {{ onepassword_mcp_container_name }} \
      --restart unless-stopped \
      --label net.unraid.docker.icon='{{ onepassword_mcp_icon }}' \
      -e OP_SERVICE_ACCOUNT_TOKEN='{{ op_service_account_token }}' \
      -e OP_VAULT='{{ op_vault }}' \
      -e TZ='{{ timezone }}' \
      {{ onepassword_mcp_image }}
  register: container_result
  changed_when: container_result.rc == 0
  no_log: true

- name: Wait for container to start
  ansible.builtin.raw: sleep 3
  changed_when: false

- name: Check container is running
  ansible.builtin.raw: |
    docker ps --filter "name={{ onepassword_mcp_container_name }}" --filter "status=running" -q
  register: running_check
  failed_when: running_check.stdout | trim == ""
  changed_when: false

- name: Smoke-test 1password-mcp capabilities
  ansible.builtin.raw: |
    printf '%s\n' \
      '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1"}}}' \
      '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
      '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
      '{"jsonrpc":"2.0","id":3,"method":"prompts/list","params":{}}' \
      '{"jsonrpc":"2.0","id":4,"method":"resources/list","params":{}}' \
    | docker exec -i {{ onepassword_mcp_container_name }} onepassword-mcp-wrapper 2>/dev/null \
    | head -4
  register: smoke_test
  changed_when: false
  failed_when: >-
    'protocolVersion' not in smoke_test.stdout
    or 'vault_list' not in smoke_test.stdout
    or 'generate-secure-password' not in smoke_test.stdout
    or 'onepassword://config' not in smoke_test.stdout

- name: Display smoke test result
  ansible.builtin.debug:
    msg: "1password-mcp smoke test passed: {{ smoke_test.stdout[:120] }}"
  when: smoke_test.stdout is defined

- name: Restart mcp-proxy to reconnect onepassword stdio session
  ansible.builtin.raw: |
    if docker ps --filter "name=^/{{ onepassword_mcp_proxy_container_name }}$" --filter "status=running" -q | grep -q .; then
      docker restart {{ onepassword_mcp_proxy_container_name }}
    else
      echo "{{ onepassword_mcp_proxy_container_name }} not running"
    fi
  register: mcp_proxy_restart
  changed_when: "onepassword_mcp_proxy_container_name in mcp_proxy_restart.stdout"

- name: Restart Director to refresh proxied MCP clients
  ansible.builtin.raw: |
    if docker ps --filter "name=^/{{ onepassword_mcp_director_container_name }}$" --filter "status=running" -q | grep -q .; then
      docker restart {{ onepassword_mcp_director_container_name }}
    else
      echo "{{ onepassword_mcp_director_container_name }} not running"
    fi
  register: director_restart
  changed_when: "onepassword_mcp_director_container_name in director_restart.stdout"
