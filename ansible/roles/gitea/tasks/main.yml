---
- name: Assert Gitea credentials are provided
  ansible.builtin.assert:
    that:
      - gitea_db_password | length > 0
      - gitea_admin_password | length > 0
    fail_msg: "Set GITEA_DB_PASSWORD/GITEA_ADMIN_PASSWORD env vars (from 1Password 'Gitea DB Credentials'/'Gitea Service Credentials'), e.g. via ansible/envs/gitea.env"

- name: Ensure appdata and stack directories exist
  ansible.builtin.raw: |
    mkdir -p {{ gitea_appdata_root }} \
             {{ gitea_data_dir }} \
             {{ gitea_registry_root }} \
             {{ gitea_db_data_dir }} \
             {{ gitea_stack_root }}
  changed_when: false

- name: Check for dedicated Docker network
  ansible.builtin.raw: |
    docker network inspect {{ gitea_network_name }}
  register: gitea_network_inspect
  changed_when: false
  failed_when: false

- name: Fail when network is missing and auto-creation is disabled
  ansible.builtin.fail:
    msg: |
      Dedicated Docker network {{ gitea_network_name }} is missing,
      and gitea_manage_network is false.
      Create the network manually (matching {{ gitea_subnet }}/{{ gitea_gateway }})
      or enable automated creation by setting gitea_manage_network: true.
  when: gitea_network_inspect.rc != 0 and not gitea_manage_network

- name: Check for docker compose plugin
  ansible.builtin.raw: |
    if docker compose version >/dev/null 2>&1; then
      echo "docker_compose=1"
    else
      exit 1
    fi
  register: docker_compose_plugin
  changed_when: false
  ignore_errors: true

- name: Check for legacy docker-compose
  ansible.builtin.raw: |
    if {{ compose_bin_path }} version >/dev/null 2>&1; then
      echo "docker_compose_legacy=1"
    else
      exit 1
    fi
  register: docker_compose_legacy
  changed_when: false
  ignore_errors: true

- name: Install docker-compose binary when missing
  ansible.builtin.raw: |
    set -euo pipefail
    if ! command -v {{ compose_bin_path }} >/dev/null 2>&1; then
      curl -fsSL "{{ compose_download_url }}" -o {{ compose_bin_path }}
      chmod +x {{ compose_bin_path }}
    fi
  when:
    - docker_compose_plugin.rc != 0
    - docker_compose_legacy.rc != 0

- name: Select compose command
  ansible.builtin.set_fact:
    docker_compose_command: >-
      {{ 'docker compose'
      if docker_compose_plugin.rc == 0
      else compose_bin_path }}

- name: Create or verify dedicated Docker network
  ansible.builtin.raw: |
    set -euo pipefail
    if ! docker network inspect {{ gitea_network_name }} >/dev/null 2>&1; then
      docker network create \
        -d {{ gitea_network_driver }} \
        --subnet {{ gitea_subnet }} \
        --gateway {{ gitea_gateway }} \
        --opt parent={{ gitea_parent_iface }} \
        {{ gitea_network_name }}
    fi
  when: gitea_manage_network and gitea_network_inspect.rc != 0

- name: Render Docker Compose stack definition
  ansible.builtin.raw: |
    set -euo pipefail
    cat <<'EOF' > {{ gitea_stack_root }}/docker-compose.yml
    {{ lookup('template', role_path + '/templates/docker-compose.yml.j2') }}
    EOF

- name: Pull Docker images for Gitea stack
  ansible.builtin.raw: |
    set -euo pipefail
    cd {{ gitea_stack_root }}
    {{ docker_compose_command }} pull

- name: Deploy Gitea stack
  ansible.builtin.raw: |
    set -euo pipefail
    cd {{ gitea_stack_root }}
    {{ docker_compose_command }} up -d

- name: Validate Gitea HTTP endpoint
  ansible.builtin.raw: |
    set -euo pipefail
    attempts=0
    until curl -fsSL http://{{ gitea_ip }}:{{ gitea_http_port }} >/dev/null; do
      attempts=$((attempts + 1))
      if [ $attempts -ge {{ gitea_health_attempts }} ]; then
        echo "Gitea at {{ gitea_ip }}:{{ gitea_http_port }} is unreachable"
        exit 1
      fi
      sleep {{ gitea_health_interval }}
    done

- name: Ensure Gitea admin user exists
  ansible.builtin.shell: >
    docker exec --user git {{ gitea_container_name }}
    gitea admin user list {{ gitea_admin_user }}
  register: gitea_admin_user_check
  changed_when: false
  failed_when: gitea_admin_user_check.rc != 0

- name: Record whether admin exists
  ansible.builtin.set_fact:
    gitea_admin_user_exists: >-
      {{ gitea_admin_user_check.stdout_lines
      | select('search', gitea_admin_user)
      | list
      | length > 0 }}
  changed_when: false

- name: Create Gitea admin user
  ansible.builtin.shell: >
    docker exec --user git {{ gitea_container_name }} \
      gitea admin user create --username {{ gitea_admin_user }} \
      --email {{ gitea_admin_email }} \
      --password '{{ gitea_admin_password }}' \
      --admin --must-change-password false
  when: not gitea_admin_user_exists

- name: Show Docker network details
  ansible.builtin.raw: |
    set -euo pipefail
    docker network inspect {{ gitea_network_name }}
  changed_when: false
