---
# Portainer MCP default variables

# Container settings
portainer_mcp_image: "ghcr.io/havartibard/portainer-mcp:latest"
portainer_mcp_container_name: "portainer-mcp"
portainer_mcp_port: 6972
portainer_mcp_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/portainer.png
portainer_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ portainer_mcp_port }}/mcp

# Paths
portainer_mcp_appdata_dir: "/mnt/user/appdata/portainer-mcp"

# Server settings
portainer_mcp_host: "0.0.0.0"
portainer_mcp_transport: "streamable-http"

# Portainer connection (override in playbook or vars file)
portainer_server: "192.168.20.14:9000"
portainer_op_item: "Portainer API Token"
portainer_token: >-
  {{ lookup('env', 'PORTAINER_TOKEN')
  | default(lookup('pipe', 'op read "op://AI Wedge/Portainer API Token/credential" 2>/dev/null || echo ""'), true)
  | default('', true) }}

# Timezone
timezone: "America/Phoenix"
