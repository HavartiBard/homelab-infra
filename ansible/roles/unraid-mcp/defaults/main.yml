---
# Unraid MCP Server defaults

# Container settings
unraid_mcp_image: "ghcr.io/havartibard/unraid-mcp:latest"
unraid_mcp_container_name: "unraid-mcp"
unraid_mcp_port: 6970
unraid_mcp_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/unraid.png
unraid_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ unraid_mcp_port }}/mcp

# MCP settings
unraid_mcp_host: "0.0.0.0"
unraid_mcp_transport: "streamable-http"

# Unraid GraphQL API settings
unraid_api_url: "https://localhost/graphql"
unraid_op_item: "Unraid GraphQL - Wedge"
unraid_api_key: >-
  {{ lookup('env', 'UNRAID_API_KEY')
  | default(lookup('pipe', 'op read "op://AI Wedge/Unraid GraphQL - Wedge/credential" 2>/dev/null || echo ""'), true)
  | default('', true) }}
unraid_verify_ssl: false
unraid_auto_start_subscriptions: true

# Logging
unraid_mcp_log_level: "INFO"

# Timezone
timezone: "America/Phoenix"
