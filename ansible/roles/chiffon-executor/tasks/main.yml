---
# All tasks use ansible.builtin.raw — Unraid has no Python

- name: Create appdata directory
  ansible.builtin.raw: mkdir -p {{ chiffon_executor_appdata_dir }}
  changed_when: false

- name: Clone chiffon repo if not present
  ansible.builtin.raw: |
    if [ ! -d "{{ chiffon_executor_repo_dir }}/.git" ]; then
      git clone https://code.klsll.com/HavartiBard/chiffon.git {{ chiffon_executor_repo_dir }}
    fi
  changed_when: false

- name: Set git remote URL with embedded token for push auth
  ansible.builtin.raw: >
    git -C {{ chiffon_executor_repo_dir }} remote set-url origin
    https://chiffon-executor:{{ chiffon_executor_token }}@code.klsll.com/HavartiBard/chiffon.git
  changed_when: false

- name: Set git user name in repo
  ansible.builtin.raw: git -C {{ chiffon_executor_repo_dir }} config user.name "{{ chiffon_git_user_name }}"
  changed_when: false

- name: Set git user email in repo
  ansible.builtin.raw: git -C {{ chiffon_executor_repo_dir }} config user.email "{{ chiffon_git_user_email }}"
  changed_when: false

- name: Pull latest from origin
  ansible.builtin.raw: git -C {{ chiffon_executor_repo_dir }} pull --ff-only
  register: git_pull
  changed_when: "'Already up to date' not in git_pull.stdout"

- name: Stop existing container
  ansible.builtin.raw: docker stop {{ chiffon_executor_container_name }} 2>/dev/null || true
  changed_when: false

- name: Remove existing container
  ansible.builtin.raw: docker rm {{ chiffon_executor_container_name }} 2>/dev/null || true
  changed_when: false

- name: Pull container image
  ansible.builtin.raw: docker pull {{ chiffon_executor_image }}
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

- name: Deploy chiffon-executor container
  ansible.builtin.raw: |
    docker run -d \
      --name {{ chiffon_executor_container_name }} \
      --restart unless-stopped \
      -v {{ chiffon_executor_repo_dir }}:/work \
      -e CHIFFON_EXECUTOR_TOKEN='{{ chiffon_executor_token }}' \
      -e PROJECT='{{ chiffon_executor_project }}' \
      -e REPO_PATH=/work \
      -e QUEUE_PATH=/work/tasks/queue \
      -e LMSTUDIO_URL='{{ chiffon_executor_lmstudio_url }}' \
      -e EXECUTION_MODE='{{ chiffon_executor_execution_mode }}' \
      -e CRON_SCHEDULE='{{ chiffon_executor_cron_schedule }}' \
      -e GITEA_BASE_URL=https://code.klsll.com \
      -e TZ={{ timezone }} \
      --label net.unraid.docker.icon='https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gitea.png' \
      {{ chiffon_executor_image }}
  register: deploy_result
  changed_when: true

- name: Wait for container to start
  ansible.builtin.raw: sleep 5
  changed_when: false

- name: Check container is running
  ansible.builtin.raw: >
    docker ps
    --filter "name={{ chiffon_executor_container_name }}"
    --filter "status=running" -q
  register: container_check
  failed_when: container_check.stdout | trim == ""
  changed_when: false

- name: Show recent container logs
  ansible.builtin.raw: docker logs --tail 15 {{ chiffon_executor_container_name }}
  register: container_logs
  changed_when: false

- name: Display container logs
  ansible.builtin.debug:
    msg: "{{ container_logs.stdout | default('') }}"
  when: container_logs.stdout is defined
