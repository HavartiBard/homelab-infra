---
# Role defaults for Nginx Proxy Manager deployment
npm_ip: 192.168.20.50
# Must match Unraid's docker br0 network (still /23); see npm_subnet note in
# group_vars/unraid/unraid.yml — flip to /24 together with the br0 re-mask.
npm_subnet: 192.168.20.0/23
npm_gateway: 192.168.20.1
npm_parent_iface: br0
npm_network_driver: macvlan
npm_network_name: br0
npm_appdata_root: /mnt/user/appdata/npm
npm_stack_root: /mnt/user/appdata/stacks/npm
npm_ui_port: 81
timezone: America/Phoenix
# Docker icon URL for Unraid UI
npm_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nginx-proxy-manager.png
npm_webui_url: "http://{{ npm_ip }}:{{ npm_ui_port }}"
npm_container_name: nginx-proxy-manager
npm_dns_primary: 1.1.1.1
npm_dns_secondary: 1.0.0.1
compose_version: v2.27.0
compose_bin_path: /usr/local/bin/docker-compose
compose_download_url: >-
  https://github.com/docker/compose/releases/download/{{
  compose_version }}/docker-compose-linux-x86_64
acme_output_dir: "{{ npm_appdata_root }}/certs"
enable_external_acme_issuer: false
acme_issuer_type: lego
acme_dns_provider: cloudflare
acme_email: admin@klsll.com
acme_base_domain: klsll.com
acme_wildcard_domain: "*.klsll.com"
acme_dns_env: {}
npm_manage_network: false
npm_manage_proxies: false
npm_manage_dns: false
npm_proxy_config_dir: ""
npm_proxy_config_paths: []
npm_api_base_url: "http://{{ npm_ip }}:{{ npm_ui_port }}/api"
npm_admin_email: "{{ vault_npm_admin_username }}"
npm_admin_password: "{{ vault_npm_admin_password }}"
technitium_api_url: ""
technitium_zone: klsll.com
technitium_admin_user: dns-automation
technitium_api_token: "{{ vault_technitium_api_token }}"
cloudflare_dns_token: "{{ vault_cloudflare_dns_token }}"
