---
# Using raw commands throughout — Unraid has no Python

- name: Create build directory
  ansible.builtin.raw: mkdir -p {{ research_mcp_build_dir }}
  changed_when: false

- name: Copy build files to Unraid
  ansible.builtin.raw: |
    echo '{{ lookup("file", research_mcp_source_dir + "/" + item) | b64encode }}' | base64 -d > {{ research_mcp_build_dir }}/{{ item }}
  loop:
    - Dockerfile
    - requirements.txt
    - hister_client.py
    - server.py
  changed_when: false

- name: Build research-mcp image
  ansible.builtin.raw: |
    cd {{ research_mcp_build_dir }} && docker build -t {{ research_mcp_image }} .
  register: research_mcp_build
  changed_when: research_mcp_build.rc == 0

- name: Create appdata directory
  ansible.builtin.raw: mkdir -p {{ research_mcp_appdata_dir }}
  changed_when: false

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ research_mcp_appdata_dir }}/docker-compose.yml"

- name: Deploy compose stack
  ansible.builtin.raw: |
    cd {{ research_mcp_appdata_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for research-mcp MCP endpoint
  ansible.builtin.raw: |
    for i in $(seq 1 12); do
      code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:{{ research_mcp_port }}/mcp \
        -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"probe","version":"1.0"}}}')
      if [ "$code" = "200" ]; then echo healthy; exit 0; fi
      sleep 5
    done
    echo "timeout waiting for research-mcp" >&2; exit 1
  changed_when: false

- name: Show research-mcp logs
  ansible.builtin.raw: docker logs --tail 20 {{ research_mcp_container_name }} 2>&1
  register: research_mcp_logs
  changed_when: false

- name: Display research-mcp logs
  ansible.builtin.debug:
    msg: "{{ research_mcp_logs.stdout_lines }}"
