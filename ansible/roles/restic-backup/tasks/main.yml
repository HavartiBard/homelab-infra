---
# restic-backup — Unraid raw-only deployment (no Python on Unraid)

- name: Render templates
  ansible.builtin.set_fact:
    _restic_env: "{{ lookup('template', 'restic.env.j2') }}"
    _restic_script: "{{ lookup('template', 'backup.sh.j2') }}"

- name: Create base directories
  ansible.builtin.raw: |
    mkdir -p {{ restic_backup_base }}/dumps
  changed_when: false

- name: Write restic env file (secrets, mode 600)
  ansible.builtin.raw: |
    cat > {{ restic_backup_base }}/restic.env << 'EOFRESTICENV'
    {{ _restic_env }}
    EOFRESTICENV
    chmod 600 {{ restic_backup_base }}/restic.env
  changed_when: true

- name: Write backup script
  ansible.builtin.raw: |
    cat > {{ restic_backup_base }}/backup.sh << 'EOFRESTICSH'
    {{ _restic_script }}
    EOFRESTICSH
    chmod 700 {{ restic_backup_base }}/backup.sh
  changed_when: true

- name: Pull restic image
  ansible.builtin.raw: docker pull {{ restic_backup_image }}
  changed_when: true

- name: Install dynamix cron entries
  ansible.builtin.raw: |
    cat > /boot/config/plugins/dynamix/restic-backup.cron << 'EOFRESTICCRON'
    # Generated by Ansible restic-backup role — nightly backup + weekly check
    {{ restic_backup_cron }} {{ restic_backup_base }}/backup.sh backup >> /var/log/restic-backup.log 2>&1
    {{ restic_check_cron }} {{ restic_backup_base }}/backup.sh check >> /var/log/restic-backup.log 2>&1
    EOFRESTICCRON
    update_cron
  changed_when: true

- name: Verify cron registered
  # Unraid's update_cron assembles plugin crons into /etc/cron.d/root,
  # not the default user crontab — must pass -c /etc/cron.d.
  ansible.builtin.raw: crontab -c /etc/cron.d -l | grep restic-backup
  changed_when: false
