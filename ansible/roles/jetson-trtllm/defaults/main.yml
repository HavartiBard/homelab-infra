---
# Defaults for the Jetson TensorRT LLM deployment role.
trtllm_app_dir: /opt/trtllm
trtllm_image: "dustynv/tensorrt_llm:0.12-r36.4.0"
trtllm_container_name: trtllm-dev
trtllm_shm_size: 8gb
trtllm_command: sleep infinity
trtllm_models_host_dir: /home/james/models/tensorrt_llm
trtllm_cache_host_dir: /home/james/.cache/huggingface
trtllm_models_inside: /data/models/tensorrt_llm
trtllm_cache_inside: /data/hf
trtllm_compose_file: "{{ trtllm_app_dir }}/docker-compose.yml"
trtllm_env_file: "{{ trtllm_app_dir }}/.env"
trtllm_docker_compose_command: "docker compose"
trtllm_docker_packages:
  - docker.io
  - docker-compose-plugin
  - nvidia-container-toolkit
trtllm_support_packages:
  - curl
  - gnupg
  - lsb-release
trtllm_hf_token_env_var: HUGGINGFACE_RO
trtllm_hf_token: >-
  {{ lookup('env', trtllm_hf_token_env_var)
  | default('', true) }}
