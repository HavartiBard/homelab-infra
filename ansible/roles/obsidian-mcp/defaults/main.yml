---
obsidian_mcp_image: "local/obsidian-mcp:latest"
obsidian_mcp_container_name: "obsidian-mcp"
obsidian_mcp_port: 6977
obsidian_mcp_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/obsidian.png
obsidian_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ obsidian_mcp_port }}/mcp
# Migrated from /mnt/user/appdata/obsidian/vaults/homelab to the dedicated
# /mnt/user/obsidian share on 2026-07-23 (see jetson-raclette role defaults
# for the backup tarball location); this matches the container's live mount.
obsidian_vault_path: "/mnt/user/obsidian/homelab"
obsidian_mcp_appdata_dir: "/mnt/user/appdata/obsidian-mcp"
obsidian_mcp_transport_mode: "http"
obsidian_mcp_build_dir: "/tmp/obsidian-mcp-build"
obsidian_mcp_source_dir: "{{ role_path }}/../../../docker/obsidian-mcp-server"
