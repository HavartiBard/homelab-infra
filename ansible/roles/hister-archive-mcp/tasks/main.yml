---
# Using raw commands throughout — Unraid has no Python

- name: Create build directory
  ansible.builtin.raw: mkdir -p {{ hister_archive_mcp_build_dir }}
  changed_when: false

- name: Copy build files to Unraid
  ansible.builtin.raw: |
    echo '{{ lookup("file", hister_archive_mcp_source_dir + "/" + item) | b64encode }}' | base64 -d > {{ hister_archive_mcp_build_dir }}/{{ item }}
  loop:
    - Dockerfile
    - requirements.txt
    - hister_client.py
    - server.py
  changed_when: false

- name: Build hister-archive-mcp image
  ansible.builtin.raw: |
    cd {{ hister_archive_mcp_build_dir }} && docker build -t {{ hister_archive_mcp_image }} .
  register: hister_archive_mcp_build
  changed_when: hister_archive_mcp_build.rc == 0

- name: Create appdata directory
  ansible.builtin.raw: mkdir -p {{ hister_archive_mcp_appdata_dir }}
  changed_when: false

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hister_archive_mcp_appdata_dir }}/docker-compose.yml"

- name: Decommission the old research-mcp stack, if present
  # Must run BEFORE deploying the renamed stack — its network reuses the same
  # pinned subnet, and Docker refuses to create a second network on an
  # overlapping pool while the old one still exists.
  ansible.builtin.raw: |
    removed=""
    if [ -d /mnt/user/appdata/research-mcp ]; then
      (cd /mnt/user/appdata/research-mcp && docker compose down) || true
      rm -rf /mnt/user/appdata/research-mcp
      removed=1
    fi
    if docker ps -a --format '{{ "{{" }}.Names{{ "}}" }}' | grep -qx research-mcp; then
      docker rm -f research-mcp
      removed=1
    fi
    [ -n "$removed" ] && echo CHANGED || echo OK
  register: hister_archive_mcp_old_cleanup
  changed_when: "'CHANGED' in hister_archive_mcp_old_cleanup.stdout"

- name: Deploy compose stack
  ansible.builtin.raw: |
    cd {{ hister_archive_mcp_appdata_dir }} && docker compose up -d --remove-orphans
  changed_when: true

- name: Wait for hister-archive-mcp MCP endpoint
  ansible.builtin.raw: |
    for i in $(seq 1 12); do
      code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:{{ hister_archive_mcp_port }}/mcp \
        -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"probe","version":"1.0"}}}')
      if [ "$code" = "200" ]; then echo healthy; exit 0; fi
      sleep 5
    done
    echo "timeout waiting for hister-archive-mcp" >&2; exit 1
  changed_when: false

- name: Show hister-archive-mcp logs
  ansible.builtin.raw: docker logs --tail 20 {{ hister_archive_mcp_container_name }} 2>&1
  register: hister_archive_mcp_logs
  changed_when: false

- name: Display hister-archive-mcp logs
  ansible.builtin.debug:
    msg: "{{ hister_archive_mcp_logs.stdout_lines }}"
