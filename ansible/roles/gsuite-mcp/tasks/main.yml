---
# Deploy google_workspace_mcp container on Unraid
# Uses raw commands since Unraid lacks Python
# Requires pre-existing /mnt/user/appdata/gsuite-mcp/gauth.json
# (Desktop app OAuth client secrets downloaded from Google Cloud Console)
#
# After deployment, authenticate once via the start_google_auth MCP tool.
# The auth URL redirects to https://gsuite-auth.klsll.com/oauth2callback.

- name: Create gsuite-mcp appdata directories
  ansible.builtin.raw: |
    mkdir -p {{ gsuite_mcp_appdata_dir }}/store_creds
  changed_when: false

- name: Copy Dockerfile to remote
  ansible.builtin.raw: |
    echo '{{ lookup("file", role_path + "/../../../docker/gsuite-mcp/Dockerfile") | b64encode }}' | base64 -d > /tmp/gsuite-mcp-Dockerfile
  changed_when: false

- name: Build gsuite-mcp image (clones google_workspace_mcp from GitHub)
  ansible.builtin.raw: |
    docker build -t {{ gsuite_mcp_image }} -f /tmp/gsuite-mcp-Dockerfile /tmp
  register: build_result
  changed_when: "'Successfully built' in build_result.stdout or 'writing image' in build_result.stdout"

- name: Stop existing container (if running)
  ansible.builtin.raw: |
    docker stop {{ gsuite_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Remove existing container (if exists)
  ansible.builtin.raw: |
    docker rm {{ gsuite_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Deploy gsuite-mcp container
  ansible.builtin.raw: |
    docker run -d \
      --name {{ gsuite_mcp_container_name }} \
      --restart unless-stopped \
      --label net.unraid.docker.icon='{{ gsuite_mcp_icon }}' \
      -p {{ gsuite_mcp_port }}:8000 \
      -v {{ gsuite_mcp_appdata_dir }}/gauth.json:/config/gauth.json:ro \
      -v {{ gsuite_mcp_appdata_dir }}/store_creds:/app/store_creds \
      -e TZ='{{ timezone }}' \
      -e GOOGLE_CLIENT_SECRET_PATH='{{ gsuite_mcp_client_secret_path }}' \
      -e USER_GOOGLE_EMAIL='{{ gsuite_mcp_user_email }}' \
      -e WORKSPACE_EXTERNAL_URL='{{ gsuite_mcp_external_url }}' \
      -e GOOGLE_OAUTH_REDIRECT_URI='{{ gsuite_mcp_oauth_redirect_uri }}' \
      {{ gsuite_mcp_image }}
  register: container_result
  changed_when: container_result.rc == 0

- name: Wait for container to start
  ansible.builtin.raw: |
    sleep 5
  changed_when: false

- name: Check container is running
  ansible.builtin.raw: |
    docker ps --filter "name={{ gsuite_mcp_container_name }}" --filter "status=running" -q
  register: running_check
  failed_when: running_check.stdout | trim == ""
  changed_when: false

- name: Check health endpoint
  ansible.builtin.raw: |
    curl -sf http://localhost:{{ gsuite_mcp_port }}/health
  register: health_check
  changed_when: false

- name: Display health check result
  ansible.builtin.debug:
    msg: "{{ health_check.stdout }}"

- name: Clean up build artifacts
  ansible.builtin.raw: |
    rm -f /tmp/gsuite-mcp-Dockerfile
  changed_when: false
