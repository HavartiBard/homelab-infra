---
- name: Verify Tailscale role is running on Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
    fail_msg: "Host {{ inventory_hostname }} is {{ ansible_distribution }}; this role currently supports Ubuntu only."

- name: Verify the host uses systemd
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: "Host {{ inventory_hostname }} uses {{ ansible_service_mgr }}; tailscaled automation expects systemd."

- name: Ensure apt prerequisites are present
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure Tailscale keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Install Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_base }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: "{{ tailscale_keyring_path }}"
    mode: '0644'

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ tailscale_keyring_path }}] {{ tailscale_repo_base }} {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present

- name: Install Tailscale packages
  ansible.builtin.apt:
    name:
      - tailscale
      - tailscale-archive-keyring
    state: "{{ tailscale_package_state }}"
    update_cache: true

- name: Ensure tailscaled service is enabled and started
  ansible.builtin.service:
    name: "{{ tailscale_service_name }}"
    state: started
    enabled: true
  when: tailscale_manage_service

- name: Enable IPv4 forwarding for subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  when: tailscale_advertise_routes | length > 0

- name: Detect whether any advertised route is IPv6
  ansible.builtin.set_fact:
    tailscale_has_ipv6_routes: "{{ (tailscale_advertise_routes | select('search', ':') | list | length) > 0 }}"
  when: tailscale_advertise_routes | length > 0

- name: Enable IPv6 forwarding when advertising IPv6 routes
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  when:
    - tailscale_advertise_routes | length > 0
    - tailscale_has_ipv6_routes | default(false)

- name: Read current Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_cmd
  changed_when: false
  failed_when: false

- name: Derive current Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{
        (tailscale_status_cmd.stdout | from_json).BackendState
        if tailscale_status_cmd.rc == 0 and (tailscale_status_cmd.stdout | trim | length > 0)
        else 'NeedsLogin'
      }}

- name: Build tailscale up arguments
  ansible.builtin.set_fact:
    tailscale_up_args: "{{ tailscale_up_args_base + tailscale_extra_args }}"
  vars:
    tailscale_up_args_base: >-
      {{
        [
          'tailscale',
          'up',
          '--hostname=' ~ tailscale_hostname,
          '--accept-dns=' ~ (tailscale_accept_dns | ternary('true', 'false')),
          '--accept-routes=' ~ (tailscale_accept_routes | ternary('true', 'false'))
        ]
        + (tailscale_ssh | bool | ternary(['--ssh'], []))
        + ((tailscale_advertise_routes | length > 0) | ternary(['--advertise-routes=' ~ (tailscale_advertise_routes | join(','))], []))
        + (tailscale_advertise_exit_node | bool | ternary(['--advertise-exit-node'], []))
        + ((tailscale_auth_key | length > 0) | ternary(['--auth-key=' ~ tailscale_auth_key], []))
        + (tailscale_force_reauth | bool | ternary(['--force-reauth'], []))
      }}

- name: Bring the node online with the provided auth key
  ansible.builtin.command:
    argv: "{{ tailscale_up_args }}"
  register: tailscale_up_cmd
  changed_when: true
  when:
    - tailscale_auth_key | length > 0
    - tailscale_backend_state != 'Running' or tailscale_force_reauth

- name: Report interactive login command when no auth key is provided
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed and tailscaled is running on {{ inventory_hostname }}.
      Finish login interactively with: {{ tailscale_up_args | reject('match', '^--auth-key=') | join(' ') }}
  when:
    - tailscale_auth_key | length == 0
    - tailscale_backend_state != 'Running'
