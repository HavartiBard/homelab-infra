---
# Homelab MCP default variables

# Container settings
homelab_mcp_image: "ghcr.io/havartibard/homelab-mcp:latest"
homelab_mcp_container_name: "homelab-mcp"
homelab_mcp_port: 6971
homelab_mcp_icon: >-
  https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/terminal.svg
homelab_mcp_webui_url: >-
  http://{{ ansible_host }}:{{ homelab_mcp_port }}/mcp

# Paths
homelab_mcp_appdata_dir: "/mnt/user/appdata/homelab-mcp"
homelab_mcp_config_file: "{{ homelab_mcp_appdata_dir }}/config.yaml"

# Server settings
homelab_mcp_host: "0.0.0.0"
homelab_mcp_transport: "streamable-http"

# Orbi settings (override in playbook or vars file)
orbi_enabled: true
orbi_host: "192.168.1.1"
orbi_op_item: "Orbi Login"
orbi_username: >-
  {{ lookup('env', 'ORBI_USERNAME')
  | default(vars.get('orbi_username_vault', ''), true)
  | default('admin') }}
orbi_password: >-
  {{ lookup('env', 'ORBI_PASSWORD')
  | default(vars.get('orbi_password_vault', ''), true)
  | default('', true) }}
orbi_port: 80
orbi_ssl: false

# Timezone
timezone: "America/Phoenix"

# Logging
log_level: "INFO"
