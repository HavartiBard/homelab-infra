---
# Using raw/shell commands since Unraid lacks Python

- name: Assert Orbi credentials are provided
  ansible.builtin.assert:
    that:
      - orbi_username | length > 0
      - orbi_password | length > 0
    fail_msg: "Set ORBI_USERNAME/ORBI_PASSWORD env vars (from 1Password 'Orbi Login'), e.g. via ansible/envs/homelab-mcp.env"
  when: orbi_enabled

- name: Create appdata directory
  ansible.builtin.raw: mkdir -p {{ homelab_mcp_appdata_dir }}
  changed_when: false

- name: Generate config.yaml content
  ansible.builtin.set_fact:
    config_content: |
      server:
        host: "{{ homelab_mcp_host }}"
        port: {{ homelab_mcp_port }}
        transport: "{{ homelab_mcp_transport }}"

      services:
        orbi:
          enabled: {{ orbi_enabled | lower }}
          host: "{{ orbi_host }}"
          username: "{{ orbi_username }}"
          password: "{{ orbi_password }}"
          port: {{ orbi_port }}
          ssl: {{ orbi_ssl | lower }}

      logging:
        level: "{{ log_level }}"

- name: Write config.yaml
  ansible.builtin.raw: |
    cat > {{ homelab_mcp_config_file }} << 'EOFCONFIG'
    {{ config_content }}
    EOFCONFIG
  changed_when: true
  notify: Restart homelab-mcp container

- name: Check for the shared br0 macvlan network
  ansible.builtin.raw: docker network inspect {{ homelab_mcp_network_name }}
  register: homelab_mcp_network_inspect
  changed_when: false
  failed_when: false

- name: Fail when br0 network is missing
  ansible.builtin.fail:
    msg: |
      Docker network {{ homelab_mcp_network_name }} is missing. It's expected to
      already exist (created by the npm role) — homelab-mcp does not manage its
      creation. Deploy npm first, or create the macvlan network manually.
  when: homelab_mcp_network_inspect.rc != 0

- name: Pull container image
  ansible.builtin.raw: docker pull {{ homelab_mcp_image }}
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

- name: Stop existing container (if running)
  ansible.builtin.raw: docker stop {{ homelab_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Remove existing container (if exists)
  ansible.builtin.raw: docker rm {{ homelab_mcp_container_name }} 2>/dev/null || true
  changed_when: false

- name: Deploy homelab-mcp container
  ansible.builtin.raw: |
    docker run -d \
      --name {{ homelab_mcp_container_name }} \
      --restart unless-stopped \
      --label net.unraid.docker.icon='{{ homelab_mcp_icon }}' \
      --label net.unraid.docker.webui='{{ homelab_mcp_webui_url }}' \
      --network {{ homelab_mcp_network_name }} \
      --ip {{ homelab_mcp_ip }} \
      -v {{ homelab_mcp_config_file }}:/app/config.yaml:ro \
      -e TZ={{ timezone }} \
      {{ homelab_mcp_image }}
  register: deploy_result
  changed_when: true

- name: Wait for container to start
  ansible.builtin.raw: sleep 5
  changed_when: false

- name: Check container is running
  ansible.builtin.raw: docker ps --filter "name={{ homelab_mcp_container_name }}" --filter "status=running" -q
  register: container_check
  failed_when: container_check.stdout | trim == ""
  changed_when: false

- name: Get container logs
  ansible.builtin.raw: docker logs --tail 10 {{ homelab_mcp_container_name }}
  register: container_logs
  changed_when: false

- name: Display container logs
  ansible.builtin.debug:
    msg: "{{ container_logs.stdout_lines }}"
