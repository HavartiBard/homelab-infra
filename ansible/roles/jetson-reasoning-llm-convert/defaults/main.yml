---
# Defaults for cross-compilation of reasoning LLM to TensorRT engine
reasoning_llm_conversion_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
reasoning_llm_conversion_alias: deepseek-r1-distill-qwen-1.5b
reasoning_llm_conversion_dtype: float16
reasoning_llm_conversion_gemm: float16
reasoning_llm_conversion_max_batch_size: 1
reasoning_llm_conversion_max_input_len: 2048
reasoning_llm_conversion_max_seq_len: 8192
reasoning_llm_conversion_convert_script: "/opt/TensorRT-LLM/examples/llama/convert_checkpoint.py"

# Build host settings
reasoning_llm_app_dir: /opt/reasoning-llm
reasoning_llm_container_name: reasoning-llm-dev
reasoning_llm_models_host_dir: /home/james/models/reasoning-llm
reasoning_llm_models_inside: /data/models/reasoning-llm
reasoning_llm_docker_compose_command: "docker compose"

# Target Jetson host for engine transfer
reasoning_llm_jetson_host: jetson.lab
reasoning_llm_jetson_user: james
