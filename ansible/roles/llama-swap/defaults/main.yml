      - "--temp 0.6"
      - "--top-k 20"
      - "--top-p 0.95"
      - "--min-p 0"
      - "--repeat-penalty 1.05"
      - "--cache-prompt"
      - "--cache-reuse 256"
      - "--ctx-checkpoints 10"
      - "--reasoning-budget 4096"
      - "--cache-type-k q8_0"
      - "--cache-type-v q8_0"
      - "--spec-type draft-mtp"
      - "--spec-draft-n-max 5"
