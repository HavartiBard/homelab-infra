      - "--min-p 0"
      - "--repeat-penalty 1.05"
      - "--cache-prompt"
      - "--cache-reuse 256"
      - "--ctx-checkpoints 10"
      - "--cache-type-k q8_0"
      - "--cache-type-v q8_0"
    ttl: 900

  # ── Uncensored chat — 35B-A3B fine-tune ────────────────────────────────
  # Keep this warm with the agent-stack so it stays resident for repeated
  # use, subject to the available VRAM budget.
  "qwen/qwen3.6-35b-uncensored":
    hf: "HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:Q4_K_M"
    alias: "qwen/qwen3.6-35b-uncensored"
    flags:
      - "--jinja"
      - "-ngl 99"
      - "-fa on"
      - "--ctx-size 131072"
      - "--predict 8192"
      - "--parallel 1"
      - "--threads 32"
      - "--metrics"
      - "--slots"
      - "--temp 0.7"
      - "--top-k 20"
      - "--top-p 0.8"
      - "--min-p 0"
      - "--repeat-penalty 1.05"
      - "--cache-prompt"
      - "--cache-reuse 256"
      - "--ctx-checkpoints 10"
      - "--cache-type-k q8_0"
      - "--cache-type-v q8_0"
    # ttl: 0 = never automatically unload (llama-swap semantics — this is
    # the default model for both hermes profiles, so keep it resident
    # rather than paying a cold-load on every idle gap).
    ttl: 0

  # ── 35B-A3B MTP reasoning ───────────────────────────────────────────────
  # Keep this warm with the agent-stack so it stays resident for repeated
  # use, subject to the available VRAM budget.
  "qwen/qwen3.6-35b-a3b-mtp":
