# ── Group configuration ────────────────────────────────────────────────────
#
# llama-swap groups control whether multiple models can be loaded
# simultaneously vs. swap each other out.
#
# Group configuration — keeps the selected always-on agent models warm
# continuously so switching between them has no swap latency.
#
# Keep only models with verified local cache in the persistent agent stack.
llama_swap_groups:
  "agent-stack":
    persistent: true
    swap: false
    exclusive: false
    members:
      - "qwen/qwen3.5-medical-gspo"
      - "qwen/qwen3.6-35b-uncensored"
      - "qwen/qwen3.6-35b-a3b-mtp"
      - "google/gemma-4-e4b-uncensored-hauhaucs-aggressive"

# How long llama-swap waits for a child llama-server to become healthy
# before declaring the spawn a failure. Bumped from the 120s default to
# accommodate cold-load of large models AND first-time GGUF downloads
# (~20GB at typical HF speeds takes 4-6 minutes). The model cache
# (HF_HOME) lives on the Unraid NFS share, not local disk — observed
# cold-load throughput there is ~20-25MB/s, so a ~22GB model can take
# 15-20+ minutes to become healthy even when already "cached". 900s
# clipped a real (successful, non-crashing) load in testing; 1800s
# gives headroom without masking an actually-hung/crashed process for
# too long.
llama_swap_health_check_timeout: 1800

# Health-check tuning for the post-deploy verification task
llama_swap_health_retries: 30
llama_swap_health_delay: 5
