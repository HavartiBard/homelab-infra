---
- name: Create pocketbase-reunion directories
  raw: mkdir -p {{ pocketbase_reunion_base_dir }}/data {{ pocketbase_reunion_base_dir }}/cloudflared

- name: Write cloudflared credentials
  raw: |
    cat > {{ pocketbase_reunion_base_dir }}/cloudflared/creds.json << 'EOFMARKER'
    {{ lookup('template', 'cloudflared-creds.json.j2') }}
    EOFMARKER
    chmod 644 {{ pocketbase_reunion_base_dir }}/cloudflared/creds.json

- name: Write cloudflared config
  raw: |
    cat > {{ pocketbase_reunion_base_dir }}/cloudflared/config.yml << 'EOFMARKER'
    {{ lookup('template', 'cloudflared-config.yml.j2') }}
    EOFMARKER

- name: Write compose.yml
  raw: |
    cat > {{ pocketbase_reunion_base_dir }}/compose.yml << 'EOFMARKER'
    {{ lookup('template', 'compose.yml.j2') }}
    EOFMARKER

- name: Pull images
  raw: docker compose -f {{ pocketbase_reunion_base_dir }}/compose.yml pull

- name: Deploy pocketbase-reunion
  raw: docker compose -f {{ pocketbase_reunion_base_dir }}/compose.yml up -d --remove-orphans

- name: Wait for pocketbase to be ready
  raw: |
    for i in $(seq 1 20); do
      if wget -qO- http://localhost:{{ pocketbase_reunion_port }}/api/health 2>/dev/null | grep -q '"code":200'; then
        echo "PocketBase is up"
        exit 0
      fi
      sleep 3
    done
    echo "Timeout"
    exit 1

- name: Configure Apple Sign In
  raw: |
    wget -qO- --post-data='{"appleAuth":{"enabled":true,"clientId":"{{ pocketbase_reunion_apple_client_id }}","clientSecret":"{{ pocketbase_reunion_apple_client_secret }}","teamId":"{{ pocketbase_reunion_apple_team_id }}","keyId":"{{ pocketbase_reunion_apple_key_id }}"}}' \
      --header='Content-Type: application/json' \
      --header='Authorization: {{ pocketbase_reunion_admin_token }}' \
      http://localhost:{{ pocketbase_reunion_port }}/api/settings > /dev/null && echo "Apple auth configured"
  when: pocketbase_reunion_apple_client_id != '' and pocketbase_reunion_admin_token is defined
