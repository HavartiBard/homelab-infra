services:
  searxng:
    image: "{{ searxng_image }}"
    container_name: searxng
    restart: unless-stopped
    environment:
      TZ: America/Phoenix
    volumes:
      - "{{ searxng_mcp_appdata }}/searxng:/etc/searxng"
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  mcp-searxng:
    image: "{{ searxng_mcp_image }}"
    container_name: mcp-searxng
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/searxng.png"
      net.unraid.docker.webui: "http://192.168.20.14:{{ searxng_mcp_port }}"
    environment:
      TZ: America/Phoenix
      MCP_HTTP_PORT: "3000"
      SEARXNG_URL: "http://searxng:8080"
    ports:
      - "{{ searxng_mcp_port }}:3000"
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  searxng-net:
    driver: bridge
