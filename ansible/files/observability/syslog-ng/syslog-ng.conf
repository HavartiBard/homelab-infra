@version: 4.8
@include "scl.conf"

options {
  keep_hostname(yes);
  use_dns(no);
  time_reopen(10);
};

# Accept syslog over UDP and TCP (RFC3164 + RFC5424)
source s_network {
  syslog(
    transport("udp")
    port(514)
    flags(no-parse)
  );
  syslog(
    transport("tcp")
    port(514)
    flags(no-parse)
  );
  network(
    transport("udp")
    port(514)
  );
  network(
    transport("tcp")
    port(514)
  );
};

# Forward to Loki via HTTP
destination d_loki {
  http(
    url("http://loki:3100/loki/api/v1/push")
    method("POST")
    headers("Content-Type: application/json")
    body('{"streams":[{"stream":{"job":"syslog","host":"${HOST}","facility":"${FACILITY}","severity":"${LEVEL}","program":"${PROGRAM}"},"values":[["${UNIXTIME}000000000","${MSG}"]]}]}')
    timeout(10)
    retries(3)
  );
};

log {
  source(s_network);
  destination(d_loki);
};
