global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - '192.168.20.14:9100'   # unraid-server
          - '192.168.20.100:9100'  # pve-01
          - '192.168.20.101:9100'  # pve-02
          - '192.168.20.2:9100'    # tt1
          - '192.168.20.3:9100'    # tt2
          - '192.168.20.4:9100'    # agh1
          - '192.168.20.5:9100'    # agh2
          - '192.168.20.169:9100'  # jetson.lab
          - '192.168.20.150:9100'  # goudai

  - job_name: cadvisor
    static_configs:
      - targets:
          - '192.168.20.14:8081'   # unraid-server
          - '192.168.20.169:8081'  # jetson.lab
          - '192.168.20.150:8081'  # goudai

  - job_name: llama_cpp
    metrics_path: /metrics
    static_configs:
      - targets:
          - '192.168.20.150:8010'  # goudai personal-agent-llm
        labels:
          service: personal-agent-llm
          model: qwen/qwen3.6-27b-mtp
