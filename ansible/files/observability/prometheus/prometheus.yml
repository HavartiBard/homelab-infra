global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - '192.168.20.14:9100'   # unraid-server
          - '192.168.20.100:9100'  # pve-01
          - '192.168.20.101:9100'  # pve-02
          - '192.168.20.2:9100'    # tt1
          - '192.168.20.3:9100'    # tt2
          - '192.168.20.4:9100'    # agh1
          - '192.168.20.5:9100'    # agh2
          - '192.168.20.169:9100'  # jetson.lab
          - '192.168.20.150:9100'  # goudai
      # spraycheese's DHCP lease has drifted VLANs before (see inventory
      # comment) - scrape via its stable LAN hostname instead of an IP.
      - targets:
          - 'spraycheese.lab.klsll.com:9100'
        labels:
          host: spraycheese

  - job_name: cadvisor
    static_configs:
      - targets:
          - '192.168.20.14:8081'   # unraid-server
          - '192.168.20.169:8081'  # jetson.lab
          - '192.168.20.150:8081'  # goudai
      - targets:
          - 'spraycheese.lab.klsll.com:8081'
        labels:
          host: spraycheese

  - job_name: llama_cpp
    metrics_path: /metrics
    static_configs:
      - targets:
          - '192.168.20.150:8010'  # goudai personal-agent-llm
        labels:
          service: personal-agent-llm
          model: qwen/qwen3.6-27b-mtp

  # Log pipeline self-monitoring (ingestion died silently for 24h once —
  # Loki healthcheck and container status both looked fine, see PR #189)
  - job_name: loki
    static_configs:
      - targets:
          - 'loki:3100'            # same compose network

  - job_name: promtail
    static_configs:
      - targets:
          - '192.168.20.14:9080'   # unraid-server
          - '192.168.20.2:9080'    # tt1
          - '192.168.20.3:9080'    # tt2
          - '192.168.20.4:9080'    # agh1
          - '192.168.20.5:9080'    # agh2
          - '192.168.20.169:9080'  # jetson.lab
          - '192.168.20.150:9080'  # goudai
      - targets:
          - 'spraycheese.lab.klsll.com:9080'
        labels:
          host: spraycheese

  # ComfyUI-specific metrics (queue depth, prompt duration, errors) - polls
  # each host's local ComfyUI API, GPU-agnostic. See ansible/files/comfyui-exporter.
  - job_name: comfyui_exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'spraycheese.lab.klsll.com:9840'
        labels:
          host: spraycheese
          service: comfyui
      - targets:
          - '192.168.20.150:9840'
        labels:
          host: goudai
          service: comfyui

  # NVIDIA GPU metrics (spraycheese only - goudai's AMD GPU is read via sysfs
  # by the comfyui_exporter script instead, see docs/comfyui-observability.md).
  - job_name: nvidia_gpu_exporter
    static_configs:
      - targets:
          - 'spraycheese.lab.klsll.com:9835'
        labels:
          host: spraycheese
