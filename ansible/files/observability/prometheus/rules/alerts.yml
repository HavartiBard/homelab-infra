groups:
  - name: homelab.rules
    rules:
      - alert: HostDown
        expr: up{job="node_exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"
          description: "node_exporter on {{ $labels.instance }} has been unreachable for more than 5 minutes."

      - alert: DiskSpaceLow
        # Fire only when BOTH under 20% free AND under 25 GiB free —
        # large disks at 84% (e.g. goudai, 47G free) are not an emergency.
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 < 20
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} < 25 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is below 20% and 25GiB free."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name!=""}[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has restarted more than 3 times in 10 minutes."

  - name: log-pipeline.rules
    rules:
      # The 2026-06 failure mode: Loki healthy, promtail Up, zero logs flowing.
      # absent() also fires if the loki scrape target itself disappears.
      - alert: LokiNoLogIngestion
        expr: >-
          sum(rate(loki_distributor_lines_received_total[10m])) == 0
          or absent(loki_distributor_lines_received_total)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Loki is not receiving any logs"
          description: "No log lines have reached Loki in 15+ minutes. Check `docker logs promtail` on Unraid and that 192.168.20.14:3100 is published."

      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Promtail on {{ $labels.instance }} is down"
          description: "Promtail metrics endpoint {{ $labels.instance }} has been unreachable for 10 minutes — logs from this host are not being shipped."

      - alert: PromtailNotShipping
        # Per-host stall: promtail is up but hasn't successfully sent anything.
        expr: rate(promtail_sent_entries_total[15m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Promtail on {{ $labels.instance }} is not shipping logs"
          description: "Promtail on {{ $labels.instance }} is running but has sent zero entries to Loki for 15+ minutes (push failures or stalled tail)."

  - name: backup.rules
    rules:
      # Metrics come from the restic-backup role's textfile collector output
      # (/var/lib/node_exporter/textfile_collector/restic_backup.prom).
      - alert: BackupStale
        expr: time() - restic_backup_last_success_timestamp > 26 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Nightly restic backup is stale"
          description: "Last successful restic backup was more than 26h ago. Check /var/log/restic-backup.log on Unraid."

      - alert: BackupNeverRan
        expr: absent(restic_backup_last_success_timestamp)
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: "Restic backup metric is missing"
          description: "restic_backup_last_success_timestamp is absent — backups have never run, the textfile was lost (reboot), or node_exporter is down on Unraid."

      - alert: ResticCheckStale
        expr: time() - restic_check_last_success_timestamp > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Weekly restic repository check is stale"
          description: "Last successful 'restic check' was more than 8 days ago. Run backup.sh check manually on Unraid and inspect /var/log/restic-backup.log."

  - name: comfyui.rules
    # All non-critical (severity: warning) by design - this is a homelab
    # image/video pipeline, not paged infrastructure. See docs/comfyui-observability.md.
    rules:
      - alert: ComfyUIDown
        expr: comfyui_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ComfyUI on {{ $labels.host }} is unreachable"
          description: "The ComfyUI exporter on {{ $labels.host }} has not been able to reach ComfyUI's HTTP API for 2+ minutes."

      - alert: ComfyUIQueueStuck
        expr: >-
          comfyui_queue_pending > 0
          and (rate(comfyui_prompts_completed_total[15m]) + rate(comfyui_prompts_errored_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ComfyUI queue on {{ $labels.host }} is stuck"
          description: "{{ $labels.host }} has prompts pending but none have completed or errored in 15+ minutes."

      - alert: ComfyUIGpuVramHigh
        # nvidia_smi_memory_{used,total}_bytes are utkuozdemir/nvidia_gpu_exporter's
        # documented metric names - verify against the exporter's actual
        # /metrics output during rollout in case the installed version differs.
        expr: >-
          (100 * (1 - (comfyui_vram_free_bytes / comfyui_vram_total_bytes))) > 95
          or (100 * comfyui_amd_gpu_vram_used_bytes / comfyui_amd_gpu_vram_total_bytes) > 95
          or (100 * nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes) > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM on {{ $labels.host }} is above 95%"
          description: "GPU VRAM usage on {{ $labels.host }} has been above 95% for 5+ minutes - generations may start failing with OOM."

      - alert: GoudaiHostMemoryLow
        expr: node_memory_MemAvailable_bytes{host="goudai"} < 10 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Goudai host RAM headroom is below 10 GiB"
          description: "Available host memory on goudai has been below 10 GiB for 5+ minutes. Pause heavy ComfyUI jobs and inspect RAM/swap before ROCm workloads trigger a global OOM."

      - alert: GoudaiComfyUIRSSHigh
        expr: container_memory_rss{name=~"/?comfyui", host="goudai"} > 45 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Goudai ComfyUI RSS is above 45 GiB"
          description: "The goudai ComfyUI container RSS has exceeded 45 GiB for 5+ minutes. The hard container limit is 52 GiB; release models or let the queued job finish before starting another heavy workflow."

      - alert: GoudaiKernelOOM
        expr: increase(homelab_kernel_oom_events_total{host="goudai"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Kernel OOM event detected on goudai"
          description: "Promtail saw a kernel OOM message in goudai's journal. Inspect `journalctl -k`, restart ComfyUI if it was killed, and reboot if ROCm did not recover cleanly."

      - alert: GoudaiAmdgpuFenceTimeout
        expr: increase(homelab_amdgpu_fence_timeout_events_total{host="goudai"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "AMDGPU fence timeout or queue eviction on goudai"
          description: "Promtail saw an AMDGPU fence timeout, queue eviction, or KFD/SVM recovery warning in goudai's journal. Restart ComfyUI after transient events; reboot goudai if the GPU does not recover."

      - alert: ComfyUIRepeatedFailures
        expr: increase(comfyui_prompts_errored_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Repeated ComfyUI generation failures on {{ $labels.host }}"
          description: "{{ $labels.host }} has had more than 3 failed prompts in the last 15 minutes ({{ $labels.workflow_type }})."

      - alert: ComfyUIDiskSpaceLow
        # The generic DiskSpaceLow rule fires at <20%/<25GiB; this is the
        # explicitly-requested <15% threshold, scoped to the ComfyUI hosts by
        # instance (node_exporter doesn't carry a "host" label, only "instance").
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs", instance=~"spraycheese.*|192.168.20.150.*"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs", instance=~"spraycheese.*|192.168.20.150.*"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free - model/output storage for ComfyUI may fill up."
