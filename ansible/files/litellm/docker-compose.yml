services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - /mnt/user/appdata/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_CONFIG: /app/config.yaml
    networks:
      - litellm-net

networks:
  litellm-net:
