version: "3.9"

services:
  research-dashboard:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${RESEARCH_DASHBOARD_IMAGE:-research-dashboard:latest}
    container_name: research-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - TZ=${TZ:-America/Phoenix}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL}
      - LMSTUDIO_AUTH_HEADER=${LMSTUDIO_AUTH_HEADER}
      - LMSTUDIO_JIT_LOAD=${LMSTUDIO_JIT_LOAD}
      - OBSIDIAN_MCP_ENABLED=${OBSIDIAN_MCP_ENABLED}
      - OBSIDIAN_MCP_FOLDER=${OBSIDIAN_MCP_FOLDER}
    volumes:
      - ${RESEARCH_DASHBOARD_APPDATA}:/app/data/research
    labels:
      net.unraid.docker.icon: ${RESEARCH_DASHBOARD_ICON}
      net.unraid.docker.webui: https://research.klsll.com
    networks:
      research-dashboard-net:
        ipv4_address: ${RESEARCH_DASHBOARD_IP}

networks:
  research-dashboard-net:
    external: true
    name: ${RESEARCH_DASHBOARD_NETWORK_NAME:-br0}
