version: "3.8"

services:
  director:
    image: ${DIRECTOR_IMAGE:?DIRECTOR_IMAGE is required}
    container_name: director
    ports:
      - "${DIRECTOR_PORT:-8080}:${DIRECTOR_PORT:-8080}"
    environment:
      - GATEWAY_PORT=${DIRECTOR_PORT:-8080}
      - TZ=${TZ:-America/Phoenix}
    volumes:
      - ${DIRECTOR_DATA_DIR:-./data}:/root/.director
      - /mnt/user/appdata/director:/mnt/user/appdata/director
      - /mnt/user/appdata/director/config:/app/config
    labels:
      - net.unraid.docker.icon=${DIRECTOR_ICON}
      - net.unraid.docker.webui=${DIRECTOR_WEBUI_URL}
    restart: unless-stopped
