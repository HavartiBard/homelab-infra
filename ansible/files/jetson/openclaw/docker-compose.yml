services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    network_mode: host
    command:
      - node
      - dist/index.js
      - gateway
      - --port
      - "18789"
      - --bind
      - lan
    group_add:
      - "994"
    volumes:
      - /home/james/.openclaw:/home/node/.openclaw
      - /home/james/bots/raclette:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/james/.env_container:/home/node/.env_container:ro
      - /home/james/.vault-pass:/home/node/.vault-pass:ro
      - /home/james/.ssh/id_ed25519_homelab:/home/node/.ssh/id_ed25519_homelab:ro
    init: true
    env_file:
      - .env
    environment:
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
