---
proxy_hosts:
  - name: proxmox-ui
    domains:
      - pve.klsll.com
    forward_host: 192.168.20.100
    forward_port: 8006
    scheme: https
    websocket: true
    certificate: klsll-wildcard
    ssl_forced: true
    hsts: true
    http2: true

dns_records:
  - name: pve.klsll.com
    type: A
    value: 192.168.20.50
    ttl: 3600
