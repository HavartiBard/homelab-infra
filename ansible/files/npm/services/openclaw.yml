---
proxy_hosts:
  - name: openclaw-control-ui
    domains:
      - openclaw.klsll.com
    forward_host: 192.168.20.169
    forward_port: 18789
    scheme: http
    websocket: true
    certificate: klsll-wildcard
    ssl_forced: true
    hsts: true
    http2: true
    advanced_config: |
      location / {
        set $openclaw_extra_args "";
        if ($args) {
          set $openclaw_extra_args "&$args";
        }
        proxy_pass http://192.168.20.169:18789$uri?token={{ openclaw_session_token | urlencode }}$openclaw_extra_args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }

dns_records:
  - name: openclaw.klsll.com
    type: A
    value: 192.168.20.50
    ttl: 3600
