services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_cp
      POSTGRES_USER: agent_cp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - /mnt/user/appdata/agent-cp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agent_cp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-cp-net

  backend:
    image: code.klsll.com/havartibard/agent-control-plane-backend:latest
    command: >-
      sh -c "mkdir -p ${AGENT_REPO_ROOT:-/workspace/repo} ${AGENT_WORKTREE_ROOT:-/workspace/agents} && exec node dist/index.js"
    environment:
      DATABASE_URL: postgresql://agent_cp:${POSTGRES_PASSWORD:?required}@postgres:5432/agent_cp
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?required}
      LANGGRAPH_API_URL: ${LANGGRAPH_API_URL:?required}
      RACLETTE_API_URL: ${RACLETTE_API_URL:-http://192.168.20.169:9119}
      RACLETTE_SESSION_TOKEN: ${RACLETTE_SESSION_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-C0AU0620ATX}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_REPO_ROOT: ${AGENT_REPO_ROOT:-/workspace/repo}
      AGENT_WORKTREE_ROOT: ${AGENT_WORKTREE_ROOT:-/workspace/agents}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      SSH_KEY_PATH: /app/ssh/id_ed25519_homelab
      SSH_USER: root
    volumes:
      - /mnt/user/appdata/agent-cp/ssh:/app/ssh:ro
      - /mnt/user/appdata/agent-cp/workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-cp-net

  web:
    image: code.klsll.com/havartibard/agent-control-plane-web:latest
    depends_on:
      - backend