---
# Obsidian stack configuration
couchdb_admin_user: >-
  {{ lookup('env', 'COUCHDB_ADMIN_USER')
  | default(lookup('pipe', 'op read "op://AI Wedge/CouchDB Obsidian Admin/username" 2>/dev/null || echo ""'), true)
  | default('obsidian_admin') }}
couchdb_admin_password: >-
  {{ lookup('env', 'COUCHDB_ADMIN_PASSWORD')
  | default(lookup('pipe', 'op read "op://AI Wedge/CouchDB Obsidian Admin/password" 2>/dev/null || echo ""'), true)
  | default('', true) }}
couchdb_sync_user: >-
  {{ lookup('env', 'COUCHDB_SYNC_USER')
  | default(lookup('pipe', 'op read "op://AI Wedge/CouchDB Obsidian Sync User/username" 2>/dev/null || echo ""'), true)
  | default('obsidian_sync') }}
couchdb_sync_password: >-
  {{ lookup('env', 'COUCHDB_SYNC_PASSWORD')
  | default(lookup('pipe', 'op read "op://AI Wedge/CouchDB Obsidian Sync User/password" 2>/dev/null || echo ""'), true)
  | default('', true) }}

obsidian_vault_path: "/mnt/user/appdata/obsidian/vaults/homelab"
obsidian_mcp_port: 6977
obsidian_mcp_container_name: "obsidian-mcp"
