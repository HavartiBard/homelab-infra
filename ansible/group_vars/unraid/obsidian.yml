---
# Obsidian stack configuration
couchdb_admin_user: "{{ lookup('env', 'COUCHDB_ADMIN_USER') | default(vault_couchdb_admin_user, true) }}"
couchdb_admin_password: "{{ lookup('env', 'COUCHDB_ADMIN_PASSWORD') | default(vault_couchdb_admin_password, true) }}"
couchdb_sync_user: "{{ lookup('env', 'COUCHDB_SYNC_USER') | default(vault_couchdb_sync_user, true) }}"
couchdb_sync_password: "{{ lookup('env', 'COUCHDB_SYNC_PASSWORD') | default(vault_couchdb_sync_password, true) }}"

obsidian_vault_path: "/mnt/user/appdata/obsidian/vaults/homelab"
obsidian_mcp_port: 6977
obsidian_mcp_container_name: "obsidian-mcp"
