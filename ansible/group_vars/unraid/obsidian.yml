---
# Obsidian stack configuration
couchdb_admin_user: "{{ lookup('ansible.builtin.env', 'COUCHDB_ADMIN_USERNAME') | default('', true) }}"
couchdb_admin_password: "{{ lookup('ansible.builtin.env', 'COUCHDB_ADMIN_PASSWORD') | default('', true) }}"
couchdb_sync_user: "{{ lookup('ansible.builtin.env', 'COUCHDB_SYNC_USERNAME') | default('', true) }}"
couchdb_sync_password: "{{ lookup('ansible.builtin.env', 'COUCHDB_SYNC_PASSWORD') | default('', true) }}"

obsidian_vault_path: "/mnt/user/appdata/obsidian/vaults/homelab"
obsidian_mcp_port: 6977
obsidian_mcp_container_name: "obsidian-mcp"
