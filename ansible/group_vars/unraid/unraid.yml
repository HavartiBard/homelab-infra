---
# Variables for Unraid hosts
# Vault variables are loaded from vault.yml in the same directory

# Nginx Proxy Manager dedicated IP deployment variables
npm_ip: 192.168.20.50  # pick an unused VLAN20 address reserved in Technitium
# Must match Unraid's docker br0 network, which is still /23. VLAN 20 design
# was standardized on /24 (2026-06-11) — flip this to /24 when Unraid br0 is
# re-masked in the GUI (Settings > Network Settings) and br0 is recreated.
npm_subnet: 192.168.20.0/23
npm_gateway: 192.168.20.1
npm_parent_iface: br0
npm_network_driver: macvlan
npm_network_name: br0
npm_appdata_root: /mnt/user/appdata/npm
npm_stack_root: /mnt/user/appdata/stacks/npm
npm_ui_port: 81
timezone: America/Phoenix
npm_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nginx-proxy-manager.png
npm_webui_url: >-
  http://{{ npm_ip }}:{{ npm_ui_port }}
npm_dns_primary: 1.1.1.1
npm_dns_secondary: 1.0.0.1
npm_manage_proxies: true
npm_manage_dns: true
npm_proxy_config_dir: "{{ playbook_dir | dirname }}/../files/npm/services"
npm_proxy_config_paths: []
npm_api_base_url: "http://{{ npm_ip }}:{{ npm_ui_port }}/api"

# NPM / DNS credentials
# Migrated to 1Password Environments (ansible/envs/npm.env) — kept here (not
# just in the npm role defaults) because deploy-homepage.yml reads these at
# the play level without including the npm role.
npm_admin_email: "{{ lookup('ansible.builtin.env', 'NPM_ADMIN_EMAIL') | default('', true) }}"
npm_admin_password: "{{ lookup('ansible.builtin.env', 'NPM_ADMIN_PASSWORD') | default('', true) }}"
technitium_api_url: "http://192.168.20.2:5380"
technitium_zone: klsll.com
technitium_admin_user: dns-automation
technitium_api_token: "{{ lookup('ansible.builtin.env', 'TECHNITIUM_API_TOKEN') | default('', true) }}"
# NOTE: reuses the API token value as the admin password, same as before this
# migration — this looks like a pre-existing bug (copy-paste from whenever
# vault_technitium_api_token was introduced), not something this migration
# should silently change. Flagged for confirmation of the correct 1Password
# field; unchanged in behavior for now.
technitium_admin_password: "{{ lookup('ansible.builtin.env', 'TECHNITIUM_API_TOKEN') | default('', true) }}"
cloudflare_dns_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_DNS_TOKEN') | default('', true) }}"

# Optional external ACME issuer
# Set to true to enable the lego/acme.sh helper container.
enable_external_acme_issuer: false
acme_issuer_type: lego
acme_dns_provider: cloudflare
acme_output_dir: "{{ npm_appdata_root }}/certs"
acme_email: admin@klsll.com
acme_base_domain: klsll.com
acme_wildcard_domain: "*.klsll.com"
acme_dns_env: {}

# MCP credentials needed by deploy-homepage.yml, which reads these at the
# play level without including the owning role (unraid-mcp, homelab-mcp is
# NOT needed here since deploy-homepage.yml doesn't read orbi_*, proxmox-mcp,
# adguard). All other vault_*-sourced vars that used to live here were
# deleted outright once confirmed unused outside their own role's defaults
# (see git history / docs/plans if you need the full list that was removed).
unraid_api_key: "{{ lookup('ansible.builtin.env', 'UNRAID_API_KEY') | default('', true) }}"
proxmox_user: "{{ lookup('ansible.builtin.env', 'PROXMOX_USER') | default('', true) }}"
proxmox_token_name: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_NAME') | default('', true) }}"
proxmox_token_value: "{{ lookup('ansible.builtin.env', 'PROXMOX_TOKEN_VALUE') | default('', true) }}"
adguard_admin_user: "{{ lookup('ansible.builtin.env', 'ADGUARD_ADMIN_USERNAME') | default('', true) }}"
adguard_admin_password: "{{ lookup('ansible.builtin.env', 'ADGUARD_ADMIN_PASSWORD') | default('', true) }}"

# Promtail: Unraid has no systemd journal — Docker socket logs only
promtail_unraid_mode: true
promtail_scrape_journal: false
# NPM runs on Unraid as a macvlan (br0) container at 192.168.20.50 and
# writes its access/error logs to files under appdata.
promtail_npm_log_path: /mnt/user/appdata/npm/data/logs

# Gitea Git and registry service on Unraid
gitea_ip: 192.168.20.52
gitea_db_ip: 192.168.20.53
gitea_admin_email: james@klsll.com
gitea_domain: code.klsll.com
gitea_registry_host: registry.klsll.com
gitea_appdata_root: /mnt/user/appdata/gitea
gitea_stack_root: /mnt/user/appdata/stacks/gitea
gitea_ssh_domain: gitea.klsll.com
