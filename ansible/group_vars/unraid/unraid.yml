---
# Variables for Unraid hosts
# Vault variables are loaded from vault.yml in the same directory

# Nginx Proxy Manager dedicated IP deployment variables
npm_ip: 192.168.20.50  # pick an unused VLAN20 address reserved in Technitium
npm_subnet: 192.168.20.0/23
npm_gateway: 192.168.20.1
npm_parent_iface: br0
npm_network_driver: macvlan
npm_network_name: br0
npm_appdata_root: /mnt/user/appdata/npm
npm_stack_root: /mnt/user/appdata/stacks/npm
npm_ui_port: 81
timezone: America/Phoenix
npm_icon: >-
  https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nginx-proxy-manager.png
npm_webui_url: >-
  http://{{ npm_ip }}:{{ npm_ui_port }}
npm_dns_primary: 1.1.1.1
npm_dns_secondary: 1.0.0.1
npm_manage_proxies: true
npm_manage_dns: true
npm_proxy_config_dir: "{{ playbook_dir | dirname }}/../files/npm/services"
npm_proxy_config_paths: []
npm_api_base_url: "http://{{ npm_ip }}:{{ npm_ui_port }}/api"

# OpenClaw gateway session token (redirects the UI tokenized link)
openclaw_session_token: >-
  {{ lookup('env', 'OPENCLAW_SESSION_TOKEN')
  | default('CHANGEME_OPENCLAW_SESSION_TOKEN', true) }}


# Credentials: env or vault only (no op lookups)
npm_admin_email: >-
  {{ lookup('env', 'NPM_ADMIN_EMAIL')
  | default(npm_admin_email_vault | default('', true), true) }}
npm_admin_password: >-
  {{ lookup('env', 'NPM_ADMIN_PASSWORD')
  | default(npm_admin_password_vault | default('', true), true) }}
technitium_api_url: "http://192.168.20.2:5380"
technitium_zone: klsll.com
technitium_admin_user: dns-automation
technitium_api_token: >-
  {{ lookup('env', 'TECHNITIUM_API_TOKEN')
  | default(technitium_api_token_vault | default('', true), true) }}
technitium_admin_password: >-
  {{ lookup('env', 'TECHNITIUM_ADMIN_PASSWORD')
  | default(technitium_admin_password_vault | default('', true), true) }}
cloudflare_dns_token: >-
  {{ lookup('env', 'CLOUDFLARE_API_TOKEN')
  | default(cloudflare_dns_token_vault | default('', true), true) }}
# Optional external ACME issuer
# Set to true to enable the lego/acme.sh helper container.
enable_external_acme_issuer: false
acme_issuer_type: lego
acme_dns_provider: cloudflare
acme_output_dir: "{{ npm_appdata_root }}/certs"
acme_email: admin@klsll.com
acme_base_domain: klsll.com
acme_wildcard_domain: "*.klsll.com"
acme_dns_env: {}

# MCP credentials (loaded from 1Password service account)
unraid_api_key: >-
  { lookup('env', 'UNRAID_API_KEY')
  | default(unraid_api_key_vault | default('', true), true) }
orbi_username: >-
  { lookup('env', 'ORBI_USERNAME')
  | default(orbi_username_vault | default('', true), true) }
orbi_password: >-
  { lookup('env', 'ORBI_PASSWORD')
  | default(orbi_password_vault | default('', true), true) }
op_service_account_token: >-
  { lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN')
  | default(op_service_account_token_vault | default('', true), true) }
proxmox_host: >-
  { lookup('env', 'PROXMOX_HOST')
  | default(proxmox_mcp_host_vault | default('', true), true) }
proxmox_port: >-
  { lookup('env', 'PROXMOX_PORT')
  | default(proxmox_mcp_port_vault | default('', true), true) }
proxmox_user: >-
  { lookup('env', 'PROXMOX_USER')
  | default(proxmox_mcp_user_vault | default('', true), true) }
proxmox_token_name: >-
  { lookup('env', 'PROXMOX_TOKEN_NAME')
  | default(proxmox_mcp_token_name_vault | default('', true), true) }
proxmox_token_value: >-
  { lookup('env', 'PROXMOX_TOKEN_VALUE')
  | default(proxmox_mcp_token_value_vault | default('', true), true) }
proxmox_allow_elevated: >-
  { lookup('env', 'PROXMOX_ALLOW_ELEVATED')
  | default(proxmox_mcp_allow_elevated_vault | default('', true), true) }
adguard_admin_user: >-
  { lookup('env', 'ADGUARD_ADMIN_USER')
  | default(adguard_admin_user_vault | default('', true), true) }
adguard_admin_password: >-
  { lookup('env', 'ADGUARD_ADMIN_PASSWORD')
  | default(adguard_admin_password_vault | default('', true), true) }
gitea_db_password: >-
  {{ lookup('env', 'GITEA_DB_PASSWORD')
  | default(lookup('pipe', 'op read "op://AI Wedge/Gitea DB Credentials/password" 2>/dev/null || echo ""'), true)
  | default('', true) }}
gitea_admin_password: >-
  {{ lookup('env', 'GITEA_ADMIN_PASSWORD')
  | default(lookup('pipe', 'op read "op://AI Wedge/Gitea Service Credentials/password" 2>/dev/null || echo ""'), true)
  | default('', true) }}
gitea_mcp_token: >-
  {{ lookup('env', 'GITEA_MCP_TOKEN')
  | default(lookup('env', 'GITEA_TOKEN'), true)
  | default(lookup('pipe', 'op read "op://AI Wedge/Gitea MCP Token/credential" 2>/dev/null || echo ""'), true)
  | default('', true) }}

# Gitea Git and registry service on Unraid
gitea_ip: 192.168.20.52
gitea_db_ip: 192.168.20.53
gitea_admin_email: james@klsll.com
gitea_domain: code.klsll.com
gitea_registry_host: registry.klsll.com
gitea_appdata_root: /mnt/user/appdata/gitea
gitea_stack_root: /mnt/user/appdata/stacks/gitea
gitea_ssh_domain: gitea.klsll.com
