---
# DNS/DHCP VM provisioning variables (Proxmox)
# Secrets: keep API token secret outside git; export PROXMOX_API_TOKEN_SECRET from 1Password.

dns_dhcp_proxmox:
  api_host: "{{ lookup('env', 'PROXMOX_API_HOST') | default('192.168.20.100', true) }}"  # CHANGEME if cluster API host differs
  api_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('root@pam', true) }}"
  api_token_id: "{{ lookup('env', 'PROXMOX_API_TOKEN_ID') | default('root@pam!ansible', true) }}"
  api_token_secret: "{{ lookup('env', 'PROXMOX_API_TOKEN_SECRET') | default('', true) }}"
  validate_certs: false

dns_dhcp_vm_defaults:
  storage: local-lvm           # LXC rootfs storage
  bridge: vmbr0                # VLAN-aware bridge
  cores: 2
  memory: 2048                 # MB
  disk_gb: 8
  vlan40_for_adguard: false    # set true to attach guest VLAN NICs for AdGuard
  nameserver_bootstrap: 1.1.1.1
  swap: 512

dns_dhcp_gateways:
  vlan1: 192.168.1.1
  vlan20: 192.168.20.1
  vlan30: 192.168.30.1
  vlan40: 192.168.40.1

# LXC templates per node
dns_dhcp_lxc_templates:
  pve-01: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
  pve-02: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst

dns_dhcp_vm_plan:
  - name: tt1
    vmid: 5010
    node: pve-01
    tags: dns;technitium;prod
    ips:
      vlan1: 192.168.1.2/24
      vlan20: 192.168.20.2/24
      vlan30: 192.168.30.2/24

  - name: tt2
    vmid: 5011
    node: pve-02
    tags: dns;technitium;prod
    ips:
      vlan1: 192.168.1.3/24
      vlan20: 192.168.20.3/24
      vlan30: 192.168.30.3/24

  - name: agh1
    vmid: 5012
    node: pve-01
    tags: dns;adguard;prod
    ips:
      vlan1: 192.168.1.4/24
      vlan20: 192.168.20.4/24
      vlan30: 192.168.30.4/24

  - name: agh2
    vmid: 5013
    node: pve-02
    tags: dns;adguard;prod
    ips:
      vlan1: 192.168.1.5/24
      vlan20: 192.168.20.5/24
      vlan30: 192.168.30.5/24
