---
# Raclette (Hermes Agent) — Slack tokens + dashboard auth + API server key
# sourced from RACLETTE_* env vars on the controller
raclette_env:
  SLACK_BOT_TOKEN: >-
    {{ lookup('env', 'RACLETTE_SLACK_BOT_TOKEN') | default('CHANGEME_RACLETTE_SLACK_BOT_TOKEN', true) }}
  SLACK_APP_TOKEN: >-
    {{ lookup('env', 'RACLETTE_SLACK_APP_TOKEN') | default('CHANGEME_RACLETTE_SLACK_APP_TOKEN', true) }}
  SLACK_ALLOWED_USERS: >-
    {{ lookup('env', 'RACLETTE_SLACK_ALLOWED_USERS') | default('CHANGEME_SLACK_MEMBER_IDS', true) }}
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: >-
    {{ lookup('env', 'RACLETTE_DASHBOARD_USER') | default('CHANGEME_RACLETTE_DASHBOARD_USER', true) }}
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: >-
    {{ lookup('env', 'RACLETTE_DASHBOARD_PASSWORD') | default('CHANGEME_RACLETTE_DASHBOARD_PASSWORD', true) }}
  API_SERVER_KEY: >-
    {{ lookup('env', 'RACLETTE_API_SERVER_KEY') | default('CHANGEME_RACLETTE_API_SERVER_KEY', true) }}
  # Camofox browser backend (jo-inc/camofox-browser, deployed alongside
  # Raclette on this same host via ansible/roles/camofox-browser). Hermes'
  # browser tool reads these as env vars, not config.yaml fields — see
  # tools/browser_camofox.py's get_camofox_url()/_auth_headers(). Note the
  # name mismatch: Camofox's own server-side bearer auth is CAMOFOX_ACCESS_KEY,
  # but Hermes' client sends whatever's in CAMOFOX_API_KEY as the bearer
  # token — both must hold the same 1Password "camofox-browser" credential.
  CAMOFOX_URL: "http://192.168.20.169:9377"
  CAMOFOX_API_KEY: >-
    {{ lookup('env', 'RACLETTE_CAMOFOX_API_KEY') | default('CHANGEME_RACLETTE_CAMOFOX_API_KEY', true) }}

# Lyra (public-facing AI influencer profile) — fully separate Hermes stack,
# separate dashboard/gateway auth from raclette_env above. No Slack (or any
# chat platform) integration for Lyra per 2026-07-24 decision — she's driven
# via her dashboard/gateway only. Never share these tokens with hermes-core.
lyra_env:
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: >-
    {{ lookup('env', 'LYRA_DASHBOARD_USER') | default('CHANGEME_LYRA_DASHBOARD_USER', true) }}
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: >-
    {{ lookup('env', 'LYRA_DASHBOARD_PASSWORD') | default('CHANGEME_LYRA_DASHBOARD_PASSWORD', true) }}
  API_SERVER_KEY: >-
    {{ lookup('env', 'LYRA_API_SERVER_KEY') | default('CHANGEME_LYRA_API_SERVER_KEY', true) }}
