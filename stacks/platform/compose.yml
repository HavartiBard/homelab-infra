# Platform Stack - Core Infrastructure Services
# Deploy to: Platform VM (Proxmox) or Unraid
# Includes: Nginx Proxy Manager, Uptime Kuma, Homepage
#
# Note: DNS (Technitium/AdGuard) is deployed to dedicated LXCs via Ansible
#       See: ansible/playbooks/dns/provision-dns-dhcp-services.yml
#
# Prerequisites:
#   - Copy .env.example to .env and fill in values
#   - Create required directories (see docs/runbook.md)
#   - Ports 80, 443 must be available

services:
  # =============================================================================
  # Nginx Proxy Manager - Reverse Proxy with Let's Encrypt
  # =============================================================================
  npm:
    image: jc21/nginx-proxy-manager:2.12.1
    container_name: nginx-proxy-manager
    restart: unless-stopped
    depends_on:
      npm-db:
        condition: service_healthy
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"  # Admin UI
    environment:
      - TZ=${TZ:-America/New_York}
      - DB_MYSQL_HOST=npm-db
      - DB_MYSQL_PORT=3306
      - DB_MYSQL_USER=${NPM_DB_USER:-npm}
      - DB_MYSQL_PASSWORD=${NPM_DB_PASSWORD:?NPM_DB_PASSWORD required}
      - DB_MYSQL_NAME=${NPM_DB_NAME:-npm}
      - DISABLE_IPV6=${NPM_DISABLE_IPV6:-true}
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  npm-db:
    image: mariadb:10.11
    container_name: npm-db
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/New_York}
      - MYSQL_ROOT_PASSWORD=${NPM_DB_ROOT_PASSWORD:?NPM_DB_ROOT_PASSWORD required}
      - MYSQL_DATABASE=${NPM_DB_NAME:-npm}
      - MYSQL_USER=${NPM_DB_USER:-npm}
      - MYSQL_PASSWORD=${NPM_DB_PASSWORD:?NPM_DB_PASSWORD required}
    volumes:
      - npm-db-data:/var/lib/mysql
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # Uptime Kuma - Status Monitoring
  # =============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${KUMA_PORT:-3001}:3001"
    volumes:
      - kuma-data:/app/data
    environment:
      - TZ=${TZ:-America/New_York}
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/info', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Homepage - Homelab Dashboard
  # =============================================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.8.11
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3002}:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=${HOMEPAGE_PUID:-1000}
      - PGID=${HOMEPAGE_PGID:-1000}
      - LOG_LEVEL=${HOMEPAGE_LOG_LEVEL:-info}
    labels:
      net.unraid.docker.icon: ${HOMEPAGE_ICON:-https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png}
      net.unraid.docker.webui: ${HOMEPAGE_WEBUI_URL:-https://home.klsll.com}
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  platform-net:
    driver: bridge
    name: platform-net

# =============================================================================
# Volumes - Named volumes with optional bind mount overrides
# For Unraid: Override in .env or use docker-compose.override.yml
# =============================================================================
volumes:
  npm-data:
    name: npm-data
  npm-letsencrypt:
    name: npm-letsencrypt
  npm-db-data:
    name: npm-db-data
  kuma-data:
    name: kuma-data
