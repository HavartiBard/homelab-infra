# Dev Environment on Unraid
# SSH-accessible dev container with its own LAN IP via macvlan on br0
# - Claude Code, opencode, and full dev tooling
# - Key-only SSH on standard port 22
# - Docker socket for container management
#
# Prerequisites:
#   - Copy .env.example to .env and configure
#   - Add your SSH public key to config/authorized_keys
#   - Ensure br0 bridge interface exists on host

services:
  # =============================================================================
  # Dev Environment - SSH Development Container
  # =============================================================================
  dev-environment:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-environment
    hostname: dev-box
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/visual-studio-code.png
      net.unraid.docker.webui: https://dev.klsll.com
    volumes:
      # Persistent home directory (shell history, git config, tool configs)
      - ${APPDATA_PATH:-/mnt/user/appdata/dev-environment}/home:/home/${DEV_USER:-james}
      # Project workspace
      - ${APPDATA_PATH:-/mnt/user/appdata/dev-environment}/projects:/home/${DEV_USER:-james}/projects
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # 1Password SSH agent socket (from host)
      - ${OP_SSH_AGENT_SOCK:-/home/james/.1password/agent.sock}:/home/${DEV_USER:-james}/.1password/agent.sock:ro
      # Obsidian vault — direct bind mount (container runs on Unraid, no NFS needed).
      # Migrated from /mnt/user/appdata/obsidian/vaults/homelab to the dedicated
      # /mnt/user/obsidian share on 2026-07-23.
      - /mnt/user/obsidian/homelab:/mnt/obsidian
    environment:
      - TZ=${TZ:-America/Phoenix}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-}
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN:-}
      - NOTION_MCP_TOKEN=${NOTION_MCP_TOKEN:-}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - CODEX_CONFIG_FILE=/home/${DEV_USER:-james}/.codex/config.toml
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://spraycheese.lab.klsll.com:1234/v1}
      - DEV_USER=${DEV_USER:-james}
      - DEV_SAFE_MODE=${DEV_SAFE_MODE:-true}
      - DEV_MANAGE_HOME_CONFIGS=${DEV_MANAGE_HOME_CONFIGS:-false}
      - VSCODE_TUNNEL_NAME=${VSCODE_TUNNEL_NAME:-dev-box}
    deploy:
      resources:
        limits:
          memory: ${DEV_MEMORY_LIMIT:-8g}
          cpus: "${DEV_CPU_LIMIT:-4.0}"
    networks:
      br0:
        ipv4_address: ${DEV_IP:-192.168.20.60}
    healthcheck:
      test: ["CMD", "pgrep", "-x", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - seccomp:unconfined

  # =============================================================================
  # Tailscale Sidecar - shares the dev container network namespace
  # =============================================================================
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: dev-environment-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-dev-box}
    restart: unless-stopped
    depends_on:
      - dev-environment
    profiles:
      - tailscale
    network_mode: "service:dev-environment"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata/dev-environment}/tailscale:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=${TAILSCALE_ACCEPT_DNS:-false}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-dev-box}
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:---ssh}
      - TS_ENABLE_HEALTH_CHECK=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - seccomp:unconfined

networks:
  # Use the existing br0 macvlan network on Unraid
  # This gives the container its own LAN IP - no port mapping needed
  # Note: macvlan containers cannot talk to the host directly.
  # Use the Ansible playbook's macvlan shim if host<->container comms are needed.
  br0:
    external: true
