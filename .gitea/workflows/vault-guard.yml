name: vault-guard
# Fail any push/PR where the Ansible vault is not actually encrypted.
# Added after the 2026-06-12 incident where vault.yml sat in git in plaintext.
on:
  push:
  pull_request:

jobs:
  check-vault-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vault.yml is ansible-vault encrypted
        run: |
          f=ansible/group_vars/all/vault.yml
          if [ ! -f "$f" ]; then
            echo "::error::$f missing"; exit 1
          fi
          if ! head -1 "$f" | grep -q '^\$ANSIBLE_VAULT;'; then
            echo "::error::$f is NOT vault-encrypted — refusing. Run: ansible-vault encrypt $f"
            exit 1
          fi
          echo "$f is encrypted ✔"
