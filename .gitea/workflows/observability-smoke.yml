name: observability-smoke

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static checks (config validation — always)
        run: |
          python3 --version
          python3 scripts/test-observability-alerting.py static
      - name: Live checks (requires Unraid stack — push only)
        if: github.event_name == 'push'
        run: |
          python3 --version
          python3 scripts/test-observability-alerting.py live --docker-exec
