[project]
name = "bench"
version = "0.1.0"
description = "LLM endpoint benchmarking — capability catalog + orchestrator + dashboard."
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
]
dashboard = [
  "streamlit>=1.36",
  "pandas",
]
lm-eval = [
  "lm-eval[api]>=0.4.3",
]

[project.scripts]
bench = "bench.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
